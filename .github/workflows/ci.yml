name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# THE THREE LANES BELOW ARE THE ONES A MERGE IS MEANT TO REST ON, and until
# this commit they were the only pytest steps in either workflow that ran
# `pytest -q` and read nothing but its exit code.
#
# That is backwards. The argument for the separate channel is written out in
# full at the `acceptance-any-pytree` step below — `session.exitstatus` is
# last-writer-wins, and a run in which `tests/conftest.py` was ignored, filtered
# out or never reached leaves the summary line byte-identical to a clean one —
# and it was applied only to the two acceptance jobs, which the comments here
# say explicitly must NOT be required checks, plus the release gate. So the
# strongest assertion in the repo sat on the jobs whose red does not block, and
# the jobs whose green does was taken on trust.
#
# "MEANT TO REST ON", NOT "CAN BE REQUIRED". An earlier wording of the sentence
# above claimed these three were "the ones a branch protection rule CAN
# require", and that is false: a rule can name ANY job in this file, `reuse`
# and `dco` included, because required checks are a repo setting and nothing
# here grants or withholds the capability. Every other statement in this file
# about which jobs are required is POLICY ("must NOT be required"), not
# capability, and stays as written. What separates these three is scope plus
# policy — they run the WHOLE suite in the three supported environments (no
# jax, floating jax, pinned 0.10 series), while the two acceptance jobs below
# say in as many words that they must not be required, since a third-party
# library or a GitHub outage can redden them on a day stelling did not change.
# That is why the verdict assertion belongs here.
#
# The verdict was measured in all three of these environments before the
# assertion was added, so none of them is being asked for something it does not
# already produce:
#
#   jax 0.11.0   verdict=made
#   jax 0.10.2   verdict=made
#   no jax       verdict=made
#
# THE PASS COUNTS THAT STOOD HERE ARE GONE, AND THAT IS THE FIX RATHER THAN AN
# OMISSION. This block read `2296 / 2296 / 1185`, was bumped to
# `2297 / 2297 / 1186` one commit later (486862c, where `--collect-only` gives
# 2299 ids -- re-checked), and the tree has been 2348, 2398, 2454 and 2459
# since. A number that moves whenever anyone adds a test, in a comment nobody
# re-runs, is a defect with a delay fuse, and this one had already been lit
# twice. What the counts were evidence FOR is the line above -- all three lanes
# already produce a verdict, which is all the assertion below asks of them --
# and that does not rot.
#
# WHAT TO CHECK INSTEAD, as a comparison between runs of ONE commit rather than
# against a constant written here (same rule, same reason, as the `reuse` job's
# "N / N" instruction further down):
#   * the two jax lanes must report the SAME passed/skipped as EACH OTHER: they
#     collect the same tests, and `--collect-only` ids are byte-identical
#     between the series;
#   * the no-jax lane must report fewer passes and more skips than either, with
#     every one of those skips itemised by the inventory that lane writes;
#   * all three must report `verdict=made`.
# A difference of any size in the first is the signal; equality at any value is
# the pass.
#
# ALL THREE OF THOSE ARE PROSE, NOT GATES — said here because two jobs down
# this workflow does machine-check a pass count (`grep -qE '^2 passed'` on the
# acceptance log, and `'^20 passed'` on the reproducer log), so a reader could
# reasonably assume these are checked too. They are not. Nothing in this file
# compares the two jax lanes to each other; the comparison is an instruction to
# a human reading a PR.
#
# NOT CONVERTED INTO A STEP, and the reason is that it cannot be driven here.
# The two `grep -qE` gates named above — the steps `the two acceptance tests
# must RUN` and `the 18 acceptance tests must RUN`, cited by NAME because a
# line number in this file goes stale the moment anything above it moves, and
# this sentence said `(lines 361 and 632)` at 103f3b6 when they sat at 371 and
# 642, having been correct at 70ed1a5 before edits to this file pushed them
# down — work because each compares one log against a constant INSIDE the job
# that produced it. A cross-lane equality needs the two lanes' counts to meet —
# an artifact upload from each matrix leg and a dependent job that downloads
# both — which is new workflow machinery on the path between a tag and PyPI,
# and this box has no network and no runner, so it could not be driven red
# before landing. Adding a gate whose failure mode has
# never been observed is the defect this branch exists to remove, one level up.
# Whoever has a runner should add it; the shape is: upload
# `${RUNNER_TEMP}/counts-${{ matrix.jax }}` from each lane, then one job that
# downloads both and `diff`s them.
#
# KNOWN-OPEN AND RECORDED RATHER THAN CHANGED: SIX LINE-ANCHORED GREPS OVER
# COLOURED-CAPABLE LOGS. Counted in this file: `^SKIPPED` and `^2 passed` on
# `acceptance.log`, `^SKIPPED` and `^20 passed` on `reproducer.log`, and
# `^(XPASS |\[XPASS|FAILED .*\[XPASS)` and `^XFAIL ` on `property.txt`. Each is
# a `^`-anchored match over a log written by `… | tee`, and each decides
# green/red on a step that `exit 1`s. pytest paints its short-summary lines
# whenever it believes a human is watching, and it believes that whenever
# `FORCE_COLOR` is set — an SGR escape then sits between the start of the line
# and the word being anchored, and every one of these greps misses on output
# that visibly contains what it is looking for. `^SKIPPED` and the XPASS
# alternation FAIL OPEN when they miss; `^2 passed`, `^20 passed` and the
# `^XFAIL ` count fail closed. This is safe here only because GitHub Actions
# does not set `FORCE_COLOR` on the runner — it is a property of the host, not
# of these steps. The same class was live and costing something in
# `tests/test_skip_inventory.py`, whose three children now set `PY_COLORS=0`
# for exactly this reason; `tools/property_check.py` does too. Adding
# `PY_COLORS: 0` to these steps is the same one-line fix, and is NOT done here
# because no runner is available on this box to drive it either way, and a
# workflow edit that cannot be observed is the shape of change this file's own
# header argues against.
#
# (measured in all three environments at 486862c; the two jax lanes re-measured
# at bf905b9 and equal to each other there. Records of two commits, not
# targets -- nothing here is to be bumped to match a future run.)
#
# (the third measured in an interpreter that genuinely does not have jax, not
# with an import hook, since `stelling._optional.available` asks `find_spec`.)
#
# `rm -f` before the run is not tidiness. The step's whole claim is that
# ABSENCE is a failure signal, and absence only means "this session did not
# write one" if nothing else could have left the file there. Driven, with a
# stand-in pytest that writes no verdict and a file already at the path: the
# step exits 0 with `verdict=made` on a session that wrote nothing. GitHub's
# hosted runners give each job a fresh RUNNER_TEMP, so this is inert there
# today; it is one line, it fails closed, and it makes the sentence true
# without depending on that.
jobs:
  test-no-jax:
    name: tests (solvers only, jax uninstalled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers]" pytest
      - name: assert jax is absent
        run: .venv/bin/python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('jax') else 0)"
      - name: pytest, with the skip-inventory verdict asserted off a file channel
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi
      - run: .venv/bin/python -m stelling

  # The FLOATING lane: `[jax]` carries NO UPPER BOUND, so this resolves
  # whatever jax is newest. (This said "`[jax]` is `jax>=0.5`".
  # `pyproject.toml` has read `jax = ["jax>=0.10"]` since c3ff79d — which
  # raised the floor to the verified one and left a comment there saying
  # `>=0.5` "was wrong twice over and measurably so" — so the figure was
  # already false when this line was last edited. What makes the lane float is
  # the missing ceiling, not the floor, so the sentence survived its own
  # figure.) That is deliberate — it is the lane that meets a new series
  # first — but it means this job alone can only ever test ONE series, and
  # which one is decided by PyPI rather than by this file. Job id and name
  # are left alone on purpose: they may be named in branch protection, which
  # is a repo setting and not visible from here.
  #
  # It is self-policing about drifting off the tested set:
  # tests/test_transcribe.py::test_tested_jax_series_is_silent fails the
  # moment the resolved jax is outside TESTED_JAX_SERIES. What it CANNOT do
  # is notice that the other claimed series went untested — that is what the
  # job below is for.
  test-jax:
    name: tests (solvers + jax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      # `pytest-xdist` IN EXACTLY ONE LANE, and it is this one.
      #
      # It is a DEV dependency and never a runtime one, and the skip that
      # gates `tests/test_tripwire_xdist.py` on its absence is properly
      # declared — but no lane installed it, so the five aggregation tests
      # skipped in every one. They are the only executable evidence for both
      # of the items `PLAN-tripwire.md` §2 lists as ASSUMED and for acceptance
      # criterion 4 ("`-n 2` aggregation reports the true total; a lost worker
      # is visible"), which left that criterion verified locally and nowhere
      # else.
      #
      # One lane and not all: the zero-dep job and the jax-0.10 lane must keep
      # NOT having it, or the skip rule in `tests/test_skip_inventory.py` stops
      # being exercised in the direction that matters. Nothing here runs with
      # `-n` — these tests spawn their own workers in subprocesses.
      - run: uv pip install -e ".[solvers,jax]" pytest pytest-xdist
      - name: RESOLVED jax (floating — whatever is newest)
        run: .venv/bin/python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"
      - name: pytest-xdist is present, so the aggregation tests do NOT skip here
        run: .venv/bin/python -c "import xdist; print('pytest-xdist', xdist.__version__)"
      # The verdict channel; see the block above `jobs:` for why it is here.
      - name: pytest, with the skip-inventory verdict asserted off a file channel
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  # The PINNED lane, and the reason it exists is a measured gap, not tidiness.
  #
  # `stelling._optional.TESTED_JAX_SERIES` claims ("0.10", "0.11") — that BOTH
  # series are verified. But every jax lane in this workflow installed
  # `.[solvers,jax]`, whose floor WAS `jax>=0.5` at the time (it is `jax>=0.10`
  # today; c3ff79d raised it, AFTER this lane landed at 1053714, and this
  # sentence was left in the present tense), so every one of them resolved
  # the newest jax and the 0.10 half of that claim rested on a developer's
  # one-off re-verification run, never on CI. The FLOOR was never the
  # mechanism — the absent ceiling is, and it is still absent, which is why
  # this lane is still needed. A constant asserting two series
  # while the machine only ever checks one is exactly the kind of unbacked
  # claim this project does not ship.
  #
  # So: pin the SERIES, not a point release. `jax>=0.10,<0.11` tracks the
  # newest 0.10 patch, which is what "0.10 is tested" should mean — a new
  # 0.10.x that breaks transcription is a thing this lane SHOULD catch, and a
  # frozen `==0.10.2` would hide it.
  #
  # jaxlib is left to resolve from jax rather than pinned separately
  # (measured: jax 0.10.2 pulls jaxlib 0.10.2), but it is CHECKED below,
  # because jaxlib is the actual XLA build and this suite is XLA-sensitive.
  #
  # The series check is not ceremony. `test_tested_jax_series_is_silent` only
  # asserts the resolved jax is in TESTED_JAX_SERIES — it passes on 0.11 too.
  # Without the assertion below, a resolver that quietly handed this job a
  # 0.11 wheel would leave it GREEN while testing nothing the floating lane
  # had not already tested, and the second series would go back to being
  # claimed rather than measured. The whole point of this job is which series
  # it runs, so that is the thing it must not take on trust.
  test-jax-0-10:
    name: tests (solvers + jax 0.10 series)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers]" "jax>=0.10,<0.11" pytest
      - name: RESOLVED jax must really be the 0.10 series
        run: |
          set -euo pipefail
          read -r jax_v jaxlib_v < <(.venv/bin/python -c "import jax, jaxlib; print(jax.__version__, jaxlib.__version__)")
          echo "RESOLVED jax=${jax_v} jaxlib=${jaxlib_v}"
          for pair in "jax:${jax_v}" "jaxlib:${jaxlib_v}"; do
            name="${pair%%:*}"; ver="${pair#*:}"
            case "${ver}" in
              0.10.*) ;;
              *) echo "::error title=the 0.10 lane did not get 0.10::${name} resolved to '${ver}'. This job exists to test the jax 0.10 series that TESTED_JAX_SERIES claims; on any other series it is a duplicate of the floating lane wearing a 0.10 name. Fix the pin, or narrow TESTED_JAX_SERIES to the series CI actually runs."; exit 1 ;;
            esac
          done
      # The verdict channel; see the block above `jobs:` for why it is here.
      - name: pytest, with the skip-inventory verdict asserted off a file channel
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  # THE CONFIGURATION NOBODY RAN, and it is the one a contributor gets.
  #
  # `CONTRIBUTING.md` tells a reader to `pip install -e ".[jax]" --group dev`.
  # That produces jax and no solver wheels — and until this job, no lane in
  # either workflow ran the suite in it. `test-no-jax` has the solvers and no
  # jax; the three jax lanes all install `.[solvers,jax]`; the `property` job
  # is the only one that installs `.[jax]` alone, and it runs
  # `pytest tests/property` and nothing else. So the cell was empty.
  #
  # MEASURED IN THAT CELL BEFORE THIS JOB EXISTED (a real venv with neither
  # wheel, jax 0.11.1, 2026-08-20): **72 failed, 3796 passed, 196 skipped**.
  # Not one of them was a soundness defect — every one was a test that needs a
  # solver to reach the state it asserts and never said so, so what CI was
  # missing was not a broken tool but a whole population of undeclared
  # requirements. Five skips were undisclosed too, in reason strings
  # (`needs z3 wheel`, `z3 not installed`, `needs the cvc5 wheel`) that
  # `tests/test_skip_inventory.py`'s RULES do not carry — invisible in every
  # other lane, because in every other lane those tests do not skip.
  #
  # An earlier count of 16 for this cell was taken by BLOCKING the wheels in a
  # process that had them installed. That method does not survive a session:
  # `tests/test_import_hygiene.py` restores `sys.modules`, and the block was
  # gone from there on. A lane is the only honest way to measure a lane.
  #
  # NO `--group dev` HERE, and the difference is deliberate. The dev group
  # carries `pre-commit` and `reuse`, which this job has no use for, and
  # `hypothesis`, which would make `tests/property` run in a lane that is
  # about the solver-less configuration rather than about properties — the
  # `property` job below is where that belongs and it already installs
  # `.[jax]`. What this job needs from the group is nothing; what it needs
  # from the extras is the absence of one.
  #
  # SO THE TWO SETS OF FIGURES IN THIS COMMENT ARE NOT THE SAME POPULATION,
  # and saying both without saying that would invite the subtraction. The
  # `72 / 3796 / 196` above was measured in the CONTRIBUTING.md environment,
  # WITH the dev group; this job reports `3810 passed, 273 skipped`. They
  # differ twice over:
  #
  #   * ENVIRONMENT. `hypothesis` is a dev-group dependency, so `tests/property`
  #     collects and runs there and import-skips here. Measured on the same
  #     commit (f82b87b), same jax 0.11.1, neither wheel: 4060 tests collected
  #     with the group, 4044 without it.
  #   * TREE. The `72 failed` is a BEFORE reading. Those 72 are the tests that
  #     needed a solver and never said so; 71 of them carry `need_solver` now
  #     (the 72nd row is interval-decided and needs none), so they are counted
  #     among this job's skips rather than among its failures. That conversion
  #     is what the job exists to hold in place.
  #
  # The one number to compare across a change is this job's own, and it is
  # printed by this job on every run.
  test-jax-no-solvers:
    name: tests (jax, no solver wheels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[jax]" pytest
      # The job's whole point is which SOLVERS are absent, so that is the thing
      # it must not take on trust: a transitive dependency that quietly pulled
      # a wheel in would leave this green while testing what `test-jax`
      # already tests.
      #
      # IT ASKS THE GATE, NOT A PROXY FOR IT. `tests/_solver_gate.py` is the
      # one predicate that decides whether every `need_solver` test runs, and
      # it accepts THREE routes: the z3 wheel, the cvc5 wheel, and an external
      # cvc5 binary named by `STELLING_CVC5` or found on PATH — the route the
      # documentation actively recommends, since it is how you get a build the
      # PyPI wheel does not ship. A guard that asked `find_spec("z3"|"cvc5")`
      # proved WHEEL absence and was read as SOLVER absence. Driven, with a
      # `cvc5` shim on PATH and neither wheel installed:
      #
      #   the find_spec guard   -> "jax 0.11.1 — and no solver wheel", exit 0
      #   tests/_solver_gate.py -> HAVE_SOLVER = True
      #   pytest tests/test_scatter_row_gates.py tests/test_inductive.py
      #                         -> 2 failed, 21 passed
      #
      # `ubuntu-latest` ships no cvc5, so CI was never wrong; a contributor
      # reproducing this lane locally was, and nothing told them. Prove
      # absence at TEST time, by the predicate the tests actually consult.
      - name: assert NO SOLVER IS REACHABLE — the gate's own predicate
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import _solver_gate
          from stelling import _optional
          if _solver_gate.HAVE_SOLVER:
              routes = []
              if _optional.available("z3"):
                  routes.append("the z3 wheel is installed")
              if _optional.available("cvc5"):
                  routes.append("the cvc5 wheel is installed")
              binary = _optional.cvc5_binary()
              if binary is not None:
                  routes.append(
                      f"an external cvc5 binary is reachable at {binary!r} "
                      "(STELLING_CVC5, or `cvc5` on PATH)"
                  )
              sys.exit(
                  "this lane exists to run with NO solver reachable, and "
                  "tests/_solver_gate.py reports HAVE_SOLVER = True: "
                  + "; ".join(routes)
                  + ". Every `need_solver` test would RUN here, so this "
                  "job would be testing what test-jax already tests."
              )
          import jax
          print(
              "jax", jax.__version__,
              "— and tests/_solver_gate.py reports HAVE_SOLVER = False",
          )
          PY
      # The verdict channel; see the block above `jobs:` for why it is here.
      - name: pytest, with the skip-inventory verdict asserted off a file channel
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  # THE UNENUMERATED BACKSTOP. Every other lane in this file runs a plain
  # `pytest`, which collects in deterministic file order, so an
  # order-dependent failure is invisible in this repository BY CONSTRUCTION.
  # That is not a theoretical gap: a test in `tests/test_tripwire_arm.py` left
  # stelling's own wrapper installed as jax's live const-fold rule, an
  # unrelated exit-code battery two hundred lines below it went vacuous, and
  # it survived two audit rounds. `tests/_state_guard.py` is the instrument
  # that names such a test; this job is the one that finds the pollution
  # nobody enumerated.
  #
  # NOT A REQUIRED CHECK, and the argument is not the usual third-party one.
  # A shuffled suite is flaky BY DESIGN — it explores a different order every
  # run — and it reports a SYMPTOM ("this test fails after that one") rather
  # than a culprit. Blocking a merge on it would price a real regression and
  # an unlucky ordering the same. It belongs beside the state guard's declared
  # inventory, not instead of it: the inventory says who, this says whether
  # the inventory missed anybody.
  #
  # HOW A RED RUN IS MADE ACTIONABLE, which is the whole difference between
  # this job and noise. Three things, in this order:
  #
  #   1. THE SEED IS PRINTED AND IT IS THE REPRODUCER. `pytest-randomly` puts
  #      `Using --randomly-seed=NNN` in the header; the step below lifts it
  #      into a `::error` annotation together with the exact command that
  #      replays that order. Without it a red run is unreproducible and
  #      therefore unfixable.
  #   2. THE SAME COMMIT IS RE-RUN IN FILE ORDER, in this job, on failure. A
  #      red shuffled run is ambiguous between "an order dependence" and "the
  #      suite is broken", and those have different owners: the second is
  #      already reported by every other lane. `-p no:randomly` in the same
  #      environment separates them, and the annotation says WHICH.
  #   3. NESTED SESSIONS ARE NOT SHUFFLED. `pytester.runpytest` builds a
  #      fresh config and autoloads entry-point plugins, so an installed
  #      `pytest-randomly` reaches the sessions this suite SPAWNS whatever the
  #      parent was told — and several of those plant two or three tests whose
  #      ORDER is the property. Measured before `conftest.deterministic_order_
  #      args` existed, with `-p no:randomly` on the outer command: three runs
  #      of `tests/test_tripwire_plugin.py` gave 2, 2 and 1 failures, against
  #      19 passed every time in a venv without the plugin. That is this job
  #      reporting an order-dependent defect in stelling that is not one.
  #   4. `-p no:cacheprovider` IS NOT SET, on purpose: `--randomly-seed=last`
  #      is how a developer replays the previous order locally, and it reads
  #      the cache.
  #
  # WHAT IT FOUND ON ITS FIRST RUN, recorded because a backstop's first
  # measurement is the only one taken before anybody could design for it: ONE
  # failure in 4136 tests — `test_cvc5_protocol.py`'s anti-vacuity census
  # floor, whose own docstring named the collection order it depended on. It
  # is a module finalizer now, which cannot run before the tests it measures.
  # Nothing else in the suite moved.
  #
  # `pytest-randomly` IS INSTALLED IN THIS LANE AND NOWHERE ELSE, exactly as
  # `pytest-xdist` is installed only in `test-jax`. It is a CI-only tool, not
  # a dev-group dependency: a contributor whose local suite reordered itself
  # every run would learn to distrust it.
  random-order:
    name: whole suite, randomised order (NOT a required check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest pytest-randomly
      - name: the suite, shuffled — and the seed, which is the reproducer
        run: |
          set -euo pipefail
          # THE SEED IS CHOSEN HERE, NOT SCRAPED. `pytest-randomly` prints
          # `Using --randomly-seed=N` in the report HEADER, and `-q` suppresses
          # the header — measured: no seed line anywhere in a `-q -ra` log. A
          # reproducer read out of output that may not contain it is a
          # reproducer that is absent exactly when it is needed, so the seed is
          # decided by this step and passed in. Derived from the run's own
          # identity so that it is stable across a re-read of the log and
          # DIFFERENT on a re-run attempt, which is what makes "run it again"
          # explore a second order instead of repeating the first.
          seed="$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT) % 4294967296 ))"
          echo "randomly-seed=${seed}"
          status=0
          .venv/bin/python -m pytest -q -ra -p randomly --randomly-seed="${seed}" || status=$?
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          echo "the shuffled run failed; re-running the SAME commit in file order to say which kind of failure this is"
          if .venv/bin/python -m pytest -q -ra -p no:randomly > "${RUNNER_TEMP}/file-order.txt" 2>&1; then
            echo "::error title=order-dependent failure (seed ${seed})::The suite passed in file order and failed shuffled, so this is a test depending on another test having run. Reproduce exactly with: pytest -q -ra -p randomly --randomly-seed=${seed}. tests/_state_guard.py names a test that leaves declared process-global state changed; a failure it did NOT name is state outside that inventory, and the inventory's own docstring lists what it does not watch."
          else
            echo "::error title=the suite is red in file order too (seed ${seed})::This is not an ordering problem — the same failures are in the merge-bearing lanes. Fix those first; this job has nothing to add until they are green."
            tail -40 "${RUNNER_TEMP}/file-order.txt"
          fi
          exit 1

  # The two any_pytree acceptance tests hold the bar for "faithful sugar" —
  # a sugar declaration must trace to a content-hash-IDENTICAL query to the
  # hand-written one, against a REAL third-party library's pytrees (blackjax's
  # MCLMC state, wrap_key_data, PRNG key dtypes). Measured: blackjax was
  # declared nowhere — not in [dependency-groups] dev, not in any workflow —
  # so those two tests SKIPPED in every CI run this project has ever had, and
  # the bar was never once measured outside a developer's machine.
  #
  # A TEST dependency, not a runtime one: nothing here touches the
  # zero-required-dependencies story, and the library-neutrality hook governs
  # src/stelling, not tests/. It is deliberately NOT in [dependency-groups]
  # dev either — a heavy MCMC library has no business in every contributor's
  # environment for two tests.
  #
  # A SEPARATE job, so that blackjax breaking (its own resolution, a yanked
  # wheel, a jax bump) cannot redden the lanes that test stelling.
  #
  # NOT A REQUIRED CHECK (branch protection is a repo setting, not this file:
  # leave this job OUT of the required list). A red here must be loud — hence
  # no `continue-on-error`, which would bury the failure as a warning on a
  # green run — but it must not block a merge, because the failure can be
  # entirely about a third-party library on a day stelling did not change.
  #
  # The one cost of living in this workflow rather than its own: README.md's
  # `ci` badge reports the WORKFLOW conclusion, so a red here reddens the
  # badge. Accepted because the probe libraries are pinned, which removes most
  # of the third-party flakiness that argument is about. If that stops being
  # true, move this job to its own workflow file rather than silencing it.
  acceptance-any-pytree:
    name: any_pytree acceptance (pinned blackjax + diffrax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      # Two-stage install ON PURPOSE. Stage one resolves exactly what the
      # test-jax lane resolves; stage two adds the probe libraries. The jax
      # version is read between the two, so a probe library that drags jax
      # somewhere else is MEASURED rather than assumed away.
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Scratch goes in RUNNER_TEMP, never the checkout: the last step runs
      # the whole suite, and tests/test_sdist_contents.py fails closed on any
      # untracked, non-gitignored path in the tree — correctly, since an
      # untracked file inside an allowlisted directory really would ship. A
      # job that dropped `jax-before.txt` at the repo root would redden that
      # test and the failure would look like nothing to do with this job.
      #
      # `set -o pipefail` is the point of the block form. GitHub's default
      # shell is `bash -e {0}` — errexit, and NO pipefail — so in a one-line
      # `python -c ... | tee file` the pipeline's status is tee's, a failing
      # import exits 0, and the step passes having written an EMPTY file. The
      # comparison below would then be rescued only by `"" != "0.11.0"`, i.e.
      # the guard would be doing the work of its own input's error handling.
      # The guard's input has to be as protected as the guard.
      #
      # jaxlib as well as jax, because jaxlib is the actual XLA build and this
      # suite is demonstrably XLA-sensitive: the one skip rule in
      # tests/test_skip_inventory.py that cannot check its own direction
      # exists precisely because XLA's constant folding varies by build. This
      # install is not `--no-deps`, so blackjax/diffrax can move jaxlib while
      # leaving jax alone — which would satisfy a jax-only guard and change
      # exactly what the guard is there to protect.
      - name: resolved jax and jaxlib BEFORE the probe libraries
        run: |
          set -euo pipefail
          .venv/bin/python -c "import jax, jaxlib; print(jax.__version__, jaxlib.__version__)" \
            | tee "${RUNNER_TEMP}/jax-before.txt"
      # PINNED, and the pin has a cost worth stating: a pinned bar stops
      # tracking the live library, which is half the point of testing against
      # a real one. It is pinned anyway because the property is hash EQUALITY
      # against hand declarations written for these exact pytree structures
      # (design/any-pytree-probe.md, read against diffrax 0.7.2 / blackjax
      # 1.6.2 / jax 0.11.0) — unpinned, a library changing its own state tuple
      # would read as a stelling regression. Moving the pin is the deliberate
      # act that re-establishes the bar, and belongs with the probe re-read.
      - run: uv pip install "blackjax==1.6.2" "diffrax==0.7.2"
      - name: RESOLVED JAX/JAXLIB (a probe library moving either fails this job)
        run: |
          set -euo pipefail
          before="$(cat "${RUNNER_TEMP}/jax-before.txt")"
          # These imports are themselves the check that the install worked: a
          # job that installs blackjax and then silently skips is the exact
          # defect this job exists to close, so absence must fail HERE.
          after="$(.venv/bin/python -c 'import jax, jaxlib; print(jax.__version__, jaxlib.__version__)')"
          bjx="$(.venv/bin/python -c 'import blackjax; print(blackjax.__version__)')"
          dfx="$(.venv/bin/python -c 'import diffrax; print(diffrax.__version__)')"
          echo "RESOLVED jax/jaxlib=${after} (before probe libraries: ${before}) blackjax=${bjx} diffrax=${dfx}"
          {
            echo "### any_pytree acceptance — the versions the bar was measured against"
            echo ""
            echo "| package | resolved |"
            echo "| --- | --- |"
            echo "| **jax jaxlib** | **${after}** |"
            echo "| jax jaxlib, before blackjax/diffrax | ${before} |"
            echo "| blackjax | ${bjx} |"
            echo "| diffrax | ${dfx} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${before}" != "${after}" ]; then
            echo "::error title=a probe library moved jax or jaxlib::blackjax/diffrax resolved '${before}' -> '${after}' (jax jaxlib). This job would then be measuring the any_pytree acceptance bar against a DIFFERENT build from every other lane, and a green tick here would quietly mean something else. jaxlib counts as much as jax: it is the XLA build, and this suite has a skip rule that exists only because XLA folds differently on different builds. Fix the pin, or move the whole matrix deliberately."
            exit 1
          fi
      - run: uv pip list
      # `-ra` rather than `-rs`, for the reason spelled out at the reproducer
      # step below: it is a superset, so the SKIPPED lines the grep depends on
      # are still emitted, and a FAILED / ERROR / xpassed line shows up in the
      # same summary instead of being silently absent from it. Driven, on one
      # failing and one skipping test: `-rs` prints the SKIPPED line and NOT
      # the `FAILED …` line; `-ra` prints both. The exit code is 1 either way,
      # so this is legibility and not a false green — but a reader who has to
      # scroll for the failure is a reader who mistakes it for something else,
      # which has happened here.
      - name: the two acceptance tests must RUN — a skip here is the defect
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q -ra --no-header \
            "tests/test_any_pytree.py::test_h_clean_sugar_hash_equals_hand_declaration" \
            "tests/test_any_pytree.py::test_h_hard_sugar_hash_equals_hand_declaration" \
            | tee "${RUNNER_TEMP}/acceptance.log"
          if grep -q '^SKIPPED' "${RUNNER_TEMP}/acceptance.log"; then
            echo "::error title=the acceptance tests skipped::This job installs blackjax so that these two RUN. They skipped, so the bar was not measured — and pytest exits 0 on a skip, which is why this is checked rather than trusted."
            exit 1
          fi
          grep -qE '^2 passed' "${RUNNER_TEMP}/acceptance.log"
      # The whole suite, in the one environment where every optional library
      # of the acceptance set is present. tests/test_skip_inventory.py is the
      # second, independent guard on those two: it pins the condition ("skips
      # iff blackjax is unimportable"), so here, where blackjax is importable,
      # a SKIP fails the suite — and, since the pin re-runs any pinned test
      # this session did not observe, an ERROR or a FAILURE inside that hidden
      # re-run fails it too rather than reading as "ran". What it does not do
      # is check the assertions themselves; that is the step above, which is
      # why both exist.
      #
      # Unnarrowed on purpose. The inventory's completeness half withdraws its
      # claim in a session that did not collect the whole tree, and fails in
      # one that collected it and then deselected part — so a `-k` or a path
      # added here would quietly turn the second guard off.
      - name: the skip-inventory verdict, asserted off a file channel
        # THE EXIT CODE IS A LAST-WRITER-WINS CHANNEL. `session.exitstatus` is
        # whatever the last hook to touch it left there, and `pytest_cmdline_main`
        # as a wrapper returns over all of them — so a green tick on the step
        # above is only as trustworthy as every plugin in the environment. The
        # conftest writes its verdict to the path named here on the way out, and
        # this step reads it: a plugin can re-assign an exit code, but it cannot
        # un-write a file whose path it does not know about.
        #
        # ABSENCE IS THE SIGNAL THIS BUYS, and it is the half no exit code can
        # give. A run in which tests/conftest.py was ignored, filtered out or
        # never reached leaves no file at all, and that is a failure here rather
        # than a pass — which is exactly the shape of the defect the whole pin
        # exists for: a check that was silently dropped and a summary line
        # byte-identical to a clean one.
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          # ABSENCE is only a signal if nothing else could have supplied the
          # file; see the block above `jobs:`. Driven: with a file already at
          # this path and a pytest that writes none, the step exits 0 on a
          # session that wrote nothing.
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  # THE REPRODUCER ACCEPTANCE SURFACE — 20 tests that ran in NO CI job.
  #
  # Measured, by enumerating every gate in the suite: no test is skipped
  # everywhere, but 18 ran nowhere in CI, because neither library they gate on
  # was named in any extra or any workflow. They are not a corner: they are the
  # whole of `docs/reproducing-a-witness.md`'s acceptance — the tests that emit
  # a reproducer, run it OUTSIDE the repo with stelling unimportable, and
  # require it to print CONFIRMED against the real third-party library. That
  # document is the release's lead artifact, and its bar was measured only ever
  # on a developer's machine.
  #
  # 14 gate on `jaxfluids` (all of tests/test_square_acceptance_jaxfluids.py,
  # plus the WENO5 half of tests/test_reproduce_acceptance.py); 4 gate on
  # `maddening` (the flagship HeatNode witness, and two bar/interval tests).
  #
  # TEST dependencies, not runtime ones — so they live here and NOT in
  # pyproject.toml. `[jax]` there is bootstrap-only and `all` deliberately
  # equals `solvers` precisely so the reflexive extra never drags jax into a
  # managed environment; a heavy CFD solver in a runtime extra would be a
  # far worse version of the same mistake. `[dependency-groups] dev` is wrong
  # too, for the reason already written above for blackjax: no contributor
  # needs a compressible two-phase flow solver to run the unit tests.
  #
  # ── jaxfluids: NOT ON PyPI, so a git pin, and a COMMIT rather than a tag ──
  # Measured: https://pypi.org/simple/jaxfluids/ is 404, as is `jax-fluids`.
  # The project ships only from GitHub. Its published tags stop at
  # `JAX-Fluids-v0.2.1` (0c75fdc), but the tree these tests were verified
  # against is 4a65628 — past that tag, with `__version__` still reading
  # "0.2.1". So there is no version to pin and the tag is a DIFFERENT tree;
  # the commit SHA is the only pin that names what was actually measured.
  # `test_the_target_is_the_library_function_and_still_uses_jnp_square` reads
  # the target's source and fails if upstream rewrites it, which is what makes
  # moving this pin a deliberate, checkable act rather than a silent drift.
  #
  # Installed WITH its dependencies, on purpose: jaxfluids pulls flax and optax,
  # both of which depend on jax and could therefore move it. That is exactly
  # what the before/after guard below is for, and `--no-deps` here would hide
  # the hazard rather than measure it. jaxfluids also needs pyyaml at import —
  # its `input_manager` does `import yaml` — which arrives as one of those
  # dependencies.
  #
  # THEY DID MOVE IT, and the parenthetical that used to close this paragraph
  # — "(Measured: they do not move it, on either series.)" — is withdrawn.
  # flax 0.12.9, uploaded 2026-08-18T21:44:27Z, raised its floor to
  # `jax>=0.11.1`; jaxfluids requires flax unbounded; so the 0.10 entry's
  # install of jaxfluids dragged jax and jaxlib 0.10.2 -> 0.11.1 and the
  # guard below fired. The 20:27 run that day resolved flax 0.12.8 and was
  # green, the 22:41 run resolved 0.12.9 and was red, and NOTHING IN THIS
  # REPOSITORY CHANGED BETWEEN THEM. That measurement was true when it was
  # taken and expired without anyone touching the file, which is the failure
  # mode a dependency-set claim has by construction.
  #
  # The remedy is `UV_CONSTRAINT` at job level, not `--no-deps`: it bounds
  # the ENVIRONMENT rather than one command, it hides nothing, and if no
  # compatible dependency set exists it fails loudly at install instead of
  # being caught a step later.
  #
  # ── flax IS INSTALLED HERE AND IS BROKEN ON jax 0.11.1, AND THIS LANE IS
  #    STILL NOT PINNED. Read this before pinning it. ────────────────────────
  # flax 0.12.8's `flax.nnx` does not import on jax 0.11.1 —
  # `jax.experimental.hijax.MutableHiType` and `AvalMutableQDD` were removed
  # upstream, and `flax/nnx/variablelib.py` subclasses the first at module
  # scope. So a flax traceback in this job's log is a real possibility and the
  # reflex is to pin `jax==0.11.0` here.
  #
  # DO NOT, on this evidence. Measured 2026-08-18 in an isolated venv holding
  # this job's package set at jax 0.11.1 / jaxlib 0.11.1 / flax 0.12.8 /
  # jaxfluids 0.2.1 / maddening 0.3.1 (CPython 3.12.3): `import jaxfluids`
  # succeeds and loads 38 flax modules, `flax.linen` among them and NONE of
  # them under `flax.nnx`; the exact selection this job runs below passes
  # 20/20; and flax 0.12.8 declares `jax>=0.10.0`, so it exerts no downward
  # pressure on jax either. (0.12.8 SPECIFICALLY: 0.12.9 declares
  # `jax>=0.11.1`, which is UPWARD pressure and is why this job now carries a
  # constraints file. A claim about flax's requirement is a claim about one
  # release of it.) No lane in this file imports `flax.nnx`. The only
  # things in the repository that reach it are `corpus/run_census.py` and
  # `corpus/interrogate_census.py`, both through `jax_md` and both driven by
  # hand rather than by any workflow — see the attributed guard at
  # `run_census.py`'s `jax_md` import, and Bump 2 in
  # `design/maintenance-treadmill.md`.
  #
  # WHAT WOULD MAKE A PIN NECESSARY: jaxfluids (or optax, or chex) reaching
  # `flax.nnx` on an upgrade, which shows up here as an import error naming
  # `flax/nnx/`. Pin THIS job then, with the flax and jax versions in the
  # comment, and lift it when flax ships a `flax.nnx` that imports. Do not
  # pin `test-jax` for it: that lane floats on purpose, and floating is what
  # surfaced 0.11.1 on the next push after it shipped. (This read "within a
  # working day". It was true of that one event, and it is not a property of
  # any trigger -- `on:` at the top of this file has no `schedule:`, so what
  # a floating lane guarantees is "on the next push or PR", not a deadline.
  # `_tripwire/_adapter_jax._KNOWN_HASHES` carries the same correction.)
  #
  # ── maddening: on PyPI, but its jax pin makes --no-deps MANDATORY ────────
  # `maddening==0.3.1` declares `jax<0.6,>=0.4`. A plain `uv pip install
  # maddening==0.3.1` in this job DOWNGRADES jax and exits 0 — measured with
  # `--dry-run` against the resolved environment: jax 0.11.0 -> 0.5.3 and
  # jaxlib 0.11.0 -> 0.5.3. That is not hypothetical tidiness; it is the exact
  # defect already found in MADDENING's own ci.yml, where a job that pins 0.11
  # actually tests 0.5.3 and reports green. Hence `--no-deps`, and hence the
  # assertion below, which would catch it if the flag were ever dropped.
  #
  # `--no-deps` also skips maddening's numpy and pyyaml. numpy arrives with
  # jax; pyyaml arrives with jaxfluids. Measured: the 4 tests import and pass
  # with pyyaml absent, so nothing here depends on that coincidence, but a
  # future split of this job into two should re-check it rather than assume.
  #
  # THIS WORKAROUND HAS AN EXPIRY. When MADDENING lifts `jax<0.6` — planned
  # immediately after stelling 0.1.0 — `--no-deps` and this paragraph should
  # be deleted and the install folded into an ordinary pinned one. Until then
  # the flag is load-bearing and must not be removed for looking untidy.
  #
  # ── BOTH SERIES, deliberately ────────────────────────────────────────────
  # The lane above (any_pytree) runs one series; this one runs two, and the
  # difference is not inconsistency. These tests EXECUTE a solver's witness
  # back through the library and compare the result to the library's own
  # recomputation by exact float equality
  # (`ok_side["execution"]["lhs"] == [float(b1)]`), in float64, through XLA.
  # That is the most build-sensitive assertion in the suite, and this repo
  # already carries a skip rule that exists only because XLA folds differently
  # on different builds. `TESTED_JAX_SERIES` claims 0.10 AND 0.11; a lane that
  # measured the reproducer bar on one of them would leave the other claimed
  # rather than measured, which is the very gap `test-jax-0-10` was added to
  # close. Measured cost: the 18 take ~10s per series, so it is cheap.
  #
  # NOT A REQUIRED CHECK, for the reason written above for any_pytree and one
  # more that is stronger here: this lane fetches from a third-party GitHub
  # repository at a commit, so an upstream force-push, a deleted branch or a
  # GitHub outage can redden it on a day stelling did not change. Loud — no
  # `continue-on-error` — but it must not block a merge. Leave it OUT of the
  # required list in branch protection (a repo setting, not this file).
  acceptance-reproducer:
    name: reproducer acceptance (jaxfluids + maddening, jax ${{ matrix.series }})
    runs-on: ubuntu-latest
    strategy:
      # Each series must report its own verdict: if 0.10 fails, the floating
      # lane's result is still wanted, and vice versa.
      fail-fast: false
      matrix:
        include:
          - series: floating
            extras: solvers,jax
            pin: ""
            expect: ""
            constraints: .github/constraints/none.txt
          - series: "0.10"
            extras: solvers
            pin: "jax>=0.10,<0.11"
            expect: "0.10"
            constraints: .github/constraints/jax-0-10.txt
    # AT JOB LEVEL, NOT ON THE INSTALL STEPS, AND THAT IS THE FIX. The pin in
    # `matrix.pin` is a requirement on ONE command; this is a property of the
    # whole job, so a step added later cannot forget it. That distinction is
    # exactly what failed on 2026-08-18: the first install correctly produced
    # 0.10.2, and the NEXT one moved it. Both entries set it -- the floating
    # one to an empty file -- so there is no conditional to get wrong. See
    # `.github/constraints/*.txt`.
    env:
      UV_CONSTRAINT: ${{ matrix.constraints }}
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # Python is PINNED here where every other lane takes the runner default,
      # because this lane cannot afford to inherit it: jaxfluids' setup.py
      # declares `python_requires=">=3.11"` while stelling declares ">=3.10",
      # so the two projects do not agree on what a valid interpreter is. 3.12
      # is the version every pin in this job was verified against.
      - run: uv venv --python 3.12
      # Matrix values go through `env:` rather than straight into the script.
      # `.[solvers,jax]` needs its quotes (brackets are a glob), and a value
      # interpolated into a `run:` body is expanded before bash ever sees it.
      - name: install stelling and the jax series under test
        env:
          EXTRAS: ${{ matrix.extras }}
          PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          # `${PIN:-}`, not `${PIN}`: `set -u` treats an UNSET variable as an
          # error, and the floating entry's `pin` is the empty string. Whether
          # Actions exports an empty `env:` value or omits the variable
          # entirely is runner behaviour that cannot be driven locally, so the
          # two cases are made indistinguishable here rather than assumed.
          if [ -n "${PIN:-}" ]; then
            uv pip install -e ".[${EXTRAS}]" "${PIN}" pytest
          else
            uv pip install -e ".[${EXTRAS}]" pytest
          fi
      # Scratch goes in RUNNER_TEMP, never the checkout: the last step runs the
      # whole suite and tests/test_sdist_contents.py fails closed on untracked
      # paths, so a file dropped at the repo root would redden a test that has
      # nothing to do with this job.
      #
      # `set -o pipefail` is why this is a block. GitHub's default shell is
      # `bash -e {0}` — errexit, no pipefail — so in `python -c ... | tee file`
      # the status is tee's, a failing import exits 0, and the step passes
      # having written an EMPTY file.
      - name: RESOLVED jax and jaxlib, and the series must be the one asked for
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          .venv/bin/python -c "import jax, jaxlib; print(jax.__version__, jaxlib.__version__)" \
            | tee "${RUNNER_TEMP}/jax-before.txt"
          # Same argument as test-jax-0-10: the whole point of a pinned entry
          # is WHICH series it runs, so that is the thing it must not take on
          # trust. A resolver that quietly handed this entry a 0.11 wheel would
          # leave it green while duplicating the floating entry under a 0.10
          # name. The floating entry declares no expectation and is skipped.
          read -r jax_v jaxlib_v < "${RUNNER_TEMP}/jax-before.txt"
          # `${EXPECT:-}` for the same reason as `${PIN:-}` above: the floating
          # entry declares no expectation, and an omitted variable must read as
          # "no expectation", not abort the step under `set -u`.
          if [ -n "${EXPECT:-}" ]; then
            for pair in "jax:${jax_v}" "jaxlib:${jaxlib_v}"; do
              name="${pair%%:*}"; ver="${pair#*:}"
              case "${ver}" in
                "${EXPECT}".*) ;;
                *) echo "::error title=the ${EXPECT} entry did not get ${EXPECT}::${name} resolved to '${ver}'. This matrix entry exists to measure the reproducer acceptance on the ${EXPECT} series; on any other series it is a duplicate of the floating entry wearing a ${EXPECT} name. Fix the pin, or narrow TESTED_JAX_SERIES to the series CI actually runs."; exit 1 ;;
              esac
            done
          fi
      - name: install the acceptance libraries, pinned
        run: |
          set -euo pipefail
          # jaxfluids: from git, because it is not on PyPI; at a commit,
          # because its tags name a different tree. See the block above.
          uv pip install \
            "jaxfluids @ git+https://github.com/tumaer/JAXFLUIDS@4a6562808d3e153fbc3a02643665dd3caa134e05"
          # maddening: --no-deps is LOAD-BEARING. Without it this silently
          # downgrades jax to 0.5.3. See the block above before touching it.
          uv pip install --no-deps "maddening==0.3.1"
      - name: RESOLVED JAX/JAXLIB (an acceptance library moving either fails this job)
        run: |
          set -euo pipefail
          before="$(cat "${RUNNER_TEMP}/jax-before.txt")"
          # These imports are themselves the check that the installs worked: a
          # job that installs jaxfluids and then silently skips is the exact
          # defect this job exists to close, so absence must fail HERE.
          after="$(.venv/bin/python -c 'import jax, jaxlib; print(jax.__version__, jaxlib.__version__)')"
          jfl="$(.venv/bin/python -c 'import jaxfluids; print(jaxfluids.__version__)' 2>/dev/null)"
          mdn="$(.venv/bin/python -c 'import maddening; print(maddening.__version__)')"
          echo "RESOLVED jax/jaxlib=${after} (before the acceptance libraries: ${before}) jaxfluids=${jfl} maddening=${mdn}"
          {
            echo "### reproducer acceptance — the versions the bar was measured against"
            echo ""
            echo "| package | resolved |"
            echo "| --- | --- |"
            echo "| **jax jaxlib** | **${after}** |"
            echo "| jax jaxlib, before jaxfluids/maddening | ${before} |"
            echo "| jaxfluids | ${jfl} (git 4a65628) |"
            echo "| maddening | ${mdn} (--no-deps) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${before}" != "${after}" ]; then
            echo "::error title=an acceptance library moved jax or jaxlib::jaxfluids/maddening resolved '${before}' -> '${after}' (jax jaxlib). CHECK THE CONSTRAINTS FILE FIRST: UV_CONSTRAINT should name .github/constraints/ for this entry, and if the move is UPWARD a transitive dependency raised its floor past it — that is what flax 0.12.9 did on 2026-08-18, and this message used to rank it second. A DOWNWARD move to 0.5.3 is the other one, and means --no-deps was dropped from the maddening install. Either way this job would be measuring the reproducer acceptance against a DIFFERENT build from every other lane. jaxlib counts as much as jax: it is the XLA build, and these tests compare executed float64 values to the library's own recomputation by exact equality."
            exit 1
          fi
      - run: uv pip list
      # `-ra` rather than `-rs`: it is a superset, so the SKIPPED lines the
      # grep below depends on are still emitted, and an ERROR or an xpass shows
      # up in the same summary instead of being silently absent from it.
      - name: the 18 acceptance tests must RUN — a skip here is the defect
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q -ra --no-header \
            tests/test_square_acceptance_jaxfluids.py \
            "tests/test_reproduce_acceptance.py::test_weno5_dependencies_present[jaxfluids]" \
            tests/test_reproduce_acceptance.py::test_weno5_reproducer_runs_outside_the_repo_and_CONFIRMS \
            tests/test_reproduce_acceptance.py::test_the_weno5_reproducer_calls_jaxfluids_and_not_a_copy_of_it \
            tests/test_reproduce_acceptance.py::test_every_confirmed_publishes_sides_that_violate_the_relation \
            tests/test_reproduce_acceptance.py::test_heatnode_reproducer_runs_outside_the_repo_and_CONFIRMS \
            tests/test_reproduce_acceptance.py::test_the_heatnode_verdict_is_the_ledgers_verdict \
            tests/test_dot_general_interval.py::test_contract_4_conservative_projection_verifies \
            tests/test_verified_bar.py::test_the_bar_does_not_touch_interval_only_verdicts \
            | tee "${RUNNER_TEMP}/reproducer.log"
          if grep -q '^SKIPPED' "${RUNNER_TEMP}/reproducer.log"; then
            echo "::error title=the acceptance tests skipped::This job installs jaxfluids and maddening so that these 18 RUN. At least one skipped, so the reproducer bar was not measured — and pytest exits 0 on a skip, which is why this is checked rather than trusted. A lane that installs a library and then silently skips is worse than no lane: it reads as coverage."
            exit 1
          fi
          # The exact count, so that a test SILENTLY DESELECTED — a renamed
          # nodeid above, a `-k` added, a gate changed — fails here instead of
          # passing with fewer tests. 10 of these come from selecting the whole
          # of test_square_acceptance_jaxfluids.py, so adding a test to that
          # file is expected to fail this line: update the number deliberately.
          if ! grep -qE '^20 passed' "${RUNNER_TEMP}/reproducer.log"; then
            echo "::error title=not 20 passed::The reproducer acceptance is 20 tests: 16 gated on jaxfluids and 4 on maddening. A different number means one was renamed, deselected or added — see the log above and update this count deliberately rather than relaxing the check."
            exit 1
          fi
      # The whole suite, in the one environment where jaxfluids and maddening
      # are both present. tests/test_skip_inventory.py is the second,
      # independent guard: it pins each gate's condition, so here, where both
      # libraries are importable, a SKIP of any of the 18 fails the suite too.
      # Unnarrowed on purpose — the inventory's completeness half withdraws its
      # claim in a session that did not collect the whole tree, so a `-k` or a
      # path added here would quietly turn the second guard off.
      - name: the skip-inventory verdict, asserted off a file channel
        # THE EXIT CODE IS A LAST-WRITER-WINS CHANNEL, and absence is the
        # signal this buys: a run in which tests/conftest.py was ignored,
        # filtered out or never reached leaves no file at all, and that is a
        # failure here rather than a pass. See the identical step above.
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          # See the identical line in the any_pytree lane: absence is only a
          # signal if nothing else could have supplied the file.
          rm -f "${RUNNER_TEMP}/skip-inventory-verdict.txt"
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  # VERSION SKEW: two different linters guard one property, and the question
  # of whether they AGREE is now CLOSED BY MEASUREMENT rather than bounded by
  # a changelog. `fsfe/reuse-action@v5` resolves reuse-tool 5.1.1;
  # `.pre-commit-config.yaml` pins `reuse-tool` v6.2.0. Since `insert-license`
  # there now excludes `scratchpad/`, what makes those files compliant is
  # `REUSE.toml`'s `scratchpad/**` `[[annotations]]` block, so the annotation's
  # handling is the thing both versions have to agree about.
  #
  # WHAT THIS BLOCK USED TO SAY, AND WHY IT IS WITHDRAWN. It said "only 6.2.0
  # exists on the machine this was audited on, and installing 5.1.1 needs
  # network that was not available", "a version nobody working on this
  # repository has run", and that the changelog bound "cannot become [a
  # measurement] on a box with no network and one installed version". Three
  # statements of IMPOSSIBILITY, and all three were false: 5.1.1 was on the box
  # the whole time, in pip's own build cache, mtime 2026-08-08 00:37:52 against
  # this branch's first commit at 15:44:25 the same day — fifteen hours and six
  # minutes earlier, and fifteen and a half hours before the commit that
  # asserted the skew could not be closed. Nobody had looked. An impossibility
  # claim is the most expensive kind of claim to get wrong, because it stops
  # anyone else looking too.
  #
  # MEASURED, 2026-08-08, OFFLINE, WITH NO INSTALL INTO ANY SHARED ENV.
  # reuse 5.1.1 assembled by extracting two cached wheels into one directory:
  #   * reuse 5.1.1 itself from pip's wheel cache —
  #     ~/.cache/pip/wheels/d1/19/84/94225e2ddab6a7af21602bd5682a54ecbd24afc0ad796fd2e2/
  #     reuse-5.1.1-cp312-cp312-manylinux_2_39_x86_64.whl, whose `origin.json`
  #     names the PyPI sdist `reuse-5.1.1.tar.gz`. The cp312/manylinux tag is
  #     spurious: the wheel contains no compiled object, only `reuse/**.py` and
  #     its resources, so it imports on the 3.11 interpreter used below.
  #   * `binaryornot` 0.6.0 — 5.1.1's one requirement the 6.2.0 env lacks —
  #     from pip's http cache,
  #     ~/.cache/pip/http-v2/c/6/5/e/8/c65e8d0f5cd15687198954fc037441ea3aefb6411c3c36edebd544b4.body
  # Every other 5.1.1 requirement (Jinja2, attrs, boolean.py, click,
  # license-expression, python-debian, tomlkit) is already in the pinned 6.2.0
  # pre-commit env and was reused from there. Then:
  #
  #   PYTHONPATH=<5.1.1 dir>:~/.cache/pre-commit/reporzhg7lx1/py_env-python3/\
  #     lib/python3.11/site-packages \
  #     ~/.cache/pre-commit/reporzhg7lx1/py_env-python3/bin/python \
  #     -m reuse --root <tree> lint
  #
  # `import reuse; reuse.__version__` reports 5.1.1 with that prefix and 6.2.0
  # without it. THE RUN REALLY EXECUTED 5.1.1's CODE, not 6.2.0's, and that is
  # controlled rather than assumed: move `binaryornot` aside and the same
  # command dies with `ModuleNotFoundError: No module named 'binaryornot'`,
  # a module 6.2.0 neither has nor imports (6.0.0 replaced it with
  # python-magic). Only 5.1.1 can fail that way.
  #
  # THE RESULT IS AN AGREEMENT, AND AN AGREEMENT IS THE ONE FORM THAT DOES NOT
  # ROT. The table below is written as a comparison between two versions on one
  # commit, so re-running it needs no number from this file to compare against —
  # which is the same rule step 4a below insists on for the action. The absolute
  # counts are given only as a record of the run, and each is stamped with the
  # commit it was read on; they will move with the next file added and that is
  # expected. What must not move is the EQUALITY of the two columns.
  #
  #   RE-MEASURED 2026-08-09 at 53f9f84 (the first table below is the reading
  #   at that commit; the second is what stood here, read at an unnamed tip of
  #   the branch that closed this question, kept so the two are comparable):
  #
  #   tree, at 53f9f84                         | 6.2.0        | 5.1.1
  #   -----------------------------------------|--------------|--------------
  #   as committed                             | rc=0 350/350 | rc=0 350/350
  #   same, `scratchpad/**` annotation deleted | rc=1 321/350 | rc=1 321/350
  #
  #   the earlier reading, unnamed commit      | rc=0 331/331 | rc=0 331/331
  #   same, annotation deleted                 | rc=1 302/331 | rc=1 302/331
  #
  # BOTH READINGS SAY THE SAME THING and the numbers are not the thing: the two
  # columns are equal in every cell, and the annotation moves both versions by
  # the same amount in the same direction — 29 files at 53f9f84 (350 − 321) and
  # 29 at the earlier commit (331 − 302).
  #
  # The second row is the POSITIVE CONTROL and it is the whole point: without
  # it, two rc=0s prove only that both programs ran. Deleting the one block
  # this skew is ABOUT moves both versions, by the same files, in the same
  # direction. The agreement is on the mechanism, not on an accident.
  #
  # STRONGER THAN THE COUNTS: `lint --json` gives the same file PATHS from each
  # version, not merely the same total — the two SETS have an empty symmetric
  # difference. Re-measured at 53f9f84 on the committed tree AND on the control
  # tree: 350 paths from each version, symmetric difference 0 in both.
  #
  # THE ONE DIFFERENCE OBSERVED, and it is the one the changelog documents.
  # `lint --lines` on the control tree emits the SAME NUMBER of lines from each
  # version (58 at 53f9f84 — two per file over the 29), and the two are
  # IDENTICAL AS SETS BUT NOT AS SEQUENCES: 6.2.0 sorts by path and interleaves
  # the two categories per file, 5.1.1 emits all the "no license identifier"
  # lines and then all the "no copyright notice" ones. Verified as a set
  # comparison (`diff <(sort a) <(sort b)` empty) and a sequence comparison
  # (`diff a b` non-empty), so the claim is not resting on the count. That is
  # exactly the single hit in the 5.1.1 → 6.2.0 changelog window recorded below
  # — the sort order of `reuse lint --lines` — and nothing else differed.
  # `reuse lint` (no `--lines`) is what this job runs, and on the committed tree
  # it emits nothing from either version and exits 0 from both.
  #
  # WHAT IS STILL SUSPECTED, and it is now exactly one thing: that
  # `fsfe/reuse-action@v5` carries EXACTLY reuse 5.1.1. That is read off the
  # action's own pinning, needs `git ls-remote` to confirm, and cannot be had
  # offline. Everything downstream of "the action is 5.1.1" is measured.
  #
  # AND WHAT THIS MEASUREMENT DOES NOT COVER, said plainly so it is not read
  # as more than it is: the 5.1.1 run used the 6.2.0 env's dependency versions
  # (attrs 26.1.0, click 8.4.2, license-expression 30.4.4, tomlkit 0.15.0,
  # python-debian 1.1.1, Jinja2 3.1.6, binaryornot 0.6.0), not the closure pip
  # would resolve for 5.1.1 today. It measures reuse 5.1.1's own code against
  # this tree. A parsing change inside a DEPENDENCY is the one hazard shape
  # this does not exclude — the same hazard the changelog reading did not
  # exclude either.
  #
  # WHAT WAS MEASURED, from the 6.2.0 `CHANGELOG.md` vendored in the
  # pre-commit cache. The file carries every release from v0.0.2 to v6.2.0, so
  # the 5.1.1 → 6.2.0 window is covered and not truncated: v6.0.0, v6.1.0,
  # v6.1.1, v6.1.2, v6.2.0. Grepping that window for `REUSE.toml`,
  # `annotation`, `precedence`, `glob` and `path` returns exactly one line,
  # about the sort order of `reuse lint --lines`.
  #
  # RE-VERIFIED INDEPENDENTLY (2026-08-08), against the same vendored file at
  # ~/.cache/pre-commit/reporzhg7lx1/CHANGELOG.md, whose `reuse --version` in
  # that env reports 6.2.0. `grep -c '^## v'` gives **52** release headings,
  # newest `## v6.2.0 - 2025-10-27`, oldest `## v0.0.2 - 2017-11-03` — so the
  # file really is complete and the window really is inside it. Grepping lines
  # 29–194 (v6.2.0 down to just above `## v5.1.1`) for the five terms returns
  # exactly the one line quoted above, and a full-word grep for `annotation`,
  # `precedence` and `glob` over that window returns NOTHING. Mapping every
  # `REUSE.toml` mention in the whole file to its release — AND THE FIGURE
  # THAT STOOD HERE NAMED NO UNIT AND WAS WRONG UNDER EVERY UNIT. It read
  # "v5.0.0 (×5), v4.0.0 (×5), v3.0.0 (×1)". `grep -c 'REUSE\.toml'` on that
  # file gives **13**, not 11, and no counting rule yields 5/5/1. The two
  # rules that mean anything here, each with its unit stated:
  #   * BY MATCHING LINE — the unit `grep -n 'REUSE\.toml'` counts —
  #     **v5.0.0 ×6, v4.0.0 ×6, v3.0.0 ×1 = 13**. (v5.0.0 at L290, 294, 307,
  #     318, 319, 321; v4.0.0 at L352, 356, 359, 376, 377, 437; v3.0.0 at
  #     L479.)
  #   * BY CHANGELOG ENTRY — one bullet or one prose paragraph, however many
  #     lines it wraps onto — **v5.0.0 ×5, v4.0.0 ×6, v3.0.0 ×1 = 12**. Only
  #     v5.0.0 differs between the two rules, because L318/L319 are one
  #     wrapped bullet.
  # A figure in a norm states the UNIT it counts (docs/norms.md); this one did
  # not, and the number was not reachable from any unit. THE CONCLUSION IS
  # UNTOUCHED and was never at risk: under both rules the newest release
  # mentioning `REUSE.toml` at all is v5.0.0, below both pins. `precedence`
  # appears at the v2.0.0 heading. Both readings below stand as written.
  #
  # The sharper form of the same reading: the NEWEST release that documents
  # any change to `REUSE.toml` semantics is **v5.0.0** (2024-11-14) — glob
  # handling for `*/`, annotation application, parse errors. Support for
  # `REUSE.toml` arrived in v4.0.0 and the precedence ordering in v2.0.0.
  # Every one of those is BELOW 5.1.1, so both pinned versions sit on the same
  # side of every documented change to the mechanism this repository relies on.
  #
  # THAT READING IS A BOUND ON WHAT THE CHANGELOG DOCUMENTS, and it is no
  # longer the only evidence: the block at the top of this job MEASURED both
  # versions on this tree, with a positive control, and they agree. What the
  # changelog reading still does not bound on its own — an undocumented change;
  # a change in a DEPENDENCY that does the parsing rather than in reuse itself
  # (6.0.0 made `python-magic` a hard dependency, which is exactly that shape)
  # — is narrowed but not eliminated by that measurement, because the 5.1.1 run
  # borrowed the 6.2.0 env's dependency versions. The third item that used to
  # stand here, "any difference in what the two versions COUNT, since a count
  # is not compared anywhere between them", is DISCHARGED: the counts are
  # compared, and so are the file SETS behind them.
  #
  # A SENTENCE IS WITHDRAWN HERE TOO. This paragraph said the bound "cannot
  # become [a measurement] on a box with no network and one installed
  # version". It could and it did; see the top of this job.
  #
  # THE SKEW IS MEASURED CLOSED ON THIS TREE, AND IT IS ALSO DETECTED IF IT
  # MOVES. The measurement above is a fact about this commit and these two
  # versions; it is not self-maintaining, so `tests/test_reuse_pins.py` still
  # records the pair — `fsfe/reuse-action@v5` here, `rev: v6.2.0` in
  # `.pre-commit-config.yaml` — and reddens if either moves without the other
  # being reconsidered, if either file stops naming both versions in PROSE, or
  # if `REUSE.toml`'s `scratchpad/**` annotation (the thing the skew is ABOUT)
  # goes away. It also carries a non-vacuity floor: it counts the tracked
  # `scratchpad/` files that have no inline header and fails if that reaches 0,
  # because then it would be guarding nothing — and SKIPS, loudly, rather than
  # returning, when it is not in a checkout where it can count them at all.
  # Every one of those was driven red before it was landed. Keeping the
  # detector after closing the question is the point: a bump on either side
  # invalidates the measurement above, and the test is what says so.
  #
  # NOT PINNED HERE, and the reason is not inertia. Closing the skew needs a
  # fact that cannot be had offline — whether `fsfe/reuse-action` has a `v6`
  # tag, or whether `uvx --from reuse==6.2.0 reuse lint` gets a working
  # encoding module on `ubuntu-latest` (6.0.0 made `python-magic` a hard
  # dependency and 6.1.0 documents a real misdetection bug when it is
  # missing). Guessing either would replace a working gate with an unverified
  # one on the workflow that stands between a tag and PyPI.
  #
  # WHAT A HUMAN MUST DO, on a machine with network, in this order:
  #   1. `git ls-remote --tags https://github.com/fsfe/reuse-action` and read
  #      off whether a `v6` tag exists and which reuse it carries.
  #   2. if it does, change the `uses:` below to `fsfe/reuse-action@v6` and
  #      confirm on a pull request that `reuse lint` still exits 0 and reports
  #      the SAME "N / N" as `reuse lint` run on the SAME COMMIT locally. Run
  #      both, compare the two; do not compare either against a number written
  #      here.
  #      A LITERAL FIGURE ROTS, AND THIS ONE HAD — TWICE, INCLUDING IN THE
  #      SENTENCE THAT SAYS SO. It first said "284/284 — the figure this tree
  #      gives under 6.2.0 locally", which was the merge-base's count while
  #      every commit of the branch carrying the instruction gave 285/285. The
  #      correction then wrote "`main` gives 292/292", and by 53f9f84 `main`
  #      gives 350/350 — measured, 2026-08-09. Four values for one sentence, in
  #      a paragraph whose subject is that such values rot. THE FIGURE IS NOT
  #      THE INSTRUCTION AND NEVER WAS: what is being tested is that the
  #      action's reuse counts the same files as the pinned local one on THE
  #      SAME COMMIT — a difference of any size is the signal, and equality at
  #      any value is the pass. Run both, compare the two to each other, and do
  #      not compare either against any number written in this file.
  #   3. if it does not, install the pin explicitly instead of using the
  #      action, and keep the two in one place:
  #      `pipx run reuse==6.2.0 lint` or `uvx --from reuse==6.2.0 reuse lint`.
  #   4. STEP 4 IS DONE — this used to read "either way, `pip install
  #      reuse==5.1.1 && reuse lint` on this tree once, and record the count,
  #      which is the measurement no reading of a changelog can replace". It
  #      has been done offline, with a positive control, and the record is at
  #      the top of this job: 6.2.0 and 5.1.1 agree on this tree, on the counts
  #      and on the file sets, and disagree only on the ORDER of `lint --lines`
  #      output. What remains for a human with network is 4a, not 4: confirm
  #      that `fsfe/reuse-action@v5` really carries 5.1.1 and not some other
  #      5.x — that is the last SUSPECTED link, and it is the only one.
  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the routing verification reads
          # `CHANGELOG.md` AT THE COMMIT THE MANIFEST NAMES and a depth-1
          # clone cannot reach it. With the default depth those checks SKIP,
          # so the one guarantee batch B8c exists to provide -- that every
          # routed block arrived, checked against the source it left -- was
          # not exercised by any job. Measured on a `--depth 1` clone of this
          # repository: `19 passed, 8 skipped`, and the eight are the whole
          # git-gated set.
          fetch-depth: 0
      - uses: fsfe/reuse-action@v5

  # HAZARD: A SKIPPED JOB READS AS GREEN. This workflow runs on `push:
  # branches: [main]` as well as on `pull_request`, and this job runs only on
  # the second — so on every push to main it does not run at all, which is
  # read off the `if:` and the `on:` triggers above and is certain. What
  # follows from it is GitHub's DOCUMENTED behaviour rather than anything this
  # repository has measured: a job skipped by an `if:` reports as successful to
  # required status checks, so naming `dco` in branch protection does not make
  # it a gate on pushes to main. It would pass there without checking a commit.
  # Not drivable off a runner, so it is stated in exactly those terms.
  #
  # THE CONDITION IS DELIBERATE AND IS NOT BEING CHANGED. `dco-check` compares
  # a pull request's commit range against its base; a push has no such range,
  # so running it there would not be the same check under the same name — it
  # would be a different one, and a checker that finds no commits to examine
  # exits 0 exactly like one that finds only signed-off commits. The honest
  # move is to say what the gate does and does not cover, which is this
  # comment. The independent cover is review: sign-offs are checked on the PR
  # that introduces the commits, which is the only place the range exists.
  #
  # `pipx run dco-check` is also unpinned, so what runs here can change without
  # a commit to this file. Same class, same unmeasured status (no network).
  dco:
    name: DCO sign-offs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check sign-offs
        run: pipx run dco-check --verbose

  # ── THE PROPERTY SUITE ──────────────────────────────────────────────────────
  #
  # ADDED AS ONE NEW JOB, deliberately, so the diff against a concurrently
  # edited `ci.yml` is a pure append. Nothing above this line is touched.
  #
  # THE DECISION, AND THE ARGUMENT, because it is not obvious.
  #
  # WHAT THIS JOB ACTUALLY DOES ON `main` TODAY, MEASURED, and FIRST because
  # everything after it is an argument about a decision rather than a report
  # of a state. The next paragraph is about a TEST; a reader wants to know
  # about the JOB. And "the property lane is red on main" has been said out
  # loud about this repository and is not true. Re-driven at 3482822 in a venv
  # built the way the steps below build one — `pip install -e ".[jax]" pytest
  # hypothesis`, so NO solver wheels and jax floating, which resolved to jax
  # 0.11.1 with hypothesis 6.165.10 — running exactly the command the `the
  # property suite` step runs:
  #
  #     python -m pytest -q -ra tests/property
  #       -> 41 passed, 1 skipped, 1 xfailed, pytest exit 0
  #
  # and both greps of the step below, run verbatim on that log with the SGR
  # escapes stripped: zero XPASS matches, `^XFAIL ` count exactly 1. The job
  # is GREEN, by the mechanism it was designed to be green by. The same
  # command in a venv that DOES have z3 and cvc5 gives the same three
  # numbers.
  #
  # AND THE DEFECT IS STILL BEING FOUND, which is the half a green tick
  # cannot say on its own: an XFAIL here means the test body RAISED
  # `WrongVerifiedFromWrap`, i.e. the property searched and found a wrong
  # VERIFIED. In the same tree `tests/test_soundness_wrap_reproducer.py`
  # passes 17/17, so the defect is live from both directions.
  #
  # A CLAIM THAT SPLIT IN TWO WHEN IT WAS CHECKED. The half about WHOLE-TREE
  # collection is right and is recorded here so nobody spends the afternoon
  # again; the half about a single module is WRONG, and the correction below
  # is the more useful fact of the two. Nine configurations at 3482822,
  # every one of them XFAIL: the
  # oracle module alone; the whole `tests/` tree collected with `-k`
  # selecting only the oracle, so every module-scope import in the suite
  # runs and one test executes — 7 s, and the cheap instrument for this
  # question; the same with and without solver wheels; with
  # `JAX_ENABLE_X64=1` and unset; under
  # `-n 4`; under `STELLING_PROPERTY_PROFILE=dev`; and the whole tree RUN end
  # to end on jax 0.11.0 with solvers (3910 passed, 13 skipped, 1 xfailed,
  # exit 0 -- the same run the figure further down this block cites, and the
  # jax is named here because the venv described above is a DIFFERENT one,
  # solver-free and floating to 0.11.1).
  #
  # BUT THE INFERENCE THAT USED TO CLOSE THIS PARAGRAPH -- "if collecting
  # every module at once does not flip it, no single module does" -- IS
  # FALSE. This oracle CAN XPASS, deterministically, and whether it does is
  # decided by WHICH local modules the session imported, not by how many.
  # Co-collecting one ordinary module flips it, even fully deselected, at
  # 3482822 and after:
  #
  #     python -m pytest -q \
  #       tests/property/test_oracle.py::test_a_verified_is_true_at_every_admitted_point \
  #       tests/test_sqrt_row.py --deselect tests/test_sqrt_row.py
  #       -> 1 failed, 15 deselected     [XPASS(strict)]
  #
  # THE MECHANISM, measured rather than guessed. hypothesis mixes a pool of
  # CONSTANTS -- integers, floats, bytes and strings, all four buckets, and
  # `Constants.__len__` is their sum -- harvested from every LOCAL non-test
  # module in `sys.modules` into generation
  # (`hypothesis.internal.conjecture.providers._get_local_constants`, cached
  # under `.hypothesis/constants/`). `tests/test_sqrt_row.py` contributes
  # nothing itself -- test files are excluded -- but importing it pulls in
  # `src/stelling/obligation.py`, which contributes 136.
  #
  # POOL SIZE AT THE INSTANT IT IS FIRST DRAWN FROM, measured with the
  # instrument named below, at 5d3281b, jax 0.11.0 + hypothesis 6.165.3 +
  # python 3.12.3. Two columns because there is exactly ONE variable, and it
  # is stateable -- see the paragraph after the table:
  #
  #                                            no entry point   entry point
  #     oracle alone                  -> XFAIL      0 (0 int)     57 (1 int)
  #     oracle + tests/test_sqrt_row.py            274 (7 int)   313 (8 int)
  #       (deselected)                -> XPASS
  #     whole `tests/` collected, -k  -> XFAIL    632 (12 int)   649 (12 int)
  #
  # Every figure repeated byte-identical across runs; `ci` forces
  # `derandomize=True` (`tests/property/_profiles.py`, `_DERANDOMIZE["ci"]`,
  # the default profile), so they are deterministic, and deleting
  # `.hypothesis/` changes none of them.
  #
  # THE ONE VARIABLE IS WHETHER `pyproject.toml`'s `pytest11` ENTRY POINT
  # LOADS. `stelling_overflow = "stelling._tripwire.plugin"` is registered by
  # any INSTALLED stelling, so pytest imports `stelling`, `stelling._optional`,
  # `stelling._tripwire` and `stelling._tripwire.plugin` before collection and
  # hypothesis harvests all four; a tree reached through `PYTHONPATH` alone,
  # or a session run with `-p no:stelling_overflow`, has none of them. That is
  # the whole gap. It is also the correction this block owes: it first carried
  # the triple 2 / 274 / 633, a second measurement got 58 / 312 / 650, and the
  # block then withdrew both on the ground that the instant is ill-defined.
  # It is not. The first triple is the left column +2 / +0 / +1 and the second
  # the right column +1 / -1 / +1 -- residues of at most two constants in
  # figures that run to 650, and each of them the instrument's rather than the
  # instant's. THEY ARE NOT ALL "THE INSTRUMENT'S OWN CONSTANTS", which is what
  # this line used to say and cannot be: the pool is a UNION over the local
  # modules a session imported, so a probe harvested into the union it measures
  # can only ADD to it, and -1 is a pool that is SMALLER. What a residue below
  # zero says is that the earlier session harvested a DIFFERENT SET -- a
  # different import set (one module fewer, or one spelled so
  # `is_local_module_file` skipped it: see the trap below), or the same modules
  # at a commit whose own literals differed -- and neither of those is this
  # session plus a probe. It is still not the instant: name the imports and the
  # tree they were read from and the figure is exactly repeatable, which is
  # what the two columns above are and what withdrawing them got wrong.
  # The LABEL was wrong too: these are TOTAL constants, not integer ones --
  # 274 is 265 strings, 7 integers and 2 floats -- and `obligation.py`,
  # described here as "full of them", contributes 3 integers out of its 136
  # (132 of them strings). Its neighbour `stelling/ir.py` contributes 141
  # constants and not one integer.
  #
  # AND THE INSTRUMENT'S OWN NAME MATTERS, which is the trap worth recording:
  # `is_local_module_file` excludes a path with a `test`/`tests` component or
  # a stem that starts `test_` or ends `_test`, and treats everything else as
  # LOCAL -- including a file in /tmp. So a probe module called `poolprobe.py`
  # is harvested and inflates every figure by its own constants, and the same
  # bytes called `test_poolprobe.py` are invisible. Being inside or outside
  # the repository tree makes no difference at all. The figures above are from
  # the invisible spelling: a plugin loaded with `-p test_spotpool`, wrapping
  # `providers._get_local_constants` and recording `len(pool)` and
  # `len(pool.integers)` on its first call.
  #
  # so a BIGGER pool is not a better search, which is exactly why whole-tree
  # collection does not flip it and one module does -- and why the old
  # inference read backwards. Control: freezing the pool to empty makes both
  # sessions XFAIL and the flip disappears. It is NOT the example database:
  # `ci` forces `derandomize=True` so `database=None`, and deleting
  # `.hypothesis/` changes neither outcome.
  #
  # WHAT IT DOES NOT MEAN: stelling's behaviour does not change and the
  # defect is not masked. `tests/test_soundness_wrap_reproducer.py` passes
  # 17/17 in BOTH sessions. This is an artifact of which examples the search
  # draws, and nothing more.
  #
  # WHY IT MATTERS ANYWAY, and this is the trap. The guard below tells
  # whoever meets an XPASS "if the wrap remedy landed, delete the marker".
  # IT HAS NOT LANDED. Deleting a strict marker on a live defect is how a
  # detector goes quiet, so an XPASS seen in some other session is a
  # statement about that session's import set and NOT evidence the defect is
  # gone. Check `tests/test_soundness_wrap_reproducer.py` before believing
  # any XPASS here.
  #
  # `tests/property/test_oracle.py::test_a_verified_is_true_at_every_admitted_point`
  # FAILS on `main` today. It finds the open integer-literal wrap defect
  # (HANDOFF6 §71, §74) — a family of VERIFIEDs over predicates that are false
  # at every declared point. Wiring that into a must-be-green job would turn CI
  # red on a defect already known, already scoped, and reserved to the
  # principal. So there were two options:
  #
  #   (1) leave this job out until the remedy lands;
  #   (2) land it with the failing property xfail-marked.
  #
  # (1) was rejected. A property suite that runs nowhere is a property suite
  # that rots: the strategies drift, the controls stop applying, and nobody
  # notices until somebody thinks to run it — which, on the evidence of this
  # project, is when they are already debugging something else. The stated
  # reason for building this at all was to make continued development with it a
  # NORM, and a norm needs a job.
  #
  # (2) it is, with three constraints, each of which closes a way the marker
  # could go quiet:
  #
  #   * `strict=True`. A non-strict xfail passes silently the day the defect is
  #     fixed — the same silent-success shape this whole suite exists to
  #     prevent. Strict means the suite goes RED when the remedy lands and
  #     somebody has to come and delete the marker.
  #   * `raises=WrongVerifiedFromWrap`. The marker excuses THAT defect class and
  #     no other — but NOT for the reason an earlier version of this comment
  #     gave. It said a non-wrap wrong VERIFIED raises a plain AssertionError,
  #     does not match, and is reported as a real failure. True of the code
  #     path, VACUOUS for that test: the leg draws from
  #     `integer_specs().filter(wrappable_constants)`, so every spec it sees
  #     carries a wrappable constant and the AssertionError branch is
  #     unreachable. The residual masked leg is what confines the class.
  #     What `raises=` IS load-bearing for, measured: the CENSUS FLOOR. With it
  #     deleted and `_bool_status` mutated to violate everything, the leg
  #     reports XFAIL — green — on `verified_oracle_checked=0 < 5` after
  #     drawing 150 specs, because `census.require`'s AssertionError is
  #     swallowed by the blanket amnesty. With it in place the same run is
  #     FAILED on GENERATOR FLOOR NOT MET.
  #   * the reason names the defect, so this job's own output says what is not
  #     being checked instead of leaving a reader to infer it from a green tick.
  #
  # And a fourth, because it is the hole a marker cannot close by itself — but
  # it is NOT the log-reading step below, and an earlier version of this comment
  # said it was. Measured, at 9cefc6d, on this tree:
  #
  #   strict=True -> strict=False, defect still present:
  #       `27 passed, 1 skipped, 1 xfailed`, pytest exit 0, guard exit 0
  #   raises=WrongVerifiedFromWrap deleted (blanket amnesty):
  #       `27 passed, 1 skipped, 1 xfailed`, pytest exit 0, guard exit 0
  #
  # Both logs are byte-identical to a healthy one, because the defect the
  # marker excuses is still there and the test still xfails either way. A
  # log-reader can only notice on the day the defect is FIXED, which is the one
  # day it must not be the first to notice. What the step below does catch is a
  # CHANGE IN THE NUMBER of xfails (measured: a second xfail added is caught
  # twice over) and a real xpass (both shapes, driven against real logs).
  #
  # The weakening is caught STATICALLY instead, by
  # `test_suite_disclosure.py::test_every_xfail_in_the_suite_is_strict_and`
  # `_narrowed_by_raises`, which parses the marker out of the source and runs
  # in this same job — and in the zero-dep lanes, since it needs neither
  # hypothesis nor jax. Deleting `raises=` is not cosmetic: with it removed and
  # `_bool_status` mutated to violate everything, the wrap leg reports XFAIL —
  # green — while its own generator floor was never met, because the floor's
  # AssertionError is swallowed by the blanket amnesty. With `raises=` in place
  # the same run is reported FAILED.
  #
  # A FIFTH CONSEQUENCE, AND IT IS NOT LOCAL TO THIS JOB. Landing the xfail
  # WITHDRAWS AN EXISTING REPO-WIDE PIN. `tests/test_skip_inventory.py::
  # test_no_session_skip_is_undisclosed` claims the suite's skip set is
  # complete, and it withdraws that claim — by SKIPPING, with its own reason —
  # on any session that reported an xfail:
  #
  #   "the completeness pin is WITHDRAWN, not passed: this session reported
  #    1 test(s) as xfailed."
  #
  # Measured on the whole tree with hypothesis installed: 3910 passed,
  # 13 skipped, 1 xfailed, exit 0, and that pin among the skips. Re-driven
  # at 3482822, jax 0.11.0, hypothesis 6.165.10, CPython 3.12.3,
  # `JAX_ENABLE_X64` unset; it read `2470 passed` until then. THE xfail
  # SENSE DID NOT INVERT and this figure is not evidence that it did: the
  # run reported `1 xfailed` and zero xpasses, exactly as when the figure
  # was written. What went stale is the size of the suite. It
  # self-disclosed and it is the pin's own rule (disclosed => withdrawn, never
  # failed, the same cut `N deselected` gets) — but nothing on this branch said
  # it out loud, and "a repo-wide completeness pin is off" is not something a
  # reader should have to derive from a skip line.
  #
  # THE THREE JOBS ABOVE ARE UNAFFECTED, and that is measured rather than
  # assumed: none of them installs hypothesis, so every module under
  # tests/property/ gates at collection, no xfail is reported, and their
  # `verdict=made` assertion still holds. The pin is off for exactly the
  # sessions that CAN run the property suite. It comes back the day the wrap
  # remedy lands and the marker is deleted — there is no other way to get it
  # back, because narrowing the session (`-k`, `--deselect`) withdraws the
  # claim too, by the same rule.
  #
  # WHAT THIS JOB DOES NOT RUN, stated so the tick cannot be over-read:
  #
  #   * the CROSS-SERIES property. It needs two interpreters with different jax
  #     series in one job, and the two existing jax lanes each have one. It
  #     SKIPS here, with a reason registered in `tests/test_skip_inventory.py`.
  #   * the nightly budgets (5000 examples; 50 000 x 12 stateful steps,
  #     randomised, with a cached example database). There is NO nightly job:
  #     adding one needs a `schedule:` trigger in `on:`, which is an edit
  #     outside this appended block, and this file is being edited concurrently.
  #     The command is in `tests/property/README.md`; until a trigger is added,
  #     nobody is running it, and that is the honest state.
  #   * three of the TWELVE positive controls — `cvc5-stateful` (20x budget),
  #     `cross-series` (two interpreters), and `oracle-wrap` (its property is
  #     the xfail above, which the step below already asserts fired).
  property:
    name: property suite (hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The positive controls materialise old revisions with `git archive`.
          # Without full history, `--controls` cannot run and this job would
          # lose the one mechanism that distinguishes "found nothing" from
          # "generated nothing".
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - name: install, with hypothesis read out of pyproject.toml's dev group
        # Read rather than restated: two places to type a version is one place
        # for them to disagree, and `tools/property_venv.sh` reads the same line.
        run: |
          set -euo pipefail
          HYP="$(python3 - <<'PY'
          import re
          text = open("pyproject.toml").read()
          m = re.search(r'^dev\s*=\s*\[(.*?)\]', text, re.S | re.M)
          reqs = re.findall(r'"([^"]+)"', m.group(1))
          print(next(r for r in reqs if r.startswith("hypothesis")))
          PY
          )"
          echo "hypothesis requirement from pyproject.toml: ${HYP}"
          uv pip install -e ".[jax]" pytest "${HYP}"
      - name: RESOLVED versions
        run: |
          .venv/bin/python -c "import jax, jaxlib, hypothesis, numpy; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__, 'numpy', numpy.__version__, 'hypothesis', hypothesis.__version__)"
      - name: WHAT THIS JOB IS, WHAT IT RUNS, AND WHAT IT DOES NOT
        # Printed into the log on every run, because a green tick says nothing
        # about scope and a reader has only the log.
        run: |
          cat <<'EOF'
          WHAT THIS JOB IS: A ROT DETECTOR, NOT A DEFECT FINDER. Read that
          before the list below, because the list is a list of what RUNS and a
          reader will otherwise take it for a list of what is RULED OUT.

          Measured on this tree, and the reason for the sentence above:
            * the `widen` positive control FIRES at this budget — and the same
              property, against a BLATANTER mutant (a wide declared box
              collapsed to its midpoint, under which `x in [-0.25,0.25] |-
              x >= 0.0` is UNKNOWN while the WIDENED `x in [-2.25,2.25]` is
              VERIFIED), passed at 250 examples. A firing control is not
              evidence that the budget is adequate.
            * two properties therefore now draw 1000 rather than 250 (conjunct
              and widen); both mutants above are caught at 1000 and neither was
              at 250. Cost: +21 s per push.
            * that moved the boundary and did not change the instrument. The
              reordering property's cross-kind clause is falsifiable — it fires
              when the shape is supplied as an @example — and the search does
              not reach it at this budget, at x4, or at x16. The whole suite at
              x4 takes 172 s against ~60 s and is still green against a mutant
              a three-line probe would have caught.

          What this job DOES buy, and it is worth having: the strategies still
          draw their boundary classes, the registered mutations still apply,
          every property still has a control, nine controls still fire, and
          the suite still runs at all. That is rot, caught on the push that
          causes it. It is not a soundness argument.

          RUN, at the `ci` profile (derandomized — the same tree gives the
          same examples in the same order, so a property fails on every push or
          on none). Each line is a property that EXECUTED, never a class of
          defect ruled out:
            * no VERIFIED is false at an admitted point, integer grammar, with
              the open wrap class MASKED OUT  (this one must be green)
            * no `violated-over-set` is minted over an admitted region that is
              exactly empty, at refine=None AND refine="affine"
            * a conjunct that adds no information adds no proving power,
              including the zero-element case
            * an inserted assume restating a declaration's own lower bound
              adds no proving power
            * transposing two adjacent, independent assert_s moves nothing
            * widening a declared bound cannot turn UNKNOWN into VERIFIED
            * the cvc5 record protocol, flat and stateful: a definite answer
              requires exit 0, no truncation, and a harvested model equal to the
              value records in the bytes actually read
            * the strategies still draw their boundary classes (generator floor)
            * every property is registered with a positive control, every
              control names a property that exists, every mutation still applies
            * NINE of the twelve positive controls FIRE where they are supposed
              to, one of them for each of the cvc5 oracle's three clauses

          NOT RUN HERE AT ALL:
            * THE OPEN WRAP DEFECT IS EXPECTED TO FAIL. The unmasked oracle leg
              is xfail(strict, raises=WrongVerifiedFromWrap). This job is GREEN
              while stelling returns VERIFIED for predicates that are false at
              every declared point, and will go RED the day that is fixed.
            * the two tested jax series agreeing (needs two interpreters)
            * the nightly budgets — no scheduled job exists
            * the solver legs, control flow (scan/while/fori_loop), vmap/grad,
              nonvacuity, and the public template helpers
            * THE FORGERY ROUTE TO THE cvc5 ORACLE'S CLAUSE (3). All three
              clauses now have a control that RUNS in this job — `cvc5-flat`
              for (2) at commit `0ad22bb`, `cvc5-exit-tell` for (1) at commit
              `8ef8f75` (before the wheel transport had either of its two
              tells), `cvc5-phantom-model` for (3) as a MUTANT — but (3)'s
              control reaches the clause with a DUPLICATE value record, and
              the shape `0ad22bb` actually gets wrong is a FORGED one, which
              no draw of the generator's alphabet can express. That route is
              demonstrated by nothing, here or anywhere.
              Why one tree is not enough for three clauses: measured over the
              flat leg's own 1500 examples at `0ad22bb`, all three clauses
              evaluated independently, 5 violations, every one of them clause
              (2) `no truncation`, none of clause (1) or (3).
            * CLAUSE (1)'s CONTROL DEMONSTRATES CLAUSE (1) AT THIS PROFILE AND
              NOT AT EVERY PROFILE. `8ef8f75` violates clauses (1) AND (2) —
              counted independently over 1500 draws, 458 examples violate (1)
              and 284 violate (2) — and the oracle returns on the FIRST clause
              that fails, testing (2) first. So which clause gets reported is
              decided by which violating example the search reaches first,
              which is a fact about the example sequence. This job runs the
              derandomized `ci` profile, where it is reproducibly a clause-(1)
              example (stable at x1, x2 and x4). Under `--profile dev`, which
              is randomised, it is EITHER, run to run: with `.hypothesis/`
              removed before every run, 39 of 60 runs at x1 and 23 of 40 at x2
              reported clause (1) and FIRED, and the rest reported clause (2)
              and came back NOT DEMONSTRATED. This entry used to say the dev
              control "comes back NOT DEMONSTRATED — 3 runs of 3"; `dev` is
              randomised AND keeps hypothesis's default example database, so
              the second and third of those runs replayed the first one's
              answer. Driven: after a first run on a wiped database, 33 of 33
              follow-ups repeated a clause-(1) answer and 15 of 15 repeated a
              clause-(2) one. The direction is safe either way — the tool
              refuses, it never passes — and `_judge`'s docstring carries the
              distribution and the reason the transcript is not pinned as an
              `@example` instead.
            * A THREE-CLAUSE ORACLE IS NOT A THREE-WAY CENSUS. The line two
              blocks up — "a definite answer requires exit 0, no truncation,
              and a harvested model equal to the value records in the bytes
              actually read" — is the conjunction the property asserts on
              every example, and it is correct. But `_judge` evaluates the
              three in order and RETURNS ON THE FIRST that fails, so a failing
              example is reported against one clause and not against every
              clause it violates. The independent three-way count above needed
              a non-raising counter to take, and it is in `_judge`'s docstring
              rather than in any run of this job.

          WHAT A PROPERTY SUITE CANNOT REACH AT ALL, measured over this
          project's own catalogue of 153 defects:
            * 61 would have been caught, 81 would NOT, 2 unclear
            * generated input is the trigger for 50 of 80 CODE-VERDICT defects
              and for only 4 of 58 CLAIM defects
          Half this project's defects are claims — a docstring, a figure, a
          count, a scope — and no amount of generated input reads a docstring
          against its implementation. This job does not replace the audit
          discipline and a green tick here is not evidence that it could.
          EOF
      - name: the property suite
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q -ra tests/property \
            | tee "${RUNNER_TEMP}/property.txt"
      - name: the xfail marker is still doing its job
        # The hole `strict=True` cannot close on its own: somebody weakening it
        # to a plain xfail would be invisible until the day the defect is fixed,
        # which is exactly the day it must not be invisible.
        #
        # THE PATTERNS ARE ANCHORED, AND THAT IS WHAT THIS COMMENT IS FOR. An
        # unanchored `grep -q 'XPASS'` over a `-ra` log matches the xfail
        # REASON: `WRAP_DEFECT` in tests/property/test_oracle.py ends "…this
        # test XPASSes and the suite goes red", and `-ra` prints the reason on
        # the `XFAIL …` summary line. Measured on a HEALTHY tree at 9cefc6d
        # (`27 passed, 1 skipped, 1 xfailed`, pytest exit 0): the unanchored
        # form matched its own disclosure text and failed this job on EVERY
        # push, telling the reader to delete a marker that was working.
        #
        # Three anchors, because pytest reports an xpass in three shapes, and
        # each was driven against a real log on pytest 9.1.1:
        #   `^XPASS `  non-strict xpass, short-summary line. THIS is the shape
        #              the step exists for — somebody weakens `strict=True`,
        #              the remedy lands, the suite stays GREEN, and this line
        #              is the only thing that notices.
        #   `^\[XPASS` strict xpass: pytest prints `[XPASS(strict)]` in the
        #              FAILURES body and the short-summary line is a bare
        #              `FAILED <nodeid>` with no reason on it. So the obvious
        #              `FAILED .*\[XPASS` does NOT match on 9.1.1 — measured —
        #              and is kept below only for other pytest versions.
        #   `FAILED .*\[XPASS`  pytest versions that do append the reason.
        # The trailing space in `^XPASS ` is deliberate: it cannot match the
        # word "XPASSes" even if a future pytest wraps a long reason line.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/property.txt"
          if grep -qE '^(XPASS |\[XPASS|FAILED .*\[XPASS)' "${out}"; then
            echo "::error title=an xfail-marked property PASSED::A property marked xfail is now passing. If the wrap remedy landed, delete the marker in tests/property/test_oracle.py; if it did not, the property has stopped finding a defect that is still there."
            exit 1
          fi
          n="$(grep -c '^XFAIL ' "${out}" || true)"
          if [ "${n}" != "1" ]; then
            echo "::error title=expected exactly one xfail::Found ${n}. This job asserts the open wrap defect is still being found and still being disclosed as an expected failure. A different number means a marker was added, removed, or silently weakened."
            exit 1
          fi
          echo "one xfail, zero xpasses — the open wrap defect is still found and still disclosed"
      - name: positive controls (the per-push subset)
        # The anti-vacuity mechanism, executed rather than asserted: today's
        # property, run against a tree that carries the defect, must come back
        # RED. A control that passes exits non-zero and is reported as
        # NOT DEMONSTRATED.
        #
        # THE LAST TWO ARE THE OTHER TWO CLAUSES of the cvc5 oracle, and they
        # are here because a control that exists and is not run demonstrates
        # nothing on any push. `cvc5-flat` covers clause (2) only — measured,
        # 5 violations at `0ad22bb`, all of them (2) — so without these two the
        # line above reads "the cvc5 record protocol … requires exit 0, no
        # truncation, and a harvested model equal to the value records" while
        # one third of it is what anything demonstrates. Cost, best of three
        # each on a loaded box, as WALL CLOCK for the whole `--control`
        # invocation — which is what this step's runtime actually is, and NOT
        # what junit XML reports for the testcase inside it: 1.2 s for
        # `cvc5-exit-tell` and 6.9 s for `cvc5-phantom-model`. The junit
        # testcase figures for the same runs are 0.3 s and 2.4 s; the two
        # instruments are ~1 s apart per control, which is a tree materialised
        # and an interpreter started. Both are tabulated in `_judge`'s
        # docstring, because a figure without its instrument has twice been
        # read here as a figure that failed to reproduce.
        run: |
          .venv/bin/python tools/property_check.py \
            --control oracle-masked \
            --control vacuous-refutation \
            --control conjunct \
            --control redundant-assume \
            --control reorder \
            --control widen \
            --control cvc5-flat \
            --control cvc5-exit-tell \
            --control cvc5-phantom-model
