name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-no-jax:
    name: tests (solvers only, jax uninstalled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers]" pytest
      - name: assert jax is absent
        run: .venv/bin/python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('jax') else 0)"
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m stelling

  # The FLOATING lane: `[jax]` is `jax>=0.5`, so this resolves whatever jax
  # is newest. That is deliberate — it is the lane that meets a new series
  # first — but it means this job alone can only ever test ONE series, and
  # which one is decided by PyPI rather than by this file. Job id and name
  # are left alone on purpose: they may be named in branch protection, which
  # is a repo setting and not visible from here.
  #
  # It is self-policing about drifting off the tested set:
  # tests/test_transcribe.py::test_tested_jax_series_is_silent fails the
  # moment the resolved jax is outside TESTED_JAX_SERIES. What it CANNOT do
  # is notice that the other claimed series went untested — that is what the
  # job below is for.
  test-jax:
    name: tests (solvers + jax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest
      - name: RESOLVED jax (floating — whatever is newest)
        run: .venv/bin/python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"
      - run: .venv/bin/python -m pytest -q

  # The PINNED lane, and the reason it exists is a measured gap, not tidiness.
  #
  # `stelling._optional.TESTED_JAX_SERIES` claims ("0.10", "0.11") — that BOTH
  # series are verified. But every jax lane in this workflow installed
  # `.[solvers,jax]`, whose floor is `jax>=0.5`, so every one of them resolved
  # the newest jax and the 0.10 half of that claim rested on a developer's
  # one-off re-verification run, never on CI. A constant asserting two series
  # while the machine only ever checks one is exactly the kind of unbacked
  # claim this project does not ship.
  #
  # So: pin the SERIES, not a point release. `jax>=0.10,<0.11` tracks the
  # newest 0.10 patch, which is what "0.10 is tested" should mean — a new
  # 0.10.x that breaks transcription is a thing this lane SHOULD catch, and a
  # frozen `==0.10.2` would hide it.
  #
  # jaxlib is left to resolve from jax rather than pinned separately
  # (measured: jax 0.10.2 pulls jaxlib 0.10.2), but it is CHECKED below,
  # because jaxlib is the actual XLA build and this suite is XLA-sensitive.
  #
  # The series check is not ceremony. `test_tested_jax_series_is_silent` only
  # asserts the resolved jax is in TESTED_JAX_SERIES — it passes on 0.11 too.
  # Without the assertion below, a resolver that quietly handed this job a
  # 0.11 wheel would leave it GREEN while testing nothing the floating lane
  # had not already tested, and the second series would go back to being
  # claimed rather than measured. The whole point of this job is which series
  # it runs, so that is the thing it must not take on trust.
  test-jax-0-10:
    name: tests (solvers + jax 0.10 series)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers]" "jax>=0.10,<0.11" pytest
      - name: RESOLVED jax must really be the 0.10 series
        run: |
          set -euo pipefail
          read -r jax_v jaxlib_v < <(.venv/bin/python -c "import jax, jaxlib; print(jax.__version__, jaxlib.__version__)")
          echo "RESOLVED jax=${jax_v} jaxlib=${jaxlib_v}"
          for pair in "jax:${jax_v}" "jaxlib:${jaxlib_v}"; do
            name="${pair%%:*}"; ver="${pair#*:}"
            case "${ver}" in
              0.10.*) ;;
              *) echo "::error title=the 0.10 lane did not get 0.10::${name} resolved to '${ver}'. This job exists to test the jax 0.10 series that TESTED_JAX_SERIES claims; on any other series it is a duplicate of the floating lane wearing a 0.10 name. Fix the pin, or narrow TESTED_JAX_SERIES to the series CI actually runs."; exit 1 ;;
            esac
          done
      - run: .venv/bin/python -m pytest -q

  # The two any_pytree acceptance tests hold the bar for "faithful sugar" —
  # a sugar declaration must trace to a content-hash-IDENTICAL query to the
  # hand-written one, against a REAL third-party library's pytrees (blackjax's
  # MCLMC state, wrap_key_data, PRNG key dtypes). Measured: blackjax was
  # declared nowhere — not in [dependency-groups] dev, not in any workflow —
  # so those two tests SKIPPED in every CI run this project has ever had, and
  # the bar was never once measured outside a developer's machine.
  #
  # A TEST dependency, not a runtime one: nothing here touches the
  # zero-required-dependencies story, and the library-neutrality hook governs
  # src/stelling, not tests/. It is deliberately NOT in [dependency-groups]
  # dev either — a heavy MCMC library has no business in every contributor's
  # environment for two tests.
  #
  # A SEPARATE job, so that blackjax breaking (its own resolution, a yanked
  # wheel, a jax bump) cannot redden the lanes that test stelling.
  #
  # NOT A REQUIRED CHECK (branch protection is a repo setting, not this file:
  # leave this job OUT of the required list). A red here must be loud — hence
  # no `continue-on-error`, which would bury the failure as a warning on a
  # green run — but it must not block a merge, because the failure can be
  # entirely about a third-party library on a day stelling did not change.
  #
  # The one cost of living in this workflow rather than its own: README.md's
  # `ci` badge reports the WORKFLOW conclusion, so a red here reddens the
  # badge. Accepted because the probe libraries are pinned, which removes most
  # of the third-party flakiness that argument is about. If that stops being
  # true, move this job to its own workflow file rather than silencing it.
  acceptance-any-pytree:
    name: any_pytree acceptance (pinned blackjax + diffrax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      # Two-stage install ON PURPOSE. Stage one resolves exactly what the
      # test-jax lane resolves; stage two adds the probe libraries. The jax
      # version is read between the two, so a probe library that drags jax
      # somewhere else is MEASURED rather than assumed away.
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Scratch goes in RUNNER_TEMP, never the checkout: the last step runs
      # the whole suite, and tests/test_sdist_contents.py fails closed on any
      # untracked, non-gitignored path in the tree — correctly, since an
      # untracked file inside an allowlisted directory really would ship. A
      # job that dropped `jax-before.txt` at the repo root would redden that
      # test and the failure would look like nothing to do with this job.
      #
      # `set -o pipefail` is the point of the block form. GitHub's default
      # shell is `bash -e {0}` — errexit, and NO pipefail — so in a one-line
      # `python -c ... | tee file` the pipeline's status is tee's, a failing
      # import exits 0, and the step passes having written an EMPTY file. The
      # comparison below would then be rescued only by `"" != "0.11.0"`, i.e.
      # the guard would be doing the work of its own input's error handling.
      # The guard's input has to be as protected as the guard.
      #
      # jaxlib as well as jax, because jaxlib is the actual XLA build and this
      # suite is demonstrably XLA-sensitive: the one skip rule in
      # tests/test_skip_inventory.py that cannot check its own direction
      # exists precisely because XLA's constant folding varies by build. This
      # install is not `--no-deps`, so blackjax/diffrax can move jaxlib while
      # leaving jax alone — which would satisfy a jax-only guard and change
      # exactly what the guard is there to protect.
      - name: resolved jax and jaxlib BEFORE the probe libraries
        run: |
          set -euo pipefail
          .venv/bin/python -c "import jax, jaxlib; print(jax.__version__, jaxlib.__version__)" \
            | tee "${RUNNER_TEMP}/jax-before.txt"
      # PINNED, and the pin has a cost worth stating: a pinned bar stops
      # tracking the live library, which is half the point of testing against
      # a real one. It is pinned anyway because the property is hash EQUALITY
      # against hand declarations written for these exact pytree structures
      # (design/any-pytree-probe.md, read against diffrax 0.7.2 / blackjax
      # 1.6.2 / jax 0.11.0) — unpinned, a library changing its own state tuple
      # would read as a stelling regression. Moving the pin is the deliberate
      # act that re-establishes the bar, and belongs with the probe re-read.
      - run: uv pip install "blackjax==1.6.2" "diffrax==0.7.2"
      - name: RESOLVED JAX/JAXLIB (a probe library moving either fails this job)
        run: |
          set -euo pipefail
          before="$(cat "${RUNNER_TEMP}/jax-before.txt")"
          # These imports are themselves the check that the install worked: a
          # job that installs blackjax and then silently skips is the exact
          # defect this job exists to close, so absence must fail HERE.
          after="$(.venv/bin/python -c 'import jax, jaxlib; print(jax.__version__, jaxlib.__version__)')"
          bjx="$(.venv/bin/python -c 'import blackjax; print(blackjax.__version__)')"
          dfx="$(.venv/bin/python -c 'import diffrax; print(diffrax.__version__)')"
          echo "RESOLVED jax/jaxlib=${after} (before probe libraries: ${before}) blackjax=${bjx} diffrax=${dfx}"
          {
            echo "### any_pytree acceptance — the versions the bar was measured against"
            echo ""
            echo "| package | resolved |"
            echo "| --- | --- |"
            echo "| **jax jaxlib** | **${after}** |"
            echo "| jax jaxlib, before blackjax/diffrax | ${before} |"
            echo "| blackjax | ${bjx} |"
            echo "| diffrax | ${dfx} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${before}" != "${after}" ]; then
            echo "::error title=a probe library moved jax or jaxlib::blackjax/diffrax resolved '${before}' -> '${after}' (jax jaxlib). This job would then be measuring the any_pytree acceptance bar against a DIFFERENT build from every other lane, and a green tick here would quietly mean something else. jaxlib counts as much as jax: it is the XLA build, and this suite has a skip rule that exists only because XLA folds differently on different builds. Fix the pin, or move the whole matrix deliberately."
            exit 1
          fi
      - run: uv pip list
      - name: the two acceptance tests must RUN — a skip here is the defect
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q -rs --no-header \
            "tests/test_any_pytree.py::test_h_clean_sugar_hash_equals_hand_declaration" \
            "tests/test_any_pytree.py::test_h_hard_sugar_hash_equals_hand_declaration" \
            | tee "${RUNNER_TEMP}/acceptance.log"
          if grep -q '^SKIPPED' "${RUNNER_TEMP}/acceptance.log"; then
            echo "::error title=the acceptance tests skipped::This job installs blackjax so that these two RUN. They skipped, so the bar was not measured — and pytest exits 0 on a skip, which is why this is checked rather than trusted."
            exit 1
          fi
          grep -qE '^2 passed' "${RUNNER_TEMP}/acceptance.log"
      # The whole suite, in the one environment where every optional library
      # of the acceptance set is present. tests/test_skip_inventory.py is the
      # second, independent guard on those two: it pins the condition ("skips
      # iff blackjax is unimportable"), so here, where blackjax is importable,
      # a SKIP fails the suite — and, since the pin re-runs any pinned test
      # this session did not observe, an ERROR or a FAILURE inside that hidden
      # re-run fails it too rather than reading as "ran". What it does not do
      # is check the assertions themselves; that is the step above, which is
      # why both exist.
      #
      # Unnarrowed on purpose. The inventory's completeness half withdraws its
      # claim in a session that did not collect the whole tree, and fails in
      # one that collected it and then deselected part — so a `-k` or a path
      # added here would quietly turn the second guard off.
      - name: the skip-inventory verdict, asserted off the exit code
        # THE EXIT CODE IS A LAST-WRITER-WINS CHANNEL. `session.exitstatus` is
        # whatever the last hook to touch it left there, and `pytest_cmdline_main`
        # as a wrapper returns over all of them — so a green tick on the step
        # above is only as trustworthy as every plugin in the environment. The
        # conftest writes its verdict to the path named here on the way out, and
        # this step reads it: a plugin can re-assign an exit code, but it cannot
        # un-write a file whose path it does not know about.
        #
        # ABSENCE IS THE SIGNAL THIS BUYS, and it is the half no exit code can
        # give. A run in which tests/conftest.py was ignored, filtered out or
        # never reached leaves no file at all, and that is a failure here rather
        # than a pass — which is exactly the shape of the defect the whole pin
        # exists for: a check that was silently dropped and a summary line
        # byte-identical to a clean one.
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/skip-inventory-verdict.txt
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q -rs
          verdict="${RUNNER_TEMP}/skip-inventory-verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the session did not reach it — the recorder was ignored, filtered out, or never loaded. pytest's own exit code cannot report that, which is why this is a separate assertion."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the skip-inventory completeness claim was not made::The verdict file above says what happened. A 'failed' verdict is an undisclosed skip or a silently dropped item; 'withdrawn' means this session was not entitled to claim the suite, and an unnarrowed CI run must be."
            exit 1
          fi

  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: DCO sign-offs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check sign-offs
        run: pipx run dco-check --verbose
