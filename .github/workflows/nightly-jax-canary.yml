# The overflow tripwire is attached to a PRIVATE jax registry
# (`const_fold_rules`, keyed on `convert_element_type_p`). No public or
# `jax.extend` surface exports it — measured on both tested series, seven
# candidate modules, `design/private-jax-boundary.md` carries the table — so
# there is no stability contract underneath it and the only honest way to know
# it still works is to run it against tomorrow's jax before tomorrow's users
# do.
#
# FOUR PROPERTIES, ALL LOAD-BEARING, and each one is a way this job could be
# theatre instead of a canary:
#
#   1. IT RUNS THE SHIPPED `arm()`. Not a copy of the probe, not a
#      re-implementation: `stelling._tripwire.arm()`, the same call
#      `pytest_configure` makes. A canary exercising a different probe is
#      testing nothing about the thing that ships.
#   2. IT HAS A CONTROL — the identical probe against the newest RELEASED
#      jax, in the same workflow, on the same runner. Without it a red run
#      cannot distinguish "upstream broke us" from "we broke ourselves", and
#      the first thing anyone would do is re-run it to find out. NEITHER LEG
#      IS PINNED TO A SERIES, and this file used to say the control was: the
#      `control` job below installs `.[jax]` with no version constraint, so
#      it resolves to whatever jax is newest on the day it runs. What the
#      control gives is a SECOND jax, not a fixed one — enough to tell a
#      nightly-only fault from one common to both legs, and not enough, when
#      both are red, to say whether the released jax regressed or this
#      repository did. `tripwire_canary.py`'s `_TWO_LEGS` says the same thing
#      to whoever meets the red run. A TEST READS THE INSTALL STEPS BELOW and
#      checks THAT CONSTANT AND THE JOB NAMES against them; it also checks
#      that each leg runs the script with `--require` and that neither job
#      `needs:` the other. IT DOES NOT READ THIS PARAGRAPH — no test does,
#      the previous version of this sentence said otherwise, and header prose
#      in this file has now been wrong twice. Where it disagrees with
#      `_TWO_LEGS`, `_TWO_LEGS` is the checked one.
#   3. EACH LEG RUNS THE CANARY IN BOTH `JAX_ENABLE_X64` CELLS. The eager
#      CONSTANT SWEEP -- the earliest signal that jax has grown an internal
#      eager truncation nobody has written a row for -- can only find one at
#      x64 OFF: with x64 on, jax's threefry mask widens to int64, nothing of
#      jax's narrows, and `unmatched` is necessarily empty. Measured on jax
#      0.11.0: 729 conversion(s) / 0 truncation(s) / 0 row(s) at x64=1
#      against 675 / 13 / 1 at x64=0. For one commit both legs ran only at
#      x64=1 while the documentation said the canary runs the sweep, which
#      is an alarm wired to a condition that cannot occur.
#   4. INFRASTRUCTURE FAILURE MUST NOT PAGE. The nightly index URL below is
#      NOT verified current; jax's nightly hosting has moved before and may
#      move again. An install that cannot reach it is infra, not signal, and
#      takes a distinct non-failing path that says so.
#
# THREE INSTRUMENTS, ONE SCRIPT, ONE PAGE. `tripwire_canary.py` arms the
# const-fold tripwire, the eager construction-site detector AND the narrowing
# perimeter, drives a live control for each in both directions, and asks the
# one displacement question while all three are live. The perimeter adds a
# fourth kind of row to the page: not "did the hook work" but "do the facts it
# RESTS ON still hold" — the type is still a heap type, it still owns the
# operator slots, `setattr` still rebinds them, a WARM operation still enters
# Python, and no in-place slot has appeared. Those are positive assertions
# about this jax, so a release that takes one away reddens a row instead of
# passing quietly, which is the direction an alarm about upstream drift has to
# fail in. Two canaries on two schedules would be two pages to read and one of
# them eventually stops being read.
#
# The jax version and the const-fold rule's sha1 go into
# `$GITHUB_STEP_SUMMARY` on every run, red or green, so a failure is
# diagnosable from the summary page without re-running anything. The hash is
# RECORDED, never gated on: refusing to arm because someone reflowed a comment
# upstream is the failure mode `PLAN-tripwire.md` §5 names.
name: nightly jax canary

on:
  schedule:
    # 04:17 UTC. Off the hour on purpose — the top of the hour is when every
    # scheduled workflow on GitHub queues at once.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-jax-canary
  cancel-in-progress: false

jobs:
  # PROPERTY 2. The control is the leg that may not come back YELLOW: it has
  # no `continue-on-error` and no infra carve-out, so it answers red or green.
  #
  # IT DOES NOT RUN FIRST. There is no `needs:` anywhere in this file and
  # there deliberately is not one — the two jobs run concurrently. Sequencing
  # them would make GitHub SKIP the `nightly` leg whenever the control failed,
  # and the run that most needs both answers is exactly the run that would
  # come back with one. This comment claimed the ordering for one commit while
  # no `needs:` existed; the claim is withdrawn rather than implemented, and a
  # test now fails if a `needs:` appears without this paragraph changing.
  #
  # A RED CONTROL NAMES NOBODY. If the newest RELEASED jax cannot arm the
  # tripwire, either that release regressed or this repository did, and
  # nothing on these two pages separates them — both legs run this
  # repository's code, which is the whole of what `_TWO_LEGS` says. What it
  # does establish is that the fault is not the nightly's jax alone, and that
  # is what a red control costs: the comparison the `nightly` result below is
  # read through stops discriminating, so both legs red is one finding and not
  # two.
  control:
    name: control — the newest released jax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[jax]" pytest
      - name: arm the SHIPPED tripwire and report what it attached to
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
        run: .venv/bin/python .github/scripts/tripwire_canary.py --require

      # PROPERTY 3, AND IT WAS MISSING. `JAX_ENABLE_X64: "1"` above is this
      # repository's setting for jax work, and it is the setting in which the
      # canary's EAGER CONSTANT SWEEP cannot find anything: jax's own threefry
      # mask widens to int64, so nothing of jax's narrows, `unmatched` is
      # necessarily empty and `eager:unenumerated-jax-constant` cannot page.
      # Measured on jax 0.11.0 — x64=1: 729 conversion(s), 0 truncation(s), 0
      # row(s) exercised; x64=0: 675 / 13 / 1. With only the step above, the
      # earliest signal that jax has grown an eager truncation nobody has
      # written a row for was an alarm wired to a condition that cannot occur.
      # A TEST READS BOTH LEGS for a canary run at x64 off.
      - name: ...and again at x64 OFF, the only setting the sweep can redden in
        env:
          JAX_ENABLE_X64: "0"
          JAX_PLATFORMS: cpu
        run: .venv/bin/python .github/scripts/tripwire_canary.py --require

  nightly:
    name: nightly jax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e "." pytest

      # PROPERTY 4. `continue-on-error` so an unreachable index, a yanked
      # nightly or a resolver change cannot page anybody. The step's outcome
      # is read below and turned into a distinct, NON-FAILING path.
      - name: install a jax nightly
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          uv pip install --prerelease=allow \
            --index-url https://us-python.pkg.dev/ml-oss-artifacts-published/jax-public-nightly-artifacts-registry/simple/ \
            --extra-index-url https://pypi.org/simple \
            jax jaxlib

      - name: no nightly available — infrastructure, not signal
        if: steps.install.outcome != 'success'
        run: |
          {
            echo "### nightly jax canary: SKIPPED (infrastructure)"
            echo
            echo "The jax nightly index could not be installed from. That URL"
            echo "is not verified current and jax's nightly hosting has moved"
            echo "before, so this is treated as infrastructure and not as a"
            echo "signal about the tripwire. Nothing was measured this run."
          } >> "$GITHUB_STEP_SUMMARY"

      # PROPERTY 1. The shipped `arm()`, and `--require` so a tripwire that
      # cannot arm on tomorrow's jax is RED here rather than quietly disabled.
      # That is the whole point of the canary: `auto` is right for a user's
      # suite and wrong for the alarm.
      - name: arm the SHIPPED tripwire against the nightly
        if: steps.install.outcome == 'success'
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
        run: .venv/bin/python .github/scripts/tripwire_canary.py --require

      # PROPERTY 3 on this leg too — see the control job. At x64 on, the eager
      # constant sweep is structurally blind (jax's mask fits in int64), so a
      # nightly that grew a second internal eager truncation would come back
      # green from the step above. This is the step that can go red.
      - name: ...and again at x64 OFF, the only setting the sweep can redden in
        if: steps.install.outcome == 'success'
        env:
          JAX_ENABLE_X64: "0"
          JAX_PLATFORMS: cpu
        run: .venv/bin/python .github/scripts/tripwire_canary.py --require

      # The tripwire's own tests against the nightly. `arm()` returning
      # `armed` says the hook is live; these say it still finds the right
      # thing, still suppresses jax's own PRNG mask, and still reports
      # where/clip as UNCOVERED — which is the assertion most likely to go
      # stale in the SAFE direction and go unnoticed.
      #
      # `test_tripwire_eager.py` IS IN THE LIST, AND UNTIL 2026-08-22 IT WAS
      # NOT — the one instrument here whose hook attaches to a jax PRIVATE
      # function (`jax._src.lax.lax._convert_element_type`) rather than to a
      # private REGISTRY, which makes it the thing a nightly is most likely
      # to break, and it was the only one of the three not run against the
      # nightly. `arm_eager()` plus the two-cell sweep above still page if
      # the hook DETACHES; what nothing covered is the hook attaching and
      # then finding, attributing or suppressing differently.
      #
      # IT COULD NOT BE ADDED BEFORE THE CELL WAS GREEN. This step runs at
      # `JAX_ENABLE_X64: "1"` and that file had EIGHT failures there at
      # `844ba48` — all of them subject-absent in that cell, none of them a
      # defect — so adding it would have made this leg permanently red and
      # taught whoever reads the nightly to ignore it. The eight carry the
      # complementary fact for x64 on now, and the file is `115 passed` in
      # both cells.
      - name: the tripwire's own tests, against the nightly
        if: steps.install.outcome == 'success'
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
        run: |
          .venv/bin/python -m pytest -q -ra \
            tests/test_tripwire_arm.py tests/test_tripwire_record.py \
            tests/test_tripwire_plugin.py tests/test_tripwire_eager.py
