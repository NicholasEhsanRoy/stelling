          fi
          if [ "${TAG}" != "v${sdist_version}" ] && [ "${TAG}" != "${sdist_version}" ]; then
            echo "::error title=tag and sdist disagree::The release is tagged '${TAG}' but the built sdist is version '${sdist_version}'. This step used to compare only the wheel, on the argument that one 'uv build' produces both so they agree by construction — which is a coupling and not a check, and a dist/ holding a matching wheel beside a stale tarball passed every gate in this file. Publishing would put '${sdist_version}' on PyPI permanently, under a release that says otherwise. Fix __version__ or the tag; do not re-run this job until they match."
            exit 1
