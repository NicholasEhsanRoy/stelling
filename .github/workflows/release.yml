            echo "::error title=the sdist check cannot read the tarball::tar exited ${tar_status} on ${sdist} and this step has no member list to compare. What tar said is in this step's log, above. It used to die HERE on tar's own exit code with no annotation — red, but not by this gate, which is the state the no-wheel and two-tarball cases in this same workflow were repaired out of; rc=2 is tar's code and this step's own refusals are rc=1. It was left standing on the argument that a refusal point failing closed is the answer it exists to give, and on 'an earlier step would have caught it' — measured, the tag step returns 0 on every corrupt tarball, because it reads filenames and never opens either file. Empty dist/ and re-run the build."
            exit 1
          fi
          # AND ONE SHAPE THIS REFUSAL DOES NOT CONVERT INTO AN ANNOTATED RED,
          # recorded beside it rather than left to be met: a FIFO in `dist/`
          # named like a tarball. `tar tzf` BLOCKS opening it — a FIFO with no
          # writer never returns from `open` — so control never reaches the
          # refusal above and the JOB BURNS TO ITS TIMEOUT. MEASURED on the
          # bodies this commit ships, `dist/` holding the real wheel, a
          # one-byte `*` `.gitignore` and a FIFO called
          # `stelling-0.2.0.tar.gz`, `TAG=v0.2.0`:
          #
          #   the tag step        rc=0   `tag=v0.2.0 wheel version=0.2.0
          #                               sdist version=0.2.0`
          #   the sdist step      HANGS  killed at 20 s, no exit code
          #   the manifest step   HANGS  killed at 20 s, no exit code
          #
          # The tag step is rc=0 for the reason it is rc=0 on every corrupt
          # tarball above: it reads FILENAMES and never opens either file.
          # IT FAILS CLOSED AND IT IS NOT REACHABLE FROM THIS WORKFLOW —
          # nothing is published, because `upload-artifact` never runs; and
          # `actions/checkout@v4` gives this job a fresh clone whose `dist/` is
          # gitignored with no tracked member, and `uv build` writes regular
          # files into it. It is RECORDED and not repaired because a timeout is
          # the one refusal that cannot say it refused, and the repair — a
          # timeout wrapped around `tar` — puts a new way to fail into the step
          # whose own annotations are what a reader trusts. That is a decision
          # for a commit that wants it, not a side effect of one that does not.
          printf '%s\n' "${listing}" | sed -e 's|^[^/]*/||' -e '/\/$/d' -e '/^$/d' | sort -u > "${work}/members.txt"
          git ls-files | sort -u > "${work}/tracked.txt"
          printf '%s\n' "${GENERATED}" | sort -u > "${work}/generated.txt"
          sort -u "${work}/tracked.txt" "${work}/generated.txt" > "${work}/explained.txt"
          # ZERO EXAMINED MUST NOT READ AS ZERO PROBLEMS. Each of these is a
          # way for the comparison below to come back empty because it looked
          # at nothing: an unreadable tarball, an index this job cannot see, a
          # `sed` that ate every line.
          #
          # Driven red at a61c01f on two of the three: a VALID but EMPTY
          # tarball ("members.txt is empty", exit 1), and a checkout whose
          # index is empty ("tracked.txt is empty", exit 1).
          #
          # WHAT USED TO STAND HERE WAS AN EXCUSE AND IS RETRACTED ABOVE. It
          # read: a CORRUPT tarball "dies in the pipeline above at tar's own
          # rc 2, with no annotation. Still red, so still safe, but `pipefail`
          # is what catches that one and not this loop" — tolerable here,
          # because this step IS a refusal point. MEASURED ON THE BODY THAT
          # SHIPPED IT, one tarball in `dist/`, `TAG=v0.2.0`:
          #
          #   dist/stelling-*.tar.gz was…    tag step   sdist step  annotation
          #   non-gzip garbage               rc=0       rc=2        none
          #   a truncated gzip               rc=0       rc=2        none
          #   valid tar.gz + trailing junk   rc=0       rc=2        none
          #   an empty file                  rc=0       rc=2        none
          #   a gzip of a non-tar, >=512 B   rc=0       rc=2        none
          #   a gzip of a non-tar,  <512 B   rc=0       rc=1        examined
          #                                                         nothing
          #
          # The tag step column is the half that removes the excuse: it reads
          # FILENAMES and never opens either file, so every one of these
          # reaches this step THROUGH A GREEN GATE and nothing earlier has read
          # a byte of the tarball. "An earlier step would have caught it" is
          # the argument this file exists to retract, and it was not even
          # available.
          #
          # AND `pipefail` WAS NOT WHAT CAUGHT IT — the verdict was a property
          # of the corrupt file's LENGTH, which is why the last two rows are
          # ONE class split in half. MEASURED with GNU tar 1.35: `tar tzf` on a
          # gzip whose decompressed payload is under 512 bytes — one tar
          # block — exits 0 and lists NOTHING; at 512 bytes and above it exits
          # 2 (driven either side of the boundary: 511 rc=0, 512 rc=2). So one
          # length of the same corruption walked past `pipefail` entirely and
          # it was the `members.txt` arm of THIS loop that refused it. A
          # sentence naming "an unreadable tarball" was taking credit for a
          # `pipefail` that does not fire on every unreadable tarball, and the
          # ones it misses are the ones this loop was actually holding.
          #
          # TWO SMALLER UNANNOTATED REDS REMAIN IN THIS STEP, named rather than
          # left to be found: `work="$(mktemp -d)"` failing, and `GENERATED`
          # unset (`set -u`, rc=1, no annotation — driven: "GENERATED: unbound
          # variable"). Both are this step's own workspace rather than its
          # input — the second is a literal in this file's `env:` block, pinned
          # by `tests/test_release_gates.py` in
          # `test_the_sdist_gate_refuses_a_member_that_is_not_committed`, so no
          # `dist/`, tag or tree can produce the condition; only an edit can,
          # and that pin is what catches an edit. `mktemp -d` is the runner's
          # own filesystem. That is the same line this file already draws
          # around `uv build` and `actions/checkout` — a step's workspace is
          # not its input — and turning either into an annotated refusal would
          # add a counted refusal point for a condition no `dist/` can produce.
          # Recorded, not repaired, and re-endorsed rather than re-inherited.
          for f in members.txt tracked.txt explained.txt; do
            if [ ! -s "${work}/${f}" ]; then
              echo "::error title=the sdist check examined nothing::${f} is empty, so the comparison below could not have found anything. Refusing to publish."
              exit 1
            fi
          done
          # Driven red at a61c01f by asking for a member that is not there
          # (`GENERATED=NOT-A-REAL-MEMBER`): "is not in
          # dist/stelling-0.1.0.tar.gz. Refusing to publish.", exit 1.
          for required in "${GENERATED}" pyproject.toml README.md LICENSE; do
            if ! grep -qxF "${required}" "${work}/members.txt"; then
              echo "::error title=the sdist check is not looking at a real artefact::'${required}' is not in ${sdist}. Refusing to publish."
              exit 1
            fi
          done
          unexplained="$(comm -23 "${work}/members.txt" "${work}/explained.txt")"
          if [ -n "${unexplained}" ]; then
            echo "${unexplained}"
            echo "::error title=the sdist ships files that are not committed to this tree::The members listed above are in ${sdist} and not in \`git ls-files\` for the tagged commit. An sdist on PyPI cannot be unpublished, only yanked, and a yanked file still resolves for anyone who pins it. Either commit them and re-tag, or find the force-include route putting them there (see tests/test_sdist_contents.py). Refusing to publish."
            exit 1
          fi
          echo "every one of $(wc -l < "${work}/members.txt") sdist members is committed to this tree"
      # A last look at what would ship, in the log, before it becomes immutable.
      # tests/test_sdist_contents.py already holds the allowlist shut; this is
      # here so the record of a release includes the file list it published.
      #
      # NOT a refusal — and it took a repair to make that true, not just a
      # drive. At a61c01f it wrote 282 lines of manifest and exited 0, and this
      # comment concluded: *"The only way it goes red is `set -u` on an unset
      # `GITHUB_STEP_SUMMARY`."* DRIVEN FALSE FOUR WAYS on the body that
      # sentence described, one tarball in `dist/`, `GITHUB_STEP_SUMMARY` set:
      #
      #   dist/stelling-0.2.0.tar.gz was…       verdict
      #   non-gzip garbage                      rc=2, no annotation
      #   a gzip of something that is not tar   rc=2, no annotation
      #   a truncated gzip                      rc=2, no annotation
      #   a valid tar.gz + trailing garbage     rc=2, no annotation
      #
      # `pipefail` and `set -e` turn `tar`'s own exit code into a failed
      # release, from the one step in this job whose entire purpose is to
      # PRINT, with nothing said about why. It is unreachable in the workflow
      # as it stands ONLY because the sdist step `tar tzf`s the same file one
      # step earlier — which is "an earlier step would have caught it", the
      # argument this file exists to retract, and the one the sdist step
      # already refused by establishing its own tarball count.
      #
      # SO `tar` IS ALLOWED TO FAIL HERE, and what it said goes into the record
      # instead of into the job's exit code. NO COUNT WAS ADDED: a count would
      # make this a refusal point, which it deliberately is not. A readable
      # tarball with no members is recorded as exactly that, because "zero
      # examined must not read as zero problems" is no less true of a record
      # than of a check. RE-DRIVEN on the body below: all four shapes above
      # rc=0, each recorded as unreadable with tar's own message beneath it;
      # the valid tarball unchanged, rc=0 with its manifest; and the one red
      # path left is `set -u` on an unset `GITHUB_STEP_SUMMARY` (driven:
      # "GITHUB_STEP_SUMMARY: unbound variable", exit 1), which a runner always
      # sets. It asserts nothing about what it prints — the step before it is
      # what does that.
      #
      # AND THE `2>&1` THAT REPAIR ARRIVED WITH WAS A DEFECT ON THE SUCCESS
      # PATH, WHICH IS THE PATH EVERY RELEASE TAKES. It was applied
      # unconditionally, so a `tar` that exits 0 and WARNS had its warning
      # `sed`ed and `sort`ed into the record beside the members. DRIVEN on the
      # body one commit ago, a real one-member `stelling-0.2.0.tar.gz` carrying
      # a pax extended header with an unknown keyword — rc=0, and the record:
      #
      #   PKG-INFO
      #   tar: Ignoring unknown extended header keyword 'ANTHROPIC.weird'
      #
      # Two lines a reader cannot tell apart, in the one step whose entire
      # product IS the record — the same family as "zero examined must not read
      # as zero problems", which this step's own comment two paragraphs up
      # invokes. So the capture takes STDOUT ONLY: on the success path tar's
      # stderr goes to this step's log, where a warning is still visible and is
      # not a member, and on the failure path what tar said is asked for again
      # by a second `tar tzf` and written into the record. THE COST IS NAMED:
      # the failure path reads the file twice, so the message in the record
      # comes from the second read. The alternative — a `mktemp -d` scratch
      # file, which is what the sdist step above uses — would have put a NEW
      # way to fail into the one step whose stated property is that it cannot
      # fail the release, and that property is the whole of this repair.
      # RE-DRIVEN on the body below: the pax tarball rc=0 with `PKG-INFO` alone
      # in the record and the warning in the step's log; the four shapes above
      # and an EMPTY FILE — a fifth, and the one a half-written upload
      # leaves — rc=0 and still recorded as unreadable with tar's own message;
      # and a gzip of a non-tar under 512 bytes, which `tar` reads at rc=0,
      # recorded as readable and holding no members, which is what it is.
      #
      # EVERY TARBALL, NOT "THE" TARBALL, and that is what keeps it a
      # non-refusal. It carried the LAST `ls dist/` in this file — the second
      # of the two `ls dist/*.tar.gz` sites, the wheel's having been retired in
      # the step above — so
      # with two tarballs it died on tar's own exit code and with none it died
      # on the unexpanded glob — a step whose whole job is to PRINT, failing the
      # release, with nothing said about why. Adding a count refusal here would
      # have made it a refusal point, which it is deliberately not; a loop over
      # the glob makes the record cover everything `dist/` would publish and
      # still asserts nothing. `nullglob` is what makes the empty case print
      # nothing instead of trying to read a file called `dist/*.tar.gz`.
      #
      # AND ONE SHAPE THIS STEP CANNOT RECORD AND CANNOT SURVIVE, noted here
      # because every paragraph above argues that it cannot fail the release
      # and none of them met this. A `dist/` entry that is a FIFO named like a
      # tarball makes `tar tzf` BLOCK — a FIFO with no writer never returns
      # from `open` — so this loop never comes back and the JOB BURNS TO ITS
      # TIMEOUT. That is not a `tar` exit code, so the `||` below cannot turn
      # it into a record; it is not an empty listing either; and a timeout is
      # the one refusal that cannot say it refused. MEASURED on the bodies this
      # commit ships, a real `dist/` — the wheel, the sdist and the one-byte
      # `*` `.gitignore` `uv build` writes — plus a FIFO called
      # `stelling-0.0.9.tar.gz`, `TAG=v0.2.0`:
      #
      #   the tag step        rc=1   dist/ does not hold exactly one sdist
      #   the sdist step      rc=1   cannot tell which tarball to read
      #   the manifest step   HANGS  killed at 20 s, no exit code
      #
      # BOTH REFUSAL POINTS CATCH THAT SHAPE AND THIS STEP STILL HANGS ON IT,
      # which is the whole reason it is written down: they refuse on the COUNT
      # and this step loops over EVERY match, so being third in the job is not
      # a property of this body. "An earlier step would have caught it" is the
      # argument this file exists to retract, and a `run:` block is a script
      # that has to be correct on the input it is given — which is why the
      # sdist step makes the tarball count for ITSELF one step earlier. It is
      # UNREACHABLE from this workflow for the same reason the sdist step's
      # FIFO note gives — `actions/checkout@v4` plus `uv build` puts regular
      # files in a gitignored `dist/` — and it is RECORDED and not repaired for
      # the same reason too: a `timeout` around `tar` would put a NEW way to
      # fail into the one step whose stated property is that it cannot fail the
      # release, and that property is what the `2>&1` repair above was for. See
      # beside the sdist step for the single-FIFO measurement, where this step
      # hangs and the tag step returns 0.
      - name: the sdist manifest, for the record
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob dotglob
          for sdist in dist/*.tar.gz; do
            echo "### sdist contents (${sdist})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # `tar` IS ALLOWED TO FAIL, and this is the whole repair: under
            # `set -e` a command in a `||` list does not end the script, so
            # what tar said becomes part of the record instead of the exit
            # code of a step that only prints.
            status=0
            listing="$(tar tzf "${sdist}")" || status=$?
            if [ "${status}" -ne 0 ]; then
              # `listing` is STDOUT only, so what tar said is not in it — see
              # the pax measurement above. Asked for again here, and only here.
              said="$(tar tzf "${sdist}" 2>&1 >/dev/null || true)"
              printf 'tar could not list this file (exit %s). What it said:\n' "${status}" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "${said:-(tar wrote nothing to stderr)}" >> "$GITHUB_STEP_SUMMARY"
            elif [ -z "${listing}" ]; then
              echo '(this tarball is readable and holds no members)' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '%s\n' "${listing}" | sed 's|^[^/]*/||' | sort >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # THE REFS IN THIS JOB ARE A DECISION, NOT AN OVERSIGHT.
  #
  # `pypa/gh-action-pypi-publish@release/v1` is a BRANCH ref, on the only job
  # in this repository that holds `id-token: write` and the only one that can
  # write to PyPI permanently. Everything else here — `actions/checkout@v4`,
  # `astral-sh/setup-uv@v6`, `actions/{upload,download}-artifact@v4` — is a
  # floating MAJOR TAG. Both are mutable; the difference is who moves them and
  # when. A major tag is moved by its owner at each release; a branch moves
  # with every commit that lands on it.
  #
  # NOT PINNED TO A SHA, for three reasons, in order of weight:
  #
  #   1. PINNING ONLY THIS STEP WOULD BE THEATRE. The bytes uploaded to PyPI
  #      arrive through `actions/download-artifact@v4`, one line above. An
  #      action that can substitute the artifact needs no `id-token` of its
  #      own. Hardening the chain means pinning the whole chain — checkout,
  #      setup-uv, both artifact actions, and this one — or pinning none of it.
  #   2. A PIN WITHOUT AUTOMATION BECOMES A STALE PIN, and stale is a live
  #      hazard for this action specifically: PEP 740 attestations are
  #      generated by DEFAULT and must not be disabled, and that default
  #      arrived in a release. A SHA frozen below it publishes without
  #      attestations and says nothing about it. So the correct form is a SHA
  #      plus a Dependabot/Renovate entry that bumps it, and the pin should not
  #      land before the automation does.
  #   3. THE SHA WOULD BE UNVERIFIABLE WHERE THIS WAS WRITTEN — no network. A
  #      40-character ref typed from memory onto the publish step is worse than
  #      a branch ref maintained by PyPA: at best the job fails on release day,
  #      at worst it resolves to a commit nobody chose.
  #
  # Pinning does NOT break Trusted Publishing — the OIDC token is minted by
  # GitHub for this job and exchanged by whatever code runs, so the ref is
  # irrelevant to it — and that is not the reason for leaving it alone.
  #
  # WHAT A HUMAN SHOULD DO, on a machine with network, as one change: add
  # `.github/dependabot.yml` with `package-ecosystem: github-actions`, then pin
  # all five actions in this file to `@<sha>  # vX.Y.Z`, then confirm on a test
  # release to TestPyPI that attestations are still generated.
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
