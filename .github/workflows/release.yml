# opposite ways — under the first a hidden `.zip` never reaches PyPI and the
# dotfile question is moot, under the second it ships — and both are
# third-party behaviour behind a mutable ref, which is the shape of mitigation
# the twine sentence above was retracted for. So it is said plainly: WE DO NOT
# RELY ON EITHER DEFAULT. The conduct is identical under both — `dist/` is
# inventoried whole and every entry that is not one of the two established
# artefacts is refused by name — so no verdict in this file is a function of
# what any action does with a leading dot. The annotations state the
# whole-directory reading because it is the WORSE case, and asserting the worse
# case in a message to a human is safe where resting a refusal on the better
# case is not. Ignoring the class would have waved a `dist/.stelling-0.0.9.zip`
# through the one check that exists to inventory the directory, whichever
# reading is true. One exception costs a refusal on the day `uv` writes a
# second dotfile into `dist/`, or writes a different byte into this one;
# re-deciding that deliberately is the right price in the one file whose
# mistakes cannot be undone.
#
# THE FOURTEENTH IS `tar` FAILING IN THE SDIST STEP, AND THE SENTENCE IT
# REPLACED WAS THIS FILE'S OWN ARGUMENT TURNED AROUND. What stood beside that
# step said a CORRUPT tarball "dies in the pipeline above at tar's own rc 2,
# with no annotation. Still red, so still safe" — excused because that step IS
# a refusal point, so failing closed is the answer it exists to give. The
# thesis here is not FAIL CLOSED, it is A REFUSAL MUST SAY IT REFUSED: rc=2 is
# TAR's exit code, this step's own refusals are rc=1, and this same step has
# been repaired out of exactly that state TWICE already — the no-wheel case
# ("`ls`'s own rc=2 with no annotation — red, but not by this gate") and the
# two-tarball case. And nothing earlier reads the tarball's BYTES, so "an
# earlier step would have caught it" was never available either: MEASURED, the
# tag step returns rc=0 on every corrupt shape measured — six of them, beside
# that step — because it reads FILENAMES and never opens either file. A corrupt tarball reached a step that dies
# without speaking THROUGH A GREEN GATE. See beside that step for the table and
# for what `pipefail` does and does not catch.

name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: the suite, on the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Unnarrowed, and with the skip-inventory verdict asserted off a channel
      # the exit code cannot reach — same reasoning as the `ci` workflow. A
      # publish must not ride on a session that silently dropped its checks.
      #
      # REFUSAL POINT (implicit — pytest's own exit code). GREEN, driven at
      # a61c01f in this job's own venv: `2519 passed, 16 skipped` (junitxml:
      # 2535 tests, 0 failures, 0 errors), 157.9 s. RED, with one failure
      # injected by a plugin: the step exits 1 HERE and the two verdict checks
      # below are never reached — which is the order they want.
      #
      # THE PRECISION IS WHATEVER EACH MODULE CHOOSES. Neither workflow sets
      # `JAX_ENABLE_X64`, and 52 of 97 test modules name `jax_enable_x64`
      # themselves, so this green is a mixture by construction. That is a fact
      # about the figure, not a defect: the modules that care pin it.
      - name: pytest, with the skip-inventory verdict asserted separately
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/verdict.txt
        run: |
          set -euo pipefail
          # ABSENCE is the signal this step buys, and it is only a signal if
          # nothing else could have left a file here. RE-DRIVEN IN BOTH
          # DIRECTIONS at a61c01f, same inputs to each: a `verdict=made` file
          # planted at the path, and a pytest that writes none (a plugin drops
          # the environment variable, the route tests/conftest.py names in its
          # own docstring). WITH this line the step exits 1 on "no verdict was
          # written"; with this line DELETED the step exits 0 and `cat`s the
          # planted file into the publish log. The line earns its place, and
          # that is the measurement rather than the argument for it.
          rm -f "${RUNNER_TEMP}/verdict.txt"
          # `-ra`, not `-rs`. Re-driven at a61c01f on the SAME red session, one
          # injected failure: `-ra` prints `FAILED
          # tests/test_verdict.py::test_every_contract_field_is_required`,
          # `-rs` prints zero `FAILED` lines, and both exit 1. So the exit code
          # is the same and the publish log of a red suite names what failed
          # only under `-ra`.
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/verdict.txt"
          # REFUSAL POINT. Driven red at a61c01f: with the recorder's
          # environment variable removed the session exits 0 (`12 passed`)
          # and leaves no file, and this exits 1.
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the recorder was ignored, filtered out or never loaded — and pytest's own exit code cannot report that."
            exit 1
          fi
          cat "${verdict}"
          # REFUSAL POINT, and the one that catches a NARROWED session, which
          # nothing else here can see. Driven red at a61c01f with
          # `pytest tests/test_verdict.py` appended: pytest exits 0 on
          # `12 passed`, the recorder writes `verdict=withdrawn`, and this
          # exits 1. (A narrowing that collects nothing does not reach here at
          # all — pytest exits 5 and `set -e` stops above. Red either way.)
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the completeness claim was not made::Refusing to publish on a session that could not claim the suite."
            exit 1
          fi
      # REFUSAL POINT (implicit — this command's own exit code), and it is a
      # real one rather than an informational print.
      # Driven at a61c01f: 0 with z3 5.0.0.0 and cvc5 1.3.4 both reporting
      # `[selfcheck: ok]`, and 1 with `STELLING_CVC5` pointed at a stub that
      # answers `sat` to `(distinct x x)` — `[selfcheck FAILED: expected
      # `unsat` for `x != x`, got 'sat']`. Missing optional dependencies stay
      # informational; a BROKEN installed one is what turns this red.
      - run: .venv/bin/python -m stelling

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # Driven for real at a61c01f (no tag, nothing uploaded): 279-member
      # `stelling-0.1.0.tar.gz` and 28-member `stelling-0.1.0-py3-none-any.whl`.
      - run: uv build
      # `tag_name` is attacker-influenced in the general case, so it goes
      # through the environment rather than being interpolated into the shell.
      # The comparison is against the BUILT ARTEFACTS' names, not against
      # `__version__` read from the source: the filename is what gets uploaded,
      # so it is the thing that has to agree with the tag.
      #
      # REFUSAL POINT, driven at a61c01f over seven tags against the real
      # `stelling-0.1.0-py3-none-any.whl`. PASSES on `v0.1.0` and `0.1.0`.
      # REFUSES `v0.2.0`, `0.2.0`, the empty string, `v0.1.0 ` (trailing space)
      # and `V0.1.0` — the last three are worth knowing, because a gate that
      # normalised them would be a gate that could be talked past.
      #
      # AND THE SAME REFUSAL FOR THE SDIST, which is new and which this file's
      # own last sentence used to argue was unnecessary: "same build, so it
      # agrees by construction". That is a COUPLING and not a check — the same
      # word this file already uses for what was said to protect the wheel's
      # member list — and it is the same shape of premise the wheel COUNT
      # refusal below was written to stop accepting. It was driven false: a
      # `dist/` holding `stelling-0.2.0-py3-none-any.whl` beside a
      # `stelling-0.0.9.tar.gz`
      # whose every member is committed took `TAG=v0.2.0` through this step at
      # rc=0 (`tag=v0.2.0 artifact version=0.2.0`) and through the sdist step
      # at rc=0 ("every one of 5 sdist members is committed to this tree").
      # `0.0.9` would have gone to PyPI under a release called v0.2.0. Refusal
      # reason 2 at the top of this file — the version is read by hatchling,
      # the tag is typed by a human, nothing connects them — is not one word
      # weaker for the tarball than for the wheel, and the tarball is the
      # artefact that gets built from source on every machine without a
      # matching wheel.
      #
      # DRIVEN IN BOTH DIRECTIONS on the body below, `dist/` of empty files:
      #
      #   dist/                                TAG           verdict
      #   0.2.0.whl + 0.2.0.tar.gz             v0.2.0        rc=0
      #   0.2.0.whl + 0.0.9.tar.gz             v0.2.0        rc=1 tag and sdist
      #   0.0.9.whl + 0.2.0.tar.gz             v0.2.0        rc=1 tag and wheel
      #   0.2.0.whl + 0.2.0.dev0.tar.gz        v0.2.0        rc=1 tag and sdist
      #   0.2.0.dev0.whl + 0.2.0.dev0.tar.gz   v0.2.0.dev0   rc=0
      #   0.2.0.whl + 0.2.0 and 0.0.9 .tar.gz  v0.2.0        rc=1 not one sdist
      #   0.2.0.whl + no tarball               v0.2.0        rc=1 not one sdist
      #
      # The last row is why `basename … .tar.gz` strips the suffix before
      # `cut`: without it the version reads `0.2.0.dev0.tar.gz`, which matches
      # no tag at all and would refuse the RIGHT tarball as loudly as a wrong
      # one. `tests/test_release_gates.py` drives every row inside the suite.
      #
      # A SECOND REFUSAL POINT IN THIS STEP, RUNNING BEFORE THE ONE ABOVE, and
      # it replaced a silent PICK. `ls dist/*.whl` returns EVERY match and
      # `basename` on a multi-line string returns
      # whatever follows the LAST `/`, so with two wheels present this step
      # examined ONE of them and said nothing whatever about the other — while
      # `upload-artifact` takes the whole `dist/` directory, `download-artifact`
      # restores it, and the publish step uploads every file in it. A gate that
      # reads "the wheel" where there is more than one is not answering its own
      # question, so it now establishes that there is EXACTLY ONE and refuses a
      # `dist/` it cannot reason about.
      #
      # THE JUSTIFICATION THAT STOOD HERE IS FALSE, AND IS CORRECTED RATHER
      # THAN DELETED. It read: *"`ls` SORTS, so the LAST match is the HIGHEST
      # version, and that is the one compared"*, and concluded that what goes
      # green is a stray that sorts BEFORE the real wheel. The conclusion
      # survives; the reason does not. It was a coincidence of the two examples
      # it was drawn from — `0.0.9`, `0.1.0`, `0.2.0` differ in a DIGIT, and
      # every collation agrees about digits. Put a PEP 440 dev segment beside
      # its own release and the LAST match is the LOWER version under `C` and
      # the HIGHER one under a UTF-8 locale: `-` sorts before `.` in ASCII,
      # while a UTF-8 collation ignores punctuation at the primary level. So
      # "sorts before" is a property of the RUNNER'S LOCALE and of the two
      # filenames, and never of the version. Re-driven on a `dist/` of two
      # empty files with the old step body verbatim:
      #
      #   wheels in dist/       TAG      LC_ALL=C          en_GB / en_US.UTF-8
      #   0.1.0 + 0.2.0       v0.1.0   0.2.0      rc=1     0.2.0      rc=1
      #   0.0.9 + 0.1.0       v0.1.0   0.1.0      rc=0 !   0.1.0      rc=0 !
      #   0.2.0 + 0.2.0.dev0  v0.2.0   0.2.0.dev0 rc=1     0.2.0      rc=0 !
      #
      # The third row is the one the old sentence could not describe: one tree,
      # two files, one tag, and a different verdict per runner locale. Every
      # `rc=0` there is a wheel nobody tagged going to PyPI permanently.
      #
      # `export LC_ALL=C` IS SET AND IS NOT WHAT FIXES THIS, which is why it is
      # not offered as the repair. Driven with ONLY the export added to the old
      # body: row three becomes rc=1 under all three locales — deterministic —
      # and row two is still rc=0, so a `0.0.9` nobody tagged still ships
      # beside the `0.1.0`. Determinism is worth having and is kept; the answer
      # it was making deterministic was the wrong answer.
      #
      # EXACTLY ONE WHEEL AND EXACTLY ONE SDIST, RATHER THAN CHECKING EVERY
      # FILE FOUND — the choice, and the reason. What this step exists to
      # answer is not "is there a file here whose version matches the tag" but
      # "will this release publish anything the tag does not name", and the
      # unit of THAT answer is the DIRECTORY, because the directory is what
      # gets uploaded. Checking every match still passes a `dist/` holding two
      # wheels that both spell the tagged version — one built here, one left by
      # some other build of some other tree — and agreeing about a version is
      # not provenance. `uv build` on this project produces exactly one wheel
      # and exactly one sdist: the wheel is `py3-none-any`, there is no build
      # matrix, no compiled extension and no `cibuildwheel`, and there is one
      # sdist target, so a second of either is not a shape this release path
      # can produce and is precisely the evidence that `dist/` holds something
      # this job did not build. The cost is named rather than hidden: if this
      # project ever ships more than one wheel, this step has to be edited, and
      # re-deciding it deliberately is the right price in the one file whose
      # mistakes cannot be undone.
      #
      # AND THE DIRECTORY, WHICH IS WHAT THE TWO COUNTS ABOVE ARE NOT. Two
      # globs are not an inventory: a `dist/` entry that is neither `.whl` nor
      # `.tar.gz` was invisible to every step in this file, and the header's
      # excuse for that — the publish action rejects what it cannot recognise —
      # is measurably false for `.zip`. See "THE THIRTEENTH" in the header for
      # the twine reading and the three-green-gates reproduction. The rule this
      # step now applies is the one already written above it: once the one
      # wheel and the one sdist are established, every other entry in `dist/`
      # is a refusal, named. DRIVEN IN BOTH DIRECTIONS on the body below,
      # `TAG=v0.2.0`, real `stelling-0.2.0` artefacts:
      #
      #   dist/ holds                                          verdict
      #   whl + tar.gz + .gitignore                            rc=0
      #   whl + tar.gz + .gitignore + stelling-0.0.9.zip       rc=1 names it
      #   whl + tar.gz + .gitignore + notes.txt                rc=1 names it
      #   whl + tar.gz + .gitignore + stray/ (a directory)     rc=1 names it
      #   whl + tar.gz + .gitignore + .stelling-0.0.9.zip      rc=1 names it
      #   whl + tar.gz  (no .gitignore at all)                 rc=0
      #
      # The last two rows are the dotfile decision and they are both halves of
      # it: `dist/.gitignore` is allowed because `uv build` writes it, it is
      # not REQUIRED to be there, and no other dotfile is allowed —
      # `shopt -s dotglob` is what makes the loop able to see one at all. The
      # reasoning, and the alternative that was rejected, are in the header.
      #
      # AND THE ALLOWED ENTRY IS A FILE AND NOT A NAME. The exception used to
      # be the literal `dist/.gitignore`, which exempted an entry of arbitrary
      # type, size and content from the one check whose stated unit is the
      # DIRECTORY. It is taken on the CONTENT now — a regular file of exactly
      # one byte, and that byte `*`, which is what `uv build` writes and what
      # the header measured and did not use. DRIVEN IN BOTH DIRECTIONS on the
      # body below, `TAG=v0.2.0`, the same real artefacts, with only the entry
      # called `dist/.gitignore` changed:
      #
      #   dist/.gitignore is                                   verdict
      #   a regular file of one byte, `*`                      rc=0
      #   absent entirely                                      rc=0
      #   a regular file of one byte, `x`                      rc=1 names it
      #   0 bytes                                              rc=1 names it
      #   arbitrary text                                       rc=1 names it
      #   `*` followed by a newline                            rc=1 names it
      #   a coherent 4.4 MB stelling-0.0.9.zip renamed         rc=1 names it
      #   a SYMLINK to a file whose content is `*`             rc=1 names it
      #   a DIRECTORY holding a .zip                           rc=1 names it
      #   a regular one-byte `*` with mode 000                 rc=1 names it
      #
      # The middle rows are what a NAME could not see, and the one-byte `x` and
      # the trailing newline are the halves that keep the check honest: one
      # byte is not enough and `*` somewhere in the file is not enough. `-L` is
      # checked BEFORE `-f` because `-f` follows a symlink, so the symlink row
      # would otherwise read as a regular file. The last row is the failure
      # mode of the check itself and it fails CLOSED: `wc -c` cannot read the
      # file, the test errors, the `&&` chain is false and the entry is named
      # like any other — an entry this step cannot READ is not one it vouches
      # for. NO `exit 1` SITE IS ADDED and the header's
      # count does not move: a `dist/.gitignore` this step will not vouch for
      # is named by the refusal that was already there.
      # `tests/test_release_gates.py` drives every row inside the suite.
      #
      # THE TWO-TARBALL SHAPE DID NOT SILENTLY PICK — IT DIED WITHOUT SAYING SO,
      # which is a different defect with the same repair, and the difference is
      # recorded because the wheel paragraph above is about a PICK and it would
      # be easy to copy that reading across. `sdist="$(ls dist/*.tar.gz)"` is
      # QUOTED, so two matches become one string with a newline in it and `tar`
      # is handed a filename that does not exist. Driven on the shipped bodies,
      # `dist/` holding `stelling-0.0.9.tar.gz` and `stelling-0.2.0.tar.gz`:
      # the sdist step exited 2 with `tar (child): dist/stelling-0.0.9.tar.gz`
      # + a newline + `dist/stelling-0.2.0.tar.gz: Cannot open`, and NO
      # annotation — "red, but not by this gate", the exact state the no-wheel
      # case was repaired out of. Zero tarballs is the same: `ls` fails on the
      # unexpanded glob. Both are this step's own refusal now, with a message.
      #
      # AND IT CLOSES THE NO-WHEEL CASE, which this comment used to record as a
      # shortcoming: with no wheel at all the old body died on `ls`'s own rc=2
      # with no annotation — "red, but not by this gate". Driven: rc=2 and
      # `ls: cannot access` before, rc=1 and this step's own annotation after.
      #
      # NONE OF IT IS REACHABLE FROM THIS WORKFLOW TODAY — `actions/checkout@v4`
      # gives this job a fresh clone, `dist/` is gitignored and has no tracked
      # member, and one `uv build` fills it. It is repaired because it is
      # wrong, not because it is urgent.
      #
      # DRIVEN HERE, NOT ONLY ON A RUNNER. The table above, the `LC_ALL=C`-only
      # variant, the no-wheel case, the one-wheel green and the seven tags
      # above were all driven on the body below under `C`, `en_GB.UTF-8` and
      # `en_US.UTF-8`; the one-wheel green and the seven tags are unchanged in
      # every cell. `tests/test_release_gates.py` extracts this body and drives
      # every refusal in it inside the suite, so they stay driven.
      #
      # RE-DRIVEN ON THE BODY THIS COMMIT SHIPS, after `dotglob` and the
      # directory inventory landed: the seven tags again, against real
      # `stelling-0.2.0` artefacts in a `dist/` that also holds the
      # `.gitignore` `uv build` writes — `v0.2.0` and `0.2.0` rc=0, and
      # `v0.9.9`, `0.9.9`, the empty string, `v0.2.0 ` (trailing space) and
      # `V0.2.0` rc=1. Every row of the version table above reproduces
      # unchanged, and so does every wheel-count and sdist-count row. Nothing
      # a release must still accept moved.
      - name: the tag and the artifacts must agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Determinism for everything below, and the sdist step has it too.
          # It is NOT what makes the count right — see the comment above.
          export LC_ALL=C
          # `nullglob` so an empty `dist/` reaches the refusals below as zero
          # matches instead of arriving here as the literal glob string, and
          # `dotglob` so every glob in this step reads the WHOLE directory. A
          # hidden `.whl` is a wheel and a hidden `.zip` is a file that gets
          # uploaded; a check whose subject is the directory may not be blind
          # to an entry because of how it is spelled.
          shopt -s nullglob dotglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'dist/*.whl matched %s file(s)\n' "${#wheels[@]}"
            [ "${#wheels[@]}" -eq 0 ] || printf '  %s\n' "${wheels[@]}"
            echo "::error title=dist/ does not hold exactly one wheel::${#wheels[@]} files match dist/*.whl, and this step can only speak for the one this job built. upload-artifact takes the whole directory and the publish step uploads every file in it, so a wheel this comparison never examined would go to PyPI permanently. One 'uv build' of this project produces exactly one py3-none-any wheel; anything else in dist/ came from somewhere this job cannot account for. Empty dist/ and re-run the build."
            exit 1
          fi
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            printf 'dist/*.tar.gz matched %s file(s)\n' "${#sdists[@]}"
            [ "${#sdists[@]}" -eq 0 ] || printf '  %s\n' "${sdists[@]}"
            echo "::error title=dist/ does not hold exactly one sdist::${#sdists[@]} files match dist/*.tar.gz, and this step can only speak for the one this job built. upload-artifact takes the whole directory and the publish step uploads every file in it, so a tarball this comparison never examined would go to PyPI permanently — and an sdist cannot be unpublished, only yanked. One 'uv build' of this project produces exactly one sdist; anything else in dist/ came from somewhere this job cannot account for. Empty dist/ and re-run the build."
            exit 1
          fi
          # THE DIRECTORY, NOW THAT THE TWO ARTEFACTS ARE ESTABLISHED. Every
          # entry that is neither of them is refused and named. `dist/` is what
          # `upload-artifact` takes and what the publish step uploads, so this
          # is the only place in the file where the question the step opens
          # with — "will this release publish anything the tag does not
          # name" — is actually asked of the thing that gets published.
          extras=()
          for entry in dist/*; do
            case "${entry}" in
              "${wheels[0]}"|"${sdists[0]}") continue ;;
              # `uv build` writes this itself; see the header for why it is one
              # exception and not a class of them, and the table above for why
              # it is taken on the CONTENT rather than on the name. `! -L`
              # first: `-f` follows a symlink, so a symlink to a regular file
              # would satisfy `-f` on its own. `wc -c` pins the length to the
              # one byte this header measured and `cat` pins that byte, so
              # neither a longer file that starts with `*` nor a one-byte file
              # that is not `*` is vouched for.
              dist/.gitignore)
                if [ ! -L "${entry}" ] && [ -f "${entry}" ] \
                   && [ "$(wc -c < "${entry}")" -eq 1 ] \
                   && [ "$(cat "${entry}")" = "*" ]; then
                  continue
                fi
                ;;
            esac
            extras+=("${entry}")
          done
          if [ "${#extras[@]}" -ne 0 ]; then
            printf 'dist/ holds entries that are neither the wheel nor the sdist:\n'
            printf '  %s\n' "${extras[@]}"
            echo "::error title=dist/ holds files this job did not build::${#extras[@]} entries in dist/ are neither the one wheel nor the one sdist this step just established, and they are listed above. upload-artifact takes the whole directory and the publish step uploads every file in it, so being neither a .whl nor a .tar.gz does not make a file safe: twine recognises .zip as a SOURCE DISTRIBUTION, a coherent stelling-0.0.9.zip passed twine check at rc=0, and with one in dist/ the tag, sdist and manifest steps of this workflow all returned 0. This step used to rely on the publish action rejecting what it cannot recognise; it recognises .zip. dist/.gitignore is the one entry this step will pass over, and only as a regular file of exactly one byte, '*', which is what uv build writes: a .gitignore of any other type, size or content is listed above like anything else. Empty dist/ and re-run the build."
            exit 1
          fi
          # `cut -d- -f2` off the basename for both, and `.tar.gz` stripped
          # first because an sdist name is `<name>-<version>.tar.gz` with no
          # separator after the version — `cut` alone yields `0.0.9.tar.gz`.
          #
          # LATENT, NOT LIVE, AND IT FAILS CLOSED — recorded because the day it
          # bites is a day somebody is renaming the project. `-f2` is the
          # second HYPHEN-delimited field, so this reads the version correctly
          # exactly while the distribution NAME holds no hyphen. `stelling`
          # holds none, and PEP 625 keeps it that way for the sdist: a
          # compliant backend normalises `a-b` to `a_b` in the filename, so
          # `stelling_core-0.2.0.tar.gz` still reads `0.2.0` (measured). What
          # breaks it is a filename that KEEPS the hyphen —
          # `stelling-core-0.2.0.tar.gz` reads `core`, and the wheel spelling
          # `stelling-core-0.2.0-py3-none-any.whl` reads `core` too (both
          # measured) — which is what a legacy or non-normalising backend
          # writes. Nothing is published on it: no tag equals `core`, so both
          # comparisons below refuse, loudly, on the right side.
          version="$(basename "${wheels[0]}" | cut -d- -f2)"
          sdist_version="$(basename "${sdists[0]}" .tar.gz | cut -d- -f2)"
          echo "tag=${TAG} wheel version=${version} sdist version=${sdist_version}"
          if [ "${TAG}" != "v${version}" ] && [ "${TAG}" != "${version}" ]; then
            echo "::error title=tag and wheel disagree::The release is tagged '${TAG}' but the built wheel is version '${version}'. Publishing would put '${version}' on PyPI permanently, under a release that says otherwise. Fix __version__ or the tag; do not re-run this job until they match."
