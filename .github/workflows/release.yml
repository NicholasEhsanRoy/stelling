# Publishes to PyPI via Trusted Publishing (OIDC). No API tokens exist.
# The publish action generates PEP 740 attestations by default; do not
# disable them. Requires a (pending) Trusted Publisher configured on PyPI
# for this repository + workflow + environment.
#
# TWO GATES STAND BETWEEN A TAG AND PyPI, because this is the one workflow
# whose mistakes are immutable: a release on PyPI cannot be unpublished, only
# yanked, and a yanked file still resolves for anyone who pins it.
#
#   1. THE SUITE, on the tagged tree. `ci` runs on pushes to main and on pull
#      requests — neither of which is this event. A GitHub Release can be cut
#      from any commit, tag or branch, so "ci was green" is a statement about
#      some other tree unless it is re-established here.
#   2. THE TAG AND THE ARTIFACT MUST AGREE. The version is read from
#      `src/stelling/__init__.py` by hatchling; the tag is typed by a human in
#      a web form. Nothing connects them. Tagging `v0.2.0` on a tree that still
#      says `0.1.0` publishes `stelling-0.1.0` under a release called v0.2.0 —
#      silently, and permanently.

name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: the suite, on the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Unnarrowed, and with the skip-inventory verdict asserted off a channel
      # the exit code cannot reach — same reasoning as the `ci` workflow. A
      # publish must not ride on a session that silently dropped its checks.
      - name: pytest, with the skip-inventory verdict asserted separately
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/verdict.txt
        run: |
          set -euo pipefail
          # ABSENCE is the signal this step buys, and it is only a signal if
          # nothing else could have left a file here. Driven, under `bash -e`
          # with the environment faked: with a verdict file already at the path
          # and a pytest that writes none, the step exits 0 on a session that
          # wrote nothing — a publish riding on an earlier run's verdict.
          rm -f "${RUNNER_TEMP}/verdict.txt"
          # `-ra`, not `-rs`. Driven on one failing and one skipping test:
          # `-rs` prints the SKIPPED line and omits `FAILED <nodeid>`, so the
          # publish log of a red suite does not name what failed. `-ra` is a
          # superset and the exit code is 1 either way.
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/verdict.txt"
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the recorder was ignored, filtered out or never loaded — and pytest's own exit code cannot report that."
            exit 1
          fi
          cat "${verdict}"
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the completeness claim was not made::Refusing to publish on a session that could not claim the suite."
            exit 1
          fi
      - run: .venv/bin/python -m stelling

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # `tag_name` is attacker-influenced in the general case, so it goes
      # through the environment rather than being interpolated into the shell.
      # The comparison is against the BUILT ARTIFACT's name, not against
      # `__version__` read from the source: the filename is what gets uploaded,
      # so it is the thing that has to agree with the tag.
      - name: the tag and the artifact must agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          version="$(basename "${wheel}" | cut -d- -f2)"
          echo "tag=${TAG} artifact version=${version}"
          if [ "${TAG}" != "v${version}" ] && [ "${TAG}" != "${version}" ]; then
            echo "::error title=tag and artifact disagree::The release is tagged '${TAG}' but the built artifact is version '${version}'. Publishing would put '${version}' on PyPI permanently, under a release that says otherwise. Fix __version__ or the tag; do not re-run this job until they match."
            exit 1
          fi
      # THE ASSERTION `tests/test_sdist_contents.py` CANNOT MAKE ON A
      # CONTRIBUTOR'S MACHINE, and the step below used to print the manifest
      # and assert nothing about it.
      #
      # Three tests in that module are gated on `uv` and skip without it —
      # including `test_an_arbitrary_new_file_does_not_ship`, the module's own
      # headline property and the only one established by intervention.
      # Measured on a PATH with no `uv`: `9 passed, 3 skipped` at a4c16fe, and
      # one smuggling shape (a committed dangling symlink) goes from red to
      # green with it. Making that skip a hard failure would be flaky in the
      # environment where it matters least — a contributor's first `pytest`.
      # It matters HERE, one step from immutable, so the failure belongs here.
      # Every pytest job in this repository already uses
      # `astral-sh/setup-uv@v6`, so no CI run takes that skip either.
      #
      # It is deliberately NOT a copy of the test module's model of hatchling.
      # It reads the built tarball and the index and asks the one question a
      # release can answer completely: was every member committed to the
      # TAGGED tree? That covers every force-include route at once — an
      # ancestor `.gitignore`/`.hgignore` arriving keyed by basename, a
      # `force-include` table, a `hatch_build.py` hook — and every untracked
      # file, without modelling any of them.
      - name: every sdist member is a committed file of the tagged tree
        env:
          # Written by the build backend from the project metadata; no tree
          # path can supply it. Kept in step with `GENERATED_IN_DISTRIBUTION`
          # in tests/test_sdist_contents.py.
          GENERATED: PKG-INFO
        run: |
          set -euo pipefail
          export LC_ALL=C
          sdist="$(ls dist/*.tar.gz)"
          tar tzf "${sdist}" | sed -e 's|^[^/]*/||' -e '/\/$/d' -e '/^$/d' | sort -u > members.txt
          git ls-files | sort -u > tracked.txt
          printf '%s\n' "${GENERATED}" | sort -u > generated.txt
          sort -u tracked.txt generated.txt > explained.txt
          # ZERO EXAMINED MUST NOT READ AS ZERO PROBLEMS. Each of these is a
          # way for the comparison below to come back empty because it looked
          # at nothing: an unreadable tarball, an index this job cannot see, a
          # `sed` that ate every line.
          for f in members.txt tracked.txt explained.txt; do
            if [ ! -s "${f}" ]; then
              echo "::error title=the sdist check examined nothing::${f} is empty, so the comparison below could not have found anything. Refusing to publish."
              exit 1
            fi
          done
          for required in "${GENERATED}" pyproject.toml README.md LICENSE; do
            if ! grep -qxF "${required}" members.txt; then
              echo "::error title=the sdist check is not looking at a real artefact::'${required}' is not in ${sdist}. Refusing to publish."
              exit 1
            fi
          done
          unexplained="$(comm -23 members.txt explained.txt)"
          if [ -n "${unexplained}" ]; then
            echo "${unexplained}"
            echo "::error title=the sdist ships files that are not committed to this tree::The members listed above are in ${sdist} and not in \`git ls-files\` for the tagged commit. An sdist on PyPI cannot be unpublished, only yanked, and a yanked file still resolves for anyone who pins it. Either commit them and re-tag, or find the force-include route putting them there (see tests/test_sdist_contents.py). Refusing to publish."
            exit 1
          fi
          echo "every one of $(wc -l < members.txt) sdist members is committed to this tree"
          rm -f members.txt tracked.txt generated.txt explained.txt
      # A last look at what would ship, in the log, before it becomes immutable.
      # tests/test_sdist_contents.py already holds the allowlist shut; this is
      # here so the record of a release includes the file list it published.
      - name: the sdist manifest, for the record
        run: |
          set -euo pipefail
          sdist="$(ls dist/*.tar.gz)"
          echo "### sdist contents (${sdist})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tar tzf "${sdist}" | sed 's|^[^/]*/||' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # THE REFS IN THIS JOB ARE A DECISION, NOT AN OVERSIGHT.
  #
  # `pypa/gh-action-pypi-publish@release/v1` is a BRANCH ref, on the only job
  # in this repository that holds `id-token: write` and the only one that can
  # write to PyPI permanently. Everything else here — `actions/checkout@v4`,
  # `astral-sh/setup-uv@v6`, `actions/{upload,download}-artifact@v4` — is a
  # floating MAJOR TAG. Both are mutable; the difference is who moves them and
  # when. A major tag is moved by its owner at each release; a branch moves
  # with every commit that lands on it.
  #
  # NOT PINNED TO A SHA, for three reasons, in order of weight:
  #
  #   1. PINNING ONLY THIS STEP WOULD BE THEATRE. The bytes uploaded to PyPI
  #      arrive through `actions/download-artifact@v4`, one line above. An
  #      action that can substitute the artifact needs no `id-token` of its
  #      own. Hardening the chain means pinning the whole chain — checkout,
  #      setup-uv, both artifact actions, and this one — or pinning none of it.
  #   2. A PIN WITHOUT AUTOMATION BECOMES A STALE PIN, and stale is a live
  #      hazard for this action specifically: PEP 740 attestations are
  #      generated by DEFAULT and must not be disabled, and that default
  #      arrived in a release. A SHA frozen below it publishes without
  #      attestations and says nothing about it. So the correct form is a SHA
  #      plus a Dependabot/Renovate entry that bumps it, and the pin should not
  #      land before the automation does.
  #   3. THE SHA WOULD BE UNVERIFIABLE WHERE THIS WAS WRITTEN — no network. A
  #      40-character ref typed from memory onto the publish step is worse than
  #      a branch ref maintained by PyPA: at best the job fails on release day,
  #      at worst it resolves to a commit nobody chose.
  #
  # Pinning does NOT break Trusted Publishing — the OIDC token is minted by
  # GitHub for this job and exchanged by whatever code runs, so the ref is
  # irrelevant to it — and that is not the reason for leaving it alone.
  #
  # WHAT A HUMAN SHOULD DO, on a machine with network, as one change: add
  # `.github/dependabot.yml` with `package-ecosystem: github-actions`, then pin
  # all five actions in this file to `@<sha>  # vX.Y.Z`, then confirm on a test
  # release to TestPyPI that attestations are still generated.
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
