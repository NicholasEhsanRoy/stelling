                elif [ "${got_type}" != "tag" ]; then
                  problems+=("${ref} is a ${got_type} object and not an annotated tag, so it carries no tagger date at all: a lightweight tag has no release date for the heading to agree with. TO RECOVER, and it is TWO edits and not one: delete the tag here and on the remote ('git tag -d ${tag}' and 'git push origin :refs/tags/${tag}'), re-cut it ANNOTATED at the same commit ('git tag -a ${tag} <sha> -m ...'), push it, and put the date the NEW tag object gets onto the newest CHANGELOG.md heading -- re-cutting it today makes TODAY the tag's date, so this step will refuse the old heading date on the next run unless the heading moves with it. TO AVOID IT NEXT TIME: push an annotated tag FIRST and create the release on the tag that already exists -- which is how every release this project had cut as of 2026-08-28, measured rather than assumed, beside this step. This step makes no claim about what any release UI does with a tag name that does not yet exist; see beside it for the evidence there is, what could not be determined, and why this refusal is kept anyway.")
                elif [ -z "${got_date}" ]; then
                  problems+=("${ref} is a tag object whose tagger date is empty, so there is nothing to compare the heading's date against.")
                else
                  tag_date="${got_date}"
                fi
              fi
            fi
          fi

          # THE HEADING. Newest is a POSITION in the document: the first
          # '## ' line in file order, whatever it then turns out to say.
          # FOUND first and PARSED second, deliberately -- one combined
          # pattern would step PAST a malformed newest heading and take an
          # older one for the newest, which is a guard reading the absence of
          # a match as the absence of a problem.
          #
          # THE HEADING RULE IS A RENDERER'S, NOT A REGEX'S, AND AN AUDITOR
          # DROVE WHY. This read `^##[[:space:]]` and its Python twin read
          # `^##\s` over the whole document. Both missed a heading indented by
          # ONE TO THREE spaces, which CommonMark renders as an ordinary <h2> --
          # so a NEWER heading written that way was stepped past to an older
          # one, and this gate returned rc=0 over exactly the tag/heading
          # disagreement it exists to refuse. Both also took a `##` line inside
          # a fenced block or an HTML comment, and `CHANGELOG.md` opens with an
          # HTML comment. Driven, on the body this file shipped: an indented
          # newer heading gave `release.yml gate rc=0`.
          #
          # AND THE FIX FOR THAT WAS STILL PERMISSIVE IN FOUR MORE PLACES,
          # WHICH A RENDERER FOUND AND A SECOND READING OF THE RULES DID NOT.
          # The scan toggled `fenced` on ANY ``` or ~~~ line, opened an HTML
          # comment on any line CONTAINING `<!--`, and knew nothing of setext,
          # of HTML blocks that are not comments, or of a heading indented
          # four columns inside a list item. Driven with
          # `markdown_it.MarkdownIt("commonmark")` over every document of at
          # most three lines on a fourteen-token alphabet -- 2954 of them --
          # against the body this file shipped at `a90862b`:
          #
          #   ('```',  '~~~',   '## 0.2.1 - 2026-08-28')   renderer: NO <h2>
          #   ('```',  '``` t', '## 0.2.1 - 2026-08-28')   renderer: NO <h2>
          #   ('````', '```',   '## 0.2.1 - 2026-08-28')   renderer: NO <h2>
          #   ('text', '---',   '## 0.2.1 - 2026-08-28')   renderer: <h2> 'text'
          #   ('<div>',         '## 0.2.1 - 2026-08-28')   renderer: NO <h2>
          #   ('1. item', '    ## 9.9.9 - 2000-01-01',
          #               '## 0.2.1 - 2026-08-28')         renderer: the 9.9.9
          #
          # 42 of the 2954, and each one is rc=0 from this step with the tag's
          # own version and date echoed, over a document whose newest RENDERED
          # heading names a different release or is not a heading at all. And
          # in the other direction, `` `<!--` `` -- the comment opener inside a
          # code span -- opened a comment that ran to EOF and made this step
          # say "CHANGELOG.md holds no '## ' heading at all" about a file with
          # several: 20 documents of the same corpus, all of them read
          # correctly now.
          #
          # WHAT IT DOES NOW IS REFUSE, NOT PARSE. This step reads only the
          # PREFIX of the document, up to and including the first '## ' line;
          # nothing below that line can move which line is newest. In that
          # prefix it decides exactly three things -- a fenced block (by
          # CHARACTER, RUN LENGTH and the absence of an info string, which is
          # CommonMark's actual closing rule), an HTML comment (CommonMark's
          # HTML block type 2: `<!--` at the START of the line after at most
          # three spaces, ending on the first line CONTAINING `-->`), and an
          # ATX heading -- and every other line must be one of a WHITELIST of
          # shapes that cannot be, or hide, a heading: blank, indented four or
          # more spaces, another ATX level, or a paragraph line beginning with
          # a letter, a digit or a code span. Anything else STOPS THE SCAN and
          # is refused by name.
          #
          # THE DEFAULT IS REFUSAL AND THAT IS THE TRADE, made deliberately: a
          # `>` block quote, a `- ` or `1. ` list, a `<div>`, a `---` or `===`
          # setext underline, a leading tab, seven hashes -- all of them are
          # legal Markdown that a renderer reads without difficulty, and all of
          # them are refused here. Refusing an exotic-but-valid CHANGELOG.md
          # costs a maintainer one edit. Passing one costs a wrong release note
          # standing beside an artefact PyPI cannot unpublish. A construct
          # nobody here has thought of lands in the refusal branch rather than
          # being stepped over, which is the direction a whitelist buys and a
          # list of known hazards does not.
          #
          # Four leading spaces is an indented code block and is deliberately
          # NOT a heading, which is why the bound is three. `##` with nothing
          # after it IS a heading line and is refused by `heading_re` below,
          # which is the point -- refusing beats reading past.
          #
          # THE PATTERNS ARE APPLIED TO `rest`, the line with its (at most
          # three) leading blanks removed, so `^##` here means what
          # `^ {0,3}##` meant before: the indent has already been decided
          # above. A backtick cannot be written into a single-quoted bash
          # regex in this YAML without the backslash surviving into the
          # pattern -- driven: the first attempt made every line read as a
          # fence and the gate reported "no '## ' heading at all" on a
          # changelog whose first line is one -- so fence runs are counted
          # with `case` and parameter expansion, and the one regex that needs
          # a backtick is built from `bt`.
          #
          # AND THE SEPARATORS ARE `[[:blank:]]` AND NOT `[[:space:]]`, WHICH
          # IS A SOUNDNESS FIX AND NOT A TIDY-UP. CommonMark: an ATX heading's
          # `#` run must be followed by SPACES OR TABS, or end of line.
          # `[[:space:]]` is six characters and Python's `\s`, which the twin
          # used, is twenty-nine -- three alphabets for one rule, none of them
          # the renderer's. Driven by an auditor over every character
          # `str.isspace()` finds: `##<VT>0.2.1 - 2026-08-28` standing over
          # `## 9.9.9 - 2000-01-01` took THIS STEP to rc=0 with the tag's own
          # version and date echoed, while the renderer's newest <h2> is
          # `9.9.9 - 2000-01-01`. Three characters do it here (VT, FF, CR) and
          # twenty-six misread in the twin. The correct class was already in
          # this file, one line down, in `atx_any`.
          #
          # With the tight class, such a line is not a heading line at all: it
          # falls to the whitelist, which does not admit a leading `#`, and is
          # refused BY NAME. That is the design working once its alphabet is
          # the renderer's -- refusal protects you where you refuse, and where
          # you IMPLEMENT you own the details.
          #
          # SWEPT AND NOT ARGUED: `SEPARATOR_FORMS` in
          # `tools/changelog_renderer_corpus.py` builds one document per
          # (whitespace character, position) pair for all five positions this
          # grammar has, the renderer's verdict on each is recorded in
          # `tests/_changelog_renderer_corpus.py`, and
          # `tests/test_release_gates.py::test_the_whitespace_alphabet_is_swept_in_every_position`
          # drives this body over every one of them in every lane.
          heading_any='^##([[:blank:]]|$)'
          heading_re='^[[:blank:]]*##[[:blank:]]+([0-9][0-9A-Za-z._+!-]*)[[:blank:]]+—[[:blank:]]+([^[:blank:]].*[^[:blank:]]|[^[:blank:]])[[:blank:]]*$'
          atx_any='^#{1,6}([[:blank:]]|$)'
          ordered_li='^[0-9]{1,9}[.)]([[:blank:]]|$)'
          bt='`'
          # THE TILDE IS HERE FOR THE BACKTICK'S REASON and the twin's
          # `_PARAGRAPH_LINE` carries it too: a run of one or two of either
          # begins no block, and a rule spelled once must apply to both of its
          # subjects or nobody can check it.
          paragraph="^[A-Za-z0-9${bt}~]"
          heading=""
          heading_version=""
          heading_rest=""
          undecided=""
          undecided_at=0
          if [ ! -f CHANGELOG.md ] || [ ! -r CHANGELOG.md ]; then
            problems+=("there is no readable regular file called CHANGELOG.md at the root of the tagged tree, so the release note this tag claims to carry cannot be read at all.")
          else
            fence_char=""
            fence_run=0
            in_comment=0
            lineno=0
            while IFS= read -r line || [ -n "${line}" ]; do
              lineno=$(( lineno + 1 ))
              # `read -r` keeps a CRLF file's carriage return on the line and
              # nothing below tolerates one in the middle of a pattern, so it
              # comes off here. The Python twin splits on '\n' and does the
              # same, rather than on `str.splitlines()`, which breaks on eight
              # boundaries neither CommonMark nor `read` knows.
              line="${line%$'\r'}"
              if [ "${in_comment}" -eq 1 ]; then
                case "${line}" in *'-->'*) in_comment=0 ;; esac
                continue
              fi
              # THE LINE, SPLIT INTO ITS LEADING BLANKS AND THE REST. Every
              # rule below is stated in terms of an indent of at most three
              # SPACES, so the indent is measured once, here.
              lead=""
              rest="${line}"
              if [[ "${line}" =~ ^([[:blank:]]*)(.*)$ ]]; then
                lead="${BASH_REMATCH[1]}"
                rest="${BASH_REMATCH[2]}"
              fi
              lead_tab=0
              case "${lead}" in *$'\t'*) lead_tab=1 ;; esac
              # THE FENCE DELIMITER: which character, and how long a run.
              # Counted with parameter expansion because the pattern is a
              # quoted variable, which cannot glob and cannot be
              # command-substituted.
              fchar=""
              case "${rest}" in
                '`'*) fchar='`' ;;
                '~'*) fchar='~' ;;
              esac
              frun=0
              finfo="${rest}"
              if [ -n "${fchar}" ]; then
                while [ "${finfo#"${fchar}"}" != "${finfo}" ]; do
                  finfo="${finfo#"${fchar}"}"
                  frun=$(( frun + 1 ))
                done
              fi
              # INSIDE A FENCE, nothing is a heading and only a matching
              # closer gets out: same character, a run at least as long, no
              # info string, at most three spaces of indent. A tab in the
              # indent is four columns to CommonMark and so is not a closer.
              if [ -n "${fence_char}" ]; then
                if [ "${lead_tab}" -eq 0 ] && [ "${#lead}" -le 3 ] \
                   && [ "${fchar}" = "${fence_char}" ] \
                   && [ "${frun}" -ge "${fence_run}" ] \
                   && [ -z "${finfo//[[:blank:]]/}" ]; then
                  fence_char=""
                  fence_run=0
                fi
                continue
              fi
              # A BLANK LINE closes a paragraph and opens nothing.
              [ -z "${rest}" ] && continue
              # A TAB IN THE INDENT expands to the next four-column stop and
              # this grammar does not do column arithmetic, so it is refused
              # rather than guessed at.
              if [ "${lead_tab}" -eq 1 ]; then
                undecided="${line}"; undecided_at="${lineno}"; break
              fi
              # FOUR OR MORE SPACES is an indented code block, or the lazy
              # continuation of a paragraph. Neither can be a heading, whose
              # indent is bounded at three.
              [ "${#lead}" -ge 4 ] && continue
              # A FENCE OPENER. A BACKTICK fence's info string may not itself
              # hold a backtick; `` ``` a`b `` is a paragraph, and falls
              # through to the whitelist, where a leading backtick is a code
              # span.
              if [ "${frun}" -ge 3 ]; then
                if [ "${fchar}" = '~' ] || [ "${finfo#*"${bt}"}" = "${finfo}" ]; then
                  fence_char="${fchar}"
                  fence_run="${frun}"
                  continue
                fi
              fi
              # AN HTML COMMENT, by CommonMark's HTML-block rule and not by
              # substring: the line must BEGIN with `<!--`. A comment that
              # opens and closes on one line is one line of HTML and nothing
              # more.
              case "${rest}" in
                '<!--'*)
                  case "${line}" in *'-->'*) : ;; *) in_comment=1 ;; esac
                  continue ;;
              esac
              if [[ "${rest}" =~ $heading_any ]]; then
                heading="${line}"
                break
              fi
              # THE WHITELIST. Another ATX level, or a paragraph line -- and
              # an ordered-list marker is NOT one, because a list item's
              # content is indented four columns, where a `## ` heading is
              # still a heading to a renderer and is invisible to a reader
              # bounded at three.
              [[ "${rest}" =~ $atx_any ]] && continue
              if [[ "${rest}" =~ $paragraph ]] && ! [[ "${rest}" =~ $ordered_li ]]; then
                continue
              fi
              undecided="${line}"; undecided_at="${lineno}"; break
            done < CHANGELOG.md
            # THE FLAG IS THE LINE NUMBER AND NOT THE LINE. `[ -n
            # "${undecided}" ]` reads a refused line as "nothing was refused"
            # if that line is empty, and while nothing above can set it empty
            # -- a blank line `continue`s before either refusal branch -- a
            # guard whose correctness depends on a fact three branches away is
            # a guard one edit from being wrong. `undecided_at` is 0 or a real
            # line number.
            if [ "${undecided_at}" -ne 0 ]; then
              problems+=("line ${undecided_at} of CHANGELOG.md stands ABOVE the newest heading and is a shape this step cannot decide: [${undecided}]. This is a line grammar, not a CommonMark parser, and the shapes it will step over are a whitelist -- blank, indented four spaces, another ATX level, or a paragraph line beginning with a letter, a digit or a code span. A setext underline (--- or ===), a block quote, a list marker, an HTML block that is not a comment and a leading tab all stop it here, because each of them can put a heading somewhere this reader cannot see, and stepping past one is how a gate returns rc=0 over a document whose real newest heading names another release. Rewrite the prefix above the newest heading, or move the heading above it.")
            elif [ -z "${heading}" ]; then
              problems+=("CHANGELOG.md holds no '## ' heading at all, so there is no newest release heading for this tag to agree with. A fenced block or an HTML comment left open swallows everything below it and reads the same way, which is what a renderer does with it too.")
            elif [[ "${heading}" =~ $heading_re ]]; then
              heading_version="${BASH_REMATCH[1]}"
              heading_rest="${BASH_REMATCH[2]}"
            else
              problems+=("the newest heading in CHANGELOG.md is [${heading}] and it does not parse as '## <version> - <date or unreleased>' with an em dash. This step refuses it rather than reading past it to an older heading it can parse.")
            fi
          fi

          # THE COMPARISONS, each made only where BOTH sides were read: an
          # unreadable side has already put its own complaint in the list,
          # and comparing against an empty string would add a second and more
          # confident-sounding one about the same absence.
          if [ -n "${tag_version}" ] && [ -n "${heading_version}" ] \
             && [ "${heading_version}" != "${tag_version}" ]; then
            problems+=("the newest CHANGELOG.md heading names version ${heading_version} and the tag ${tag} names version ${tag_version}. A release note whose heading names a different release is the wrong release note, beside an artefact that cannot be unpublished.")
          fi
          if [ -n "${heading_rest}" ]; then
            if [ "${heading_rest,,}" = "unreleased" ]; then
              problems+=("the newest CHANGELOG.md heading says '${heading_rest}'. A final tag over an unreleased heading is a release note describing a release that has not happened. Put the tag's own date on it: ${tag_date:-(this tag has no readable date -- see above)}.")
            elif [ -n "${tag_date}" ] && [ "${heading_rest}" != "${tag_date}" ]; then
              problems+=("the newest CHANGELOG.md heading is dated '${heading_rest}' and the tag object ${tag} was made on ${tag_date}. The date on a release heading is a claim about when the release happened, and this one is not that date.")
            fi
          fi

          if [ "${#problems[@]}" -ne 0 ]; then
            printf 'the tag and CHANGELOG.md do not agree:\n'
            printf '  %s\n' "${problems[@]}"
            echo "::error title=the tag and the changelog heading disagree::${#problems[@]} thing(s) stand between this tag and its release note, printed above -- and they are ALL of them, because this step reports every complaint rather than the first. A release on PyPI cannot be unpublished, only yanked, and the changelog that ships beside it is the document a reader uses to find out what they got. Fix CHANGELOG.md, or the tag, and do not re-run this job until they agree."
            exit 1
          fi
          echo "tag=${tag} version=${tag_version} tagged=${tag_date}; CHANGELOG.md newest heading: ${heading_version} — ${heading_rest}"
      - uses: astral-sh/setup-uv@v6
