# `stelling-0.2.0-py3-none-any.whl` and `stelling-0.2.0.tar.gz`, `TAG=v0.2.0`,
# on the bodies this file shipped one commit ago:
#
#   the tag step        rc=0   `tag=v0.2.0 wheel version=0.2.0 sdist
#                               version=0.2.0`
#   the sdist step      rc=0   `every one of 372 sdist members is committed to
#                               this tree`
#   the manifest step   rc=0   375 lines of manifest written
#
# Three green gates and a `0.0.9` SOURCE DISTRIBUTION on PyPI under a release
# called v0.2.0, permanently. It is the same defect the ninth and tenth
# refusals were written for, one file extension over, left standing on a hatch
# in third-party code behind a MUTABLE BRANCH REF — the ref the `publish` job's
# own comment argues is a deliberate choice precisely because it moves.
#
# SO THE TAG STEP INVENTORIES `dist/` NOW: once it has established the one
# wheel and the one sdist, every remaining entry is a refusal, named. That is
# not a new rule. It is the rule already written beside that step — *"the unit
# of THAT answer is the DIRECTORY, because the directory is what gets
# uploaded"* — applied to the directory instead of to two globs over it.
#
# AND IT IS NOT AN INVENTORY UNLESS IT SEES DOTFILES. `uv build` writes
# `dist/.gitignore` ITSELF — one byte, `*`, verified on this tree — so EVERY
# real release directory already holds a third entry, and every shell glob in
# this file skipped it silently. That is the proof that "exactly one wheel and
# exactly one sdist" was never a statement about `dist/`. `shopt -s dotglob` is
# set in all three `dist/`-reading steps.
#
# AND THE EXCEPTION IS TAKEN ON THE CONTENT NOW, NOT ON THE NAME — which is
# this paragraph's own measurement finally being USED. `dist/.gitignore` was
# allowed BY NAME, as a literal, and a name is not a file. MEASURED on the body
# one commit ago, `TAG=v0.2.0` against a real `dist/`, only the entry called
# `dist/.gitignore` changed: arbitrary text rc=0; 0 bytes rc=0; a SYMLINK to
# `/etc/passwd` rc=0; a DIRECTORY holding a `.zip` rc=0; and a coherent 4.4 MB
# `stelling-0.0.9.zip` RENAMED to `dist/.gitignore` rc=0 — the same archive
# built from this tree's own `stelling-0.2.0.tar.gz` that passes `twine check`
# at rc=0 (4415389 bytes, twine 7.0.0, measured on this box). Nothing named in
# any of them. None is weaponisable to PyPI today, and that is precisely the
# argument this file refuses to make sixty lines above: the check whose stated
# unit is the DIRECTORY was exempting an entry of arbitrary type, size and
# content on its SPELLING, and the safety of that rested on the same twine
# table and the same mutable action default those sixty lines decline to rest
# on. The exception is now a REGULAR FILE — not a symlink, not a directory — of
# exactly one byte, and that byte `*`. It stays ALLOW and not REQUIRE: no
# `dist/.gitignore` at all is still rc=0. It adds no `exit 1` site and does not
# move the count above, and `tests/test_release_gates.py` drives every row.
#
# THE ALTERNATIVE — IGNORE DOTFILES AS A CLASS — IS STILL REJECTED, AND NOT BY
# LEANING ON WHAT `actions/upload-artifact@v4` DOES WITH HIDDEN FILES. THIS
# FILE MAKES TWO CLAIMS ABOUT THAT ACTION AND RELIES ON NEITHER. What stood
# here said it EXCLUDES hidden files by default, and rejected the class with
# it; the annotations below say it TAKES THE WHOLE DIRECTORY and the publish
# step uploads every file in it, and justify `dotglob` with that. The two point
# opposite ways — under the first a hidden `.zip` never reaches PyPI and the
# dotfile question is moot, under the second it ships — and both are
# third-party behaviour behind a mutable ref, which is the shape of mitigation
# the twine sentence above was retracted for. So it is said plainly: WE DO NOT
# RELY ON EITHER DEFAULT. The conduct is identical under both — `dist/` is
# inventoried whole and every entry that is not one of the two established
# artefacts is refused by name — so no verdict in this file is a function of
# what any action does with a leading dot. The annotations state the
# whole-directory reading because it is the WORSE case, and asserting the worse
# case in a message to a human is safe where resting a refusal on the better
# case is not. Ignoring the class would have waved a `dist/.stelling-0.0.9.zip`
# through the one check that exists to inventory the directory, whichever
# reading is true. One exception costs a refusal on the day `uv` writes a
# second dotfile into `dist/`, or writes a different byte into this one;
# re-deciding that deliberately is the right price in the one file whose
# mistakes cannot be undone.
#
# THE FOURTEENTH IS `tar` FAILING IN THE SDIST STEP, AND THE SENTENCE IT
# REPLACED WAS THIS FILE'S OWN ARGUMENT TURNED AROUND. What stood beside that
# step said a CORRUPT tarball "dies in the pipeline above at tar's own rc 2,
# with no annotation. Still red, so still safe" — excused because that step IS
# a refusal point, so failing closed is the answer it exists to give. The
# thesis here is not FAIL CLOSED, it is A REFUSAL MUST SAY IT REFUSED: rc=2 is
# TAR's exit code, this step's own refusals are rc=1, and this same step has
# been repaired out of exactly that state TWICE already — the no-wheel case
# ("`ls`'s own rc=2 with no annotation — red, but not by this gate") and the
# two-tarball case. And nothing earlier reads the tarball's BYTES, so "an
# earlier step would have caught it" was never available either: MEASURED, the
# tag step returns rc=0 on every corrupt shape measured — six of them, beside
# that step — because it reads FILENAMES and never opens either file. A corrupt tarball reached a step that dies
# without speaking THROUGH A GREEN GATE. See beside that step for the table and
# for what `pipefail` does and does not catch.
#
# THE FIFTEENTH IS THE CHANGELOG HEADING, AND WHAT IT REPLACED WAS A
# RECOMMENDATION IN SOMEBODY ELSE'S FILE. `tests/test_changelog_names_the_version.py`
# ties `CHANGELOG.md`'s newest heading to `stelling.__version__` and then
# declines, correctly, to check the DATE: the tag does not exist while that
# suite runs, so the only date available there is the reader's own clock. Its
# next paragraph ROUTED the check here, by name and with a command — *"in the
# release job, after the tag is resolved, assert that the newest
# `## <version> — <date>` heading in `CHANGELOG.md` carries the tag's own
# committer date … and that its version equals the tag minus the leading
# `v`"* — AND THIS FILE DID NOT HAVE IT. Nothing in the tree read that
# sentence either, which is the half that matters more than the missing gate:
# a present-tense claim about another file, with no instrument on it, is the
# specific defect 0.2.0 shipped. Measured on this repository's history: the
# routing paragraph arrived at `0e79ede` (committed 2026-08-25T00:32:48+02:00)
# and `git rev-list --count 0e79ede..9b5b496` is 47, so it stood over 47
# commits describing a check that was never written.
#
# WHAT IT REFUSES: a heading whose version is not the tag's, a heading that
# says *unreleased* under a final tag, a heading whose date is not the tag's,
# and each of the ways it cannot READ one of those — no `CHANGELOG.md`, no
# `## ` heading, a newest heading that does not parse, no tag ref, a
# LIGHTWEIGHT tag (which has no tagger date at all), a `GITHUB_REF_NAME`
# that is empty and one that is UNSET. ONE `exit 1` SITE, not eight: every
# complaint is
# collected and reported together, so this is one refusal point and the
# arithmetic above moves by one.
#
# WHICH DATE IS A DECISION AND THE EVIDENCE CANNOT DISCRIMINATE — the routed
# command names the tag's COMMITTER date and this step reads the TAG OBJECT's
# tagger date instead. Measured 2026-08-28 at `9b5b496`: `v0.1.0` reads
# `2026-08-12` both ways and `v0.2.0` reads `2026-08-25` both ways, so the
# two releases this project has cut do not decide between the readings, and
# the choice is made on the argument. The argument, the rejected hybrid, the
# lightweight-tag cost and what the step cannot see are beside the step.
#
# AND ITS LIGHTWEIGHT-TAG REMEDY WAS PROBABLY BACKWARDS FOR ONE RELEASE. The
# refusal message told a maintainer to *"Cut the release with 'git tag -a' —
# a GitHub release created from the web UI writes an annotated tag"*; the
# clause after the dash was written from memory, and two dated third-party
# reports say the release form creates a LIGHTWEIGHT tag, which is the shape
# this refusal exists to stop. A refusal message that rests a maintainer's
# next action on third-party behaviour nobody here can check is the same
# defect as a REFUSAL that rests on it — the one this header declines twice,
# at the twine `.zip` table and at "WE DO NOT RELY ON EITHER DEFAULT". The
# claim is deleted, quoted, and replaced by a recipe about `git` that the
# suite PLAYS OUT; the evidence, what could not be determined, and why the
# hard refusal is kept anyway are beside the step.
#
# IT IS DRIVEN IN BOTH DIRECTIONS AND INSIDE THE SUITE, like the ninth
# through the fourteenth and unlike the seven driven by hand at a61c01f — the
# "SEVEN OF THE FIFTEEN" above is a dated record of THAT session and does not
# move when a refusal lands.
# `tests/test_release_gates.py::test_the_changelog_gate_refuses_a_heading_the_tag_does_not_carry`
# extracts this body and runs it against planted checkouts carrying real
# annotated tags with chosen tagger dates: green on both shapes this project
# has released, on the same tags spelled without the leading `v`, and on a
# CRLF changelog; red on every row of the table in that test's own docstring,
# which is where the rows are written down — and that table is HELD to them by
# the test itself, so no count here has to move when a row is added.
# `::test_the_changelog_gate_reads_the_NEWEST_heading_by_POSITION` is the
# separate half — a changelog holding BOTH releases' headings, green under
# the tag its newest heading names and RED under the tag its second one
# does — because "the newest heading" is a position and a version scan over
# the file would pass both.
#
# ── BOTH CHECKOUTS TAKE THE WHOLE HISTORY NOW, AND THAT IS A BEHAVIOUR ──────
# ── CHANGE ─────────────────────────────────────────────────────────────────
#
# THE FIRST COMMIT IN THIS CHAIN TO MOVE THIS FILE'S CODE, said first because
# every one before it was comment-only and said so. With every comment line
# stripped by `tests/test_release_gates.py`'s own `_code_lines`, this file was
# 186 lines and byte-identical at `0ba04ba`, `f470d96`, `5de3ac2`, `bcdec4a`
# and `6fa2e7f` — one sha256,
# ee62b9ec8353c8746351ae0bf15957f14b353ccddfa95502ebed2279cf890709, five
# ways, and `eb26d48` before them is the last commit that moved it. It is
# 188 lines now, sha256
# 40a96feaf4394974a0ebdc2b9fc8357d27ab59b38e2701196dea215b02f5a055, and the
# two added lines are the whole of the difference: `fetch-depth: 0` in each of
# this file's two `actions/checkout@v4` steps. Parsed with PyYAML and compared
# leaf by leaf against `6fa2e7f`, this workflow gains exactly two leaves —
# `jobs.test.steps[0].with.fetch-depth` and
# `jobs.build.steps[0].with.fetch-depth` — with nothing else added, removed or
# changed, and the three step bodies `tests/test_release_gates.py` extracts
# and EXECUTES are byte-identical across the change: the sdist step 162 lines
# a247ed53…, the tag step 87 lines 418583d9…, the manifest step 25 lines
# a55591b1…, the same digests as at `6fa2e7f`.
#
# THERE ARE TWO CHECKOUTS IN THIS FILE, NOT FOUR, AND THE MISCOUNT IS PART OF
# WHY THIS STOOD. The comparison that opened it read "`ci.yml` has ten
# `actions/checkout` steps and all ten carry `fetch-depth: 0`; `release.yml`
# has four and none of them do", and FOUR is what `grep -c "uses: actions/"`
# says here. In `ci.yml` all ten `uses: actions/` lines ARE checkouts, so that
# grep is accidentally right in the file it was calibrated on; in this file
# two of the four are `upload-artifact` and `download-artifact`, which take no
# `fetch-depth` input at all. RE-DERIVED by reading both files rather than
# grepping them: `ci.yml` carries `- uses: actions/checkout@v4` at lines 134,
# 191, 277, 376, 523, 597, 907, 1301, 1340 and 1606 — ten steps, ten
# `fetch-depth: 0`, eight of them under one identical comment, one under a
# reason of its own (the property suite materialises old revisions with `git
# archive`) and one bare. This file carries two, in `test` and in `build`; the
# `publish` job checks nothing out at all. So the repair is two lines and not
# four — and a claim of four would have gone on being "true" with one of the
# two real checkouts left shallow.
#
# WHY, IN `ci.yml`'s OWN WORDS, WHICH WERE ALREADY IN THIS REPOSITORY:
#
#   "FULL HISTORY, because the routing verification reads `CHANGELOG.md` AT
#    THE COMMIT THE MANIFEST NAMES and a depth-1 clone cannot reach it. With
#    the default depth those checks SKIP, so the one guarantee batch B8c
#    exists to provide -- that every routed block arrived, checked against the
#    source it left -- was not exercised by any job. Measured on a `--depth 1`
#    clone of this repository: `19 passed, 8 skipped`, and the eight are the
#    whole git-gated set."
#
# The job below runs those same tests. The reasoning was written down and not
# carried across to the workflow whose mistakes cannot be unpublished, and
# that is the whole of the finding.
#
# WHAT IT BUYS, DRIVEN IN THE JOB'S OWN TREE SHAPE AND ITS OWN LANE. The
# sandbox is built the way `actions/checkout@v4` builds one — `git init`; `git
# remote add`; ONE `git fetch` with the refspec and the depth the config under
# test implies; `git checkout --force` of the tag — over a mirror of this
# repository with `v0.2.0` cut on a tree carrying this file AND the disclosed
# skips a sibling is landing for the same defect. The tree is identical in all
# three rows, so the only variable is the checkout. The lane is the one this
# job installs (`.[solvers,jax]`), `STELLING_SKIP_INVENTORY_VERDICT` set,
# which is the second refusal point in the same step. `deadbee` was planted in
# `docs/proposed-tier-clause.md`'s **Status:** paragraph and the page restored
# byte-identically (sha256) after every run.
#
#   config                    the sandbox        `deadbee` planted
#   ────────────────────────  ─────────────────  ─────────────────────────────
#   depth 1 (as it stood)     shallow, 1         1 SKIPPED — with a warning
#                             commit, `v0.1.0`   naming it, and nothing red
#                             unresolvable
#   `fetch-depth: 0` (this)   not shallow,       1 FAILED, named: "what is
#                             1079 commits       wrong is the PAGE naming a
#                                                commit that is not here"
#   `fetch-tags`, depth 1     shallow, 1         1 SKIPPED — unchanged, and
#                             commit, `v0.1.0`   the suite red elsewhere
#                             RESOLVES
#
#   config                    the whole suite, that sandbox, that lane
#   ────────────────────────  ──────────────────────────────────────────────
#   depth 1 (as it stood)     4669 passed, 20 skipped, exit 0, verdict=made
#   `fetch-depth: 0` (this)   4679 passed, 10 skipped, exit 0, verdict=made
#   `fetch-tags`, depth 1     1 failed, 4669 passed, 19 skipped, exit 1,
#                             verdict=made
#
# THE TEN REMAINING SKIPS IN THE MIDDLE ROW ARE ALL ABSENT LIBRARIES —
# `hypothesis` seven times, `blackjax` twice, `pytest-xdist` once — and not one
# of them is a check a checkout setting could restore. The first row's twenty
# are those same ten PLUS the ten this line buys back.
#
# THE MIDDLE ROW IS THE POINT AND THE FIRST ROW IS WHAT IT REPLACES. A green
# tagged-tree job that SKIPPED its own history checks is exactly as green as
# one that ran them, and the skips are what a sibling's repair bought: they
# stop the job refusing the publish over an environment, and they do not make
# it verify anything. TEN TEST NODES MOVE FROM SKIPPED TO PASSED across the
# three files that read history — `tests/test_soundness_routing.py` 8 (its
# four git-gated tests over two sections),
# `tests/test_proposed_page_headers.py` 1 (the status-paragraph ancestry
# check) and `tests/test_soundness_log_reach.py` 1 (the tag-tree citation
# rule): `51 passed, 10 skipped` over those three files at depth 1 against
# `61 passed` with this line.
#
# AND ON THIS BRANCH'S TREE ALONE, WITHOUT THAT SIBLING — said here because
# this line does not depend on that branch landing, and because it is the
# sharper result. Same sandbox, the tag cut on this branch's own tree: at
# depth 1 those three files are `1 failed, 71 passed, 8 skipped`, and the red
# is the ancestry check dying on `89413c2` — a REAL and CORRECT sha that this
# environment cannot reach. With this line they are `80 passed`, 0 skipped,
# and the whole suite in that sandbox is `4675 passed, 10 skipped`, exit 0,
# `verdict=made`.
# The `deadbee` plant is `1 failed` in BOTH, and the two reds are not the same
# red: at depth 1 it names `89413c2` and says nothing at all about the plant;
# at full depth it names `deadbee`. So this line closes refusal point 1 for
# this branch on its own, and closes it by making the check DECIDE rather than
# by disclosing that it cannot.
#
# NOT `fetch-tags: true`, AND THIS IS A MEASUREMENT AND NOT A WARNING TAKEN ON
# TRUST. Fetching the tag refs at depth 1 makes `refs/tags/v0.1.0` RESOLVE
# while the history stays one commit deep, which is the worst of both: the
# guard in `tests/test_soundness_log_reach.py` that skips when the tag is out
# of reach stops firing, and the rule under it hard-fails at line 1644 —
# "7 claim(s) that the released `v0.1.0` does not carry a defect cite nothing
# this check can decide", because every cited commit is unreachable and every
# commit-cited paragraph therefore reads as uncovered. Driven in the sandbox
# above: `1 failed, 51 passed, 9 skipped` over the three files, against
# `61 passed` with `fetch-depth: 0`. It does not restore the `deadbee` check
# either — that row is still `1 SKIPPED`. It converts a lost check into a red
# release job, in a new place, on a tree nobody can fix after the tag is cut.
# THE FIX IS DEPTH, NOT TAGS.
#
# WHAT IT COSTS, AND THIS REPOSITORY'S HISTORY IS NOT SMALL. `fetch-depth: 0`
# fetches EVERY BRANCH AND EVERY TAG, not just the tagged commit's ancestry.
# Measured on this box over `file://`, three cold runs each, same origin and
# same tag: depth 1 is 565 objects, 4.61 MiB packed, 0.56/0.57/0.56 s; the
# same fetch with no depth limit is 7510 objects, 7.51 MiB, 2.05/2.11/2.09 s.
# Against this repository AS IT ACTUALLY STANDS — 269 branch heads, 2 tags and
# 1393 commits reachable from them, of which 1070 are on this branch — the
# unrestricted fetch is 9980 objects and 10.12 MiB in 2.25/2.22/2.24 s,
# because all 269 heads come too. So it is roughly twice
# the bytes, eighteen times the objects and four times the wall clock, and all
# three grow with the branch list rather than with the release. On a hosted
# runner the wall time is network-bound and these seconds are not the ones you
# will see; the object and byte counts are the figures that transfer. TWO JOBS
# PAY IT AND ONLY ONE NEEDS IT — see beside the `build` job's checkout, where
# that is said rather than implied. It is bought deliberately: a few seconds
# per release against the only checks this repository has on which commits the
# shipped `docs/proposed-*.md` headers name, in the one workflow whose
# mistakes cannot be unpublished.
#
# AND IT IS PINNED NOW, because a line whose absence is silent is a line that
# comes back off.
# `tests/test_release_gates.py::test_every_checkout_in_this_file_takes_the_WHOLE_history`
# derives the checkout steps FROM THIS FILE — matching `actions/checkout@` and
# not `actions/`, for the reason the count paragraph above gives — and fails
# if any of them lacks `fetch-depth: 0`. Driven RED five ways, each alone:
# either line deleted; both deleted, which is this file at `6fa2e7f`;
# `fetch-depth: 0` rewritten to `fetch-depth: 1`; and a NEW `actions/checkout`
# step added to `publish` without the key. It types no count, so a checkout
# added later is covered without a re-derivation — which the header count and
# the four kinds of ordinal above still are not.

name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: the suite, on the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # FULL HISTORY, AND IT IS THE DIFFERENCE BETWEEN A CHECK AND A SKIP.
          # This job is refusal point 1, and some of what it runs reads git
          # HISTORY rather than the git INDEX. At the default depth of 1 those
          # checks do not fail — they SKIP, or they refuse over the
          # environment — and neither outcome decides anything about the tree
          # being published. Driven in a sandbox built the way this job builds
          # its tree (`git init`; one `git fetch` of the tag ref; `git
          # checkout` of the tag): at depth 1 `tests/test_soundness_routing.py`
          # is `8 skipped`, and the status-paragraph ancestry check in
          # `tests/test_proposed_page_headers.py` cannot resolve a single sha
          # it is given — including `deadbee`, planted there as a control.
          # With this line the same sandbox decides all of them, and the
          # planted sha is the one it names. The table, the `fetch-tags`
          # measurement and the cost are in this file's header.
          #
          # `ci.yml` HAD ALREADY MADE THIS DECISION, at every one of its ten
          # checkout steps, under a comment giving exactly this reason: "FULL
          # HISTORY, because the routing verification reads `CHANGELOG.md` AT
          # THE COMMIT THE MANIFEST NAMES and a depth-1 clone cannot reach it.
          # With the default depth those checks SKIP, so the one guarantee
          # batch B8c exists to provide -- that every routed block arrived,
          # checked against the source it left -- was not exercised by any
          # job." This job runs those same tests.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Unnarrowed, and with the skip-inventory verdict asserted off a channel
      # the exit code cannot reach — same reasoning as the `ci` workflow. A
      # publish must not ride on a session that silently dropped its checks.
      #
      # REFUSAL POINT (implicit — pytest's own exit code). GREEN, driven at
      # a61c01f in this job's own venv: `2519 passed, 16 skipped` (junitxml:
      # 2535 tests, 0 failures, 0 errors), 157.9 s. RED, with one failure
      # injected by a plugin: the step exits 1 HERE and the two verdict checks
      # below are never reached — which is the order they want.
      #
      # THE PRECISION IS WHATEVER EACH MODULE CHOOSES. Neither workflow sets
      # `JAX_ENABLE_X64`, and 52 of 97 test modules name `jax_enable_x64`
      # themselves, so this green is a mixture by construction. That is a fact
      # about the figure, not a defect: the modules that care pin it.
      - name: pytest, with the skip-inventory verdict asserted separately
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/verdict.txt
        run: |
          set -euo pipefail
          # ABSENCE is the signal this step buys, and it is only a signal if
          # nothing else could have left a file here. RE-DRIVEN IN BOTH
          # DIRECTIONS at a61c01f, same inputs to each: a `verdict=made` file
          # planted at the path, and a pytest that writes none (a plugin drops
          # the environment variable, the route tests/conftest.py names in its
          # own docstring). WITH this line the step exits 1 on "no verdict was
          # written"; with this line DELETED the step exits 0 and `cat`s the
          # planted file into the publish log. The line earns its place, and
          # that is the measurement rather than the argument for it.
          rm -f "${RUNNER_TEMP}/verdict.txt"
          # `-ra`, not `-rs`. Re-driven at a61c01f on the SAME red session, one
          # injected failure: `-ra` prints `FAILED
          # tests/test_verdict.py::test_every_contract_field_is_required`,
          # `-rs` prints zero `FAILED` lines, and both exit 1. So the exit code
          # is the same and the publish log of a red suite names what failed
          # only under `-ra`.
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/verdict.txt"
          # REFUSAL POINT. Driven red at a61c01f: with the recorder's
          # environment variable removed the session exits 0 (`12 passed`)
          # and leaves no file, and this exits 1.
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the recorder was ignored, filtered out or never loaded — and pytest's own exit code cannot report that."
            exit 1
          fi
          cat "${verdict}"
          # REFUSAL POINT, and the one that catches a NARROWED session, which
          # nothing else here can see. Driven red at a61c01f with
          # `pytest tests/test_verdict.py` appended: pytest exits 0 on
          # `12 passed`, the recorder writes `verdict=withdrawn`, and this
          # exits 1. (A narrowing that collects nothing does not reach here at
          # all — pytest exits 5 and `set -e` stops above. Red either way.)
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the completeness claim was not made::Refusing to publish on a session that could not claim the suite."
            exit 1
          fi
      # REFUSAL POINT (implicit — this command's own exit code), and it is a
      # real one rather than an informational print.
      # Driven at a61c01f: 0 with z3 5.0.0.0 and cvc5 1.3.4 both reporting
      # `[selfcheck: ok]`, and 1 with `STELLING_CVC5` pointed at a stub that
      # answers `sat` to `(distinct x x)` — `[selfcheck FAILED: expected
      # `unsat` for `x != x`, got 'sat']`. Missing optional dependencies stay
      # informational; a BROKEN installed one is what turns this red.
      - run: .venv/bin/python -m stelling

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # FULL HISTORY HERE TOO, AND NOT BECAUSE THIS JOB NEEDS IT TODAY.
          # That is said plainly rather than implied, because a line justified
          # by a reason that is not its own is a line the next reader deletes.
          # THAT SENTENCE READ *"Every git call in this job is `git ls-files`
          # — the INDEX, which a depth-1 checkout has in full"* AND THIS
          # COMMIT MAKES IT FALSE: the step immediately below calls
          # `git for-each-ref refs/tags/<tag>`, which reads a REF and the tag
          # OBJECT under it, neither of which is the index. THE CONCLUSION
          # SURVIVES, RE-MEASURED RATHER THAN RE-ASSERTED. Sandbox built the
          # way `actions/checkout@v4` builds one (`git init`; `git remote
          # add`; ONE `git fetch` with the depth under test) over a mirror of
          # this repository, 2026-08-28: with `--depth=1
          # +refs/tags/v0.2.0:refs/tags/v0.2.0` the clone is shallow
          # (`git rev-parse --is-shallow-repository` = true) and
          # `%(objecttype)` / `%(taggerdate:short)` still read `tag` /
          # `2026-08-25`. The tag OBJECT arrives WITH the tag REF; what a
          # depth-1 clone lacks is history, and the step below reads none.
          # The version hatchling stamps into both artefacts is still read
          # from `[tool.hatch.version]`'s path, never from a tag or a `git
          # describe`. So nothing in this job is measurably different with
          # this line or without it, TODAY — but it is true for one reason
          # fewer than it was, and the sentence that made it true of every
          # git call in the job is retracted above rather than deleted.
          #
          # What it buys is that history is a property of THIS FILE rather
          # than of one step in it. The asymmetry this line closes went
          # unnoticed for as long as it did because nobody comparing the two
          # workflows was comparing steps: `grep -c "uses: actions/"` reads 10
          # in `ci.yml` and 4 here, and in `ci.yml` all ten of those ARE
          # checkouts while here two of the four are `upload-artifact` and
          # `download-artifact`, which have no `fetch-depth` input at all. Two
          # checkouts that agree cannot be half-fixed by a grep that cannot
          # tell them apart. Same clone, same cost as the job above.
          fetch-depth: 0
      # ── THE FIFTEENTH: THE CHANGELOG HEADING MUST NAME THIS RELEASE, ────
      # ── AND THIS DATE ───────────────────────────────────────────────────
      #
      # ROUTED HERE BY NAME, AND NEVER BUILT HERE, which is the half that
      # matters more than the missing gate.
      # `tests/test_changelog_names_the_version.py` ties `CHANGELOG.md`'s
      # newest heading to `stelling.__version__` and then declines to check
      # the DATE, correctly: the tag does not exist while that suite runs, so
      # the only date a check there could compare against is
      # `datetime.date.today()` — the developer's clock, which is the
      # environment-dependence class that produced four of five recent CI
      # reds. Its next paragraph routed the check HERE, with the command:
      # *"in the release job, after the tag is resolved, assert that the
      # newest `## <version> — <date>` heading in `CHANGELOG.md` carries the
      # tag's own committer date — `git log -1 --format=%cd --date=short
      # "$GITHUB_REF_NAME"` — and that its version equals the tag minus the
      # leading `v`."* THIS FILE DID NOT HAVE IT. Measured on this
      # repository's own history: that paragraph arrived at `0e79ede`
      # (committed 2026-08-25T00:32:48+02:00) and this step lands 47 commits
      # later (`git rev-list --count 0e79ede..9b5b496` = 47), and for every
      # one of those commits it was a present-tense claim about a workflow
      # that did not carry the check, with nothing in the tree reading it.
      # Prose asserting a check that does not exist is the same defect as the
      # missing check. The paragraph is rewritten there — what it used to say
      # is kept, not deleted — and
      # `tests/test_changelog_names_the_version.py::test_the_routed_date_check_is_in_this_workflow`
      # holds it now, so it cannot go stale the way it just did.
      #
      # WHICH DATE — A DECISION, ARGUED, AND TAKEN WHERE THE EVIDENCE CANNOT
      # DISCRIMINATE. Two readings of "the tag's date" were available:
      #
      #   git log -1 --format=%cd --date=short "$TAG"
      #       the COMMITTER date of the commit the tag resolves to; what the
      #       routing paragraph named
      #   git for-each-ref --format='%(taggerdate:short)' refs/tags/"$TAG"
      #       the date the TAG OBJECT was made; empty for a lightweight tag
      #
      # MEASURED 2026-08-28 at `9b5b496`, on both real tags in this
      # repository: `v0.1.0` reads `2026-08-12` both ways and `v0.2.0` reads
      # `2026-08-25` both ways, and `%(objecttype)` is `tag` for each. So the
      # two releases this project has actually cut DO NOT DISCRIMINATE
      # between the two readings at all, and that is said out loud because a
      # choice made where the evidence cannot decide is a choice that has to
      # be labelled as one rather than presented as a finding.
      #
      # THE TAGGER DATE IS WHAT THIS STEP READS, on the argument. A heading's
      # date is a claim about when the RELEASE happened; the tag object is
      # the act of releasing, and a committer date is when the last change
      # was written. The two coincide only when the tag is cut on the day of
      # the last commit. On a release cut later — a freeze, a review, a
      # weekend — the committer reading refuses a heading that is CORRECT,
      # and the only way past it is to write a date into `CHANGELOG.md` that
      # is not the release date. A gate whose refusal is answered by making
      # the document false is worse than no gate, and that is the whole of
      # why the routed command is not the one below.
      #
      # AND IT IS NOT A READING OF ANY CLOCK IN THIS JOB, which is the
      # property the whole routing argument turns on: the check was moved out
      # of the suite precisely because the only date THERE is the reader's.
      # `%(taggerdate:short)` renders in the TAGGER'S OWN recorded zone and
      # not the reader's — driven on a tag whose tagger line carries `+1300`,
      # it is `2026-08-25` under this box's zone and `2026-08-25` under
      # `TZ=UTC`. Two runners in two zones read one tag the same way, and no
      # runner reads `today`.
      #
      # WHAT IT COSTS, NAMED, AND IT FAILS CLOSED. A LIGHTWEIGHT tag has no
      # tag object and therefore no tagger date at all, and
      # `%(taggerdate:short)` is EMPTY for one. That is a refusal here, by
      # name, with the remedy in the message. The hybrid — tagger date,
      # falling back to the committer date when empty — was considered and
      # rejected: it is a can't-tell resolving to the permissive answer,
      # which `tests/_lanes.py` spends a paragraph on (*"A can't-tell that
      # resolves to the permissive answer is not a reading"*), and it would
      # compare the heading against a different quantity than the one this
      # comment says it compares, silently, on exactly the releases where the
      # two readings differ.
      #
      # AND THE REMEDY THAT MESSAGE USED TO GIVE WAS AN UNVERIFIED CLAIM
      # ABOUT SOMEBODY ELSE'S UI, AND THE EVIDENCE POINTS THE OTHER WAY. It
      # read: *"Cut the release with 'git tag -a' — a GitHub release created
      # from the web UI writes an annotated tag — and re-run."* The clause
      # after the dash was written from memory, nothing in this repository
      # could check it, and TWO DATED THIRD-PARTY REPORTS SAY THE OPPOSITE:
      # `github/community` discussion 4924, opened 2021-08-05 and last active
      # 2025-10-15 with 113 👍 — *"At this moment creating a release (tag)
      # using releases page does only create a lightweight git tag, which
      # does not contain essential information like time when it was
      # created"* — and discussion 149183, opened 2025-01-14 and still
      # reported as current on 2026-07-15, six weeks before this commit.
      # Neither carries a GitHub staff confirmation. GitHub's own REST
      # reference for `POST /repos/{owner}/{repo}/releases` says only that
      # `target_commitish` "Specifies the commitish value that determines
      # where the Git tag is created from … Unused if the Git tag already
      # exists", and does not say which KIND of tag it creates. Read
      # 2026-08-28.
      #
      # SO THE SENTENCE WAS NOT MERELY UNVERIFIED, IT WAS PROBABLY BACKWARDS:
      # it pointed a maintainer whose release had just been refused straight
      # back at the flow that produced the refusal. It is deleted, and it is
      # quoted above rather than deleted quietly because the defect is the
      # SHAPE — a refusal message resting a maintainer's next action on
      # third-party behaviour nobody here can check — and this file already
      # refuses to rest a REFUSAL on such behaviour twice over (the twine
      # `.zip` table, and "WE DO NOT RELY ON EITHER DEFAULT" about
      # `upload-artifact`). A message is not exempt from the rule the
      # refusals follow: what a reader is told to DO is as load-bearing as
      # what the gate decides.
      #
      # WHAT IS MEASURED, ON THIS REPOSITORY, 2026-08-28 — and it is why the
      # refusal does not stand in this project's way. Both real tags are
      # ANNOTATED (`%(objecttype)` = `tag`, on the local refs and through
      # `GET /repos/NicholasEhsanRoy/stelling/git/matching-refs/tags`), both
      # taggers are the maintainer's own git identity rather than a GitHub
      # address, `v0.2.0`'s tag object carries 1856 characters of
      # hand-written release prose — the release form has no tag-message
      # field at all — and for BOTH releases the API's `created_at` equals
      # the tag object's tagger timestamp to the second while `published_at`
      # is later (`v0.1.0` 2026-08-11T23:47:18Z tagged / 23:50:11Z published;
      # `v0.2.0` 2026-08-25T17:53:59Z tagged / 19:39:28Z published). Both
      # tags were also made AFTER the commit they point at (6m36s and
      # 1h35m). That is one path and only one: an annotated tag cut with
      # `git tag -a` and pushed, and a release then created ON IT. This gate
      # has never refused a release this project has actually made, and that
      # is now a measurement rather than an assumption.
      #
      # WHAT COULD NOT BE DETERMINED, said plainly. The web form was NOT
      # driven. Driving it means creating a real release on a real
      # repository, and on this one that fires `release: published` and runs
      # THIS WORKFLOW from the default branch — a measurement whose side
      # effect is a release job is not a measurement worth taking, and no
      # repository exists here that could be created for it and then
      # removed. So the two discussions above are the whole of the evidence
      # about the form, they are third-party and dated, and NOTHING BELOW
      # RESTS ON THEM IN EITHER DIRECTION: the step refuses a tag with no
      # tagger date whatever made it, and the remedy it prints is about
      # `git`, which this suite can run, and not about a UI, which it cannot.
      #
      # KEEPING THE HARD REFUSAL IS THE DECISION, AND THE COST IS WHERE IT
      # LANDS RATHER THAN WHETHER IT IS PAID. If the form does create a
      # lightweight tag, then a maintainer who uses it meets this refusal
      # AFTER the release and the tag are already public — which is the worst
      # moment to meet a gate, and "a gate that refuses the ordinary release
      # path is how a gate gets silenced" is the right worry. Three things
      # decide it the other way. (1) The alternative is the hybrid rejected
      # four paragraphs above: with no tagger date the only date available is
      # the COMMIT's, which is the reading this step declines because it
      # refuses correct headings. Accepting it here would make the gate mean
      # one thing for annotated tags and another for lightweight ones,
      # silently, and the second meaning is the one this step exists to not
      # have. (2) NOTHING IS PUBLISHED. The refusal is in `build`, before
      # `upload-artifact` and before `publish`, so what a maintainer loses is
      # a job, not an artefact — the line this gate defends is PyPI, which is
      # immutable, not GitHub's release page, which is editable. (3) The
      # recovery is finite, and it is DRIVEN rather than asserted:
      # `tests/test_release_gates.py::test_the_lightweight_remedy_this_step_prints_is_the_one_that_works`
      # plays the printed recipe out, step by step, on the body this file
      # ships.
      #
      # THAT RECIPE IS TWO EDITS AND NOT ONE, WHICH IS THE PART A ONE-LINE
      # REMEDY GETS WRONG. Re-cutting the tag annotated gives it TODAY's
      # tagger date, so a heading written on the day of the first attempt is
      # then the wrong date and this step refuses AGAIN, on the date arm.
      # MEASURED on the body this commit ships, one planted tree carried
      # through the message's own instructions:
      #
      #   what the tree holds                          verdict
      #   ───────────────────────────────────────────  ──────────────────────
      #   lightweight `v0.2.1`, heading `— 2026-08-25`  rc=1 "not an
      #                                                 annotated tag"
      #   re-cut ANNOTATED at the same commit, tagger   rc=1 "is dated
      #   date 2026-08-28, heading unchanged            '2026-08-25' … was
      #                                                 made on 2026-08-28"
      #   heading moved to `— 2026-08-28`, tag re-cut   rc=0
      #
      # The middle row is the one the message has to predict or the
      # maintainer is sent round twice, and it says so. The last row is what
      # makes the recipe an instruction that WORKS rather than one that
      # sounds right.
      #
      # ONE `exit 1` SITE AND EVERY COMPLAINT REPORTED, which is why this is
      # ONE refusal point and not eight. Everything below appends to a list
      # and the step refuses once, printing all of it. A heading that is
      # wrong in the version AND in the date is two edits from correct, and a
      # gate that names only the first sends a human back to a job that takes
      # minutes to reach this step again;
      # `tests/test_release_gates.py::test_the_counts_DERIVED_from_the_header_move_with_it`
      # makes the same argument about its own two sentences, in this file.
      #
      # WHERE IT STANDS, AND WHY. In `build` and not in `publish`, because
      # `publish` is where the upload happens and a refusal after an upload
      # is not a refusal. In `build` and not in `test`, because `build` is
      # where this file already resolves the tag and refuses on it, and one
      # release's version claims are better decided in one place than in two.
      # FIRST AFTER THE CHECKOUT, before `setup-uv` and `uv build`, because
      # it needs nothing either of them produces — a checkout and `git` — so a
      # changelog that names the wrong release costs no build. The cost is
      # named rather than hidden: `build` needs `test`, so this runs AFTER
      # the suite and a wrong heading is not found until the suite has
      # passed.
      #
      # `GITHUB_REF_NAME` AND NOT `github.event.release.tag_name`, AND NO
      # `env:` BLOCK, because the runner already puts it in the environment:
      # nothing whatever is interpolated into this shell. The step below
      # takes `tag_name` through `env:` for the reason written there — it is
      # attacker-influenced in the general case — and this one takes the
      # shorter route to the same property. It is also the ref this job's own
      # checkout resolved, so the tag object read here is the one the tree in
      # the workspace came from.
      #
      # THE TAG OBJECT IS READABLE WITHOUT `fetch-depth: 0`, MEASURED, so
      # this step is NOT a new reason for the line above it and does not get
      # to claim one. Sandbox built the way `actions/checkout@v4` builds one
      # (`git init`; `git remote add`; ONE `git fetch` with the depth under
      # test) against a mirror of this repository, 2026-08-28: with
      # `--depth=1 +refs/tags/v0.2.0:refs/tags/v0.2.0` the clone is shallow
      # and `%(objecttype)`/`%(taggerdate:short)` still read `tag` /
      # `2026-08-25`. The tag OBJECT arrives with the tag REF; what a depth-1
      # clone lacks is history, which this step does not read.
      #
      # WHAT THIS STEP CANNOT SEE, said because an instrument that does not
      # declare its scope reports absence of evidence as evidence of absence:
      #
      #   * anything BELOW the heading. It reads one line — a version, and
      #     the word or date after the em dash — so a heading that agrees
      #     with the tag in BOTH its version and its date, standing over the
      #     PREVIOUS release's notes, is invisible to it.
      #   * whether the newest heading IN FILE ORDER is the newest RELEASE.
      #     Position is the definition on purpose, the same one `headings()`
      #     in `tests/test_changelog_names_the_version.py` uses: sorting
      #     would quietly accept a file whose newest entry was inserted in
      #     the wrong place. A changelog written oldest-first is read
      #     backwards here and refused, loudly.
      #   * the tag's signature, its tagger, or whether either is anyone in
      #     particular. `%(objecttype)` is `tag`, and that is the whole of
      #     what it asks about the object.
      #   * a heading grammar this repository does not use. The em dash is
      #     required, as it is in `_HEADING` in
      #     `tests/test_changelog_names_the_version.py`.
      #
      #     THIS BULLET SAID *"the two grammars are written twice in two
      #     languages and NOTHING holds them to each other"* AND THAT IS
      #     WITHDRAWN, in both halves. Something does hold them:
      #     `tests/test_release_gates.py::test_BOTH_readers_of_the_newest_heading_agree`
      #     drives this extracted body and its Python twin over one corpus,
      #     and `::test_the_two_readers_agree_over_the_whole_corpus` drives
      #     both over all 2954 documents of that corpus, and a third
      #     sweeps the WHITESPACE alphabet in all five positions this
      #     grammar has one. And what holds them
      #     is no longer only each other: the corpus's verdicts come from
      #     `markdown_it.MarkdownIt("commonmark")`, recorded in
      #     `tests/_changelog_renderer_corpus.py`, because two readers held
      #     only to one another can be found to DISAGREE and never to be
      #     WRONG — which is exactly what happened. What is still true is
      #     that the em-dash grammar itself is spelled twice, once here and
      #     once there, and a THIRD spelling of it would be a third thing to
      #     keep in step.
      #   * A SETEXT HEADING, A FENCE IT CANNOT MATCH, AND EVERY OTHER SHAPE
      #     ON THE REFUSAL SIDE OF THE WHITELIST. This bullet list used to
      #     name the em dash and stop, so this step declared a NARROWER
      #     blindness than its own Python twin did — the twin's docstring
      #     named setext and the fence asymmetry and this did not, while both
      #     readers had the same hole. They are no longer holes: they are
      #     refusals, listed at the scan below. What is still blind is the
      #     other direction — this step REFUSES a document a renderer reads
      #     without difficulty whenever the prefix above the newest heading
      #     holds a `>` block quote, a list, an HTML block that is not a
      #     comment, a `---`/`===` underline, a leading tab or seven hashes.
      #     That is the trade, taken deliberately, and it costs a maintainer
      #     one edit.
      #   * THE ATX CLOSING SEQUENCE. `## 0.2.0 — 2026-08-25 ##` renders as an
      #     `<h2>` whose content is `0.2.0 — 2026-08-25`; `heading_re` below
      #     keeps the trailing `##`, so the READING differs from the
      #     renderer's. The VERDICT does not — `2026-08-25 ##` is not the
      #     tag's date and is not the word `unreleased`, so this step refuses
      #     it, and
      #     `tests/test_changelog_names_the_version.py::test_both_halves_of_the_coupling_are_driven`
      #     drives that rather than leaving it as a sentence. It is outside
      #     the corpus for that reason.
      #   * WHERE `CHANGELOG.md` IS. The path is relative, so it is read
      #     from this step's working directory, which is the checkout root
      #     because nothing here sets `working-directory:`. That is the same
      #     assumption every `dist/`-reading step in this file makes and it
      #     is stated once, here, rather than assumed three times.
      #   * whether this step RAN. It is a step like any other, and the
      #     attributes that would switch it off — `if:`,
      #     `continue-on-error:` — are held for the whole file by
      #     `tests/test_release_gates.py::test_the_attributes_that_decide_whether_a_refusal_refuses`,
      #     which reads `continue-on-error` and not `if:`.
      #
      # IT USES TWO BASH-4 CONSTRUCTS AND THAT IS DECLARED RATHER THAN
      # DISCOVERED: `mapfile` and `${var,,}`. This job says `runs-on:
      # ubuntu-latest`, whose image ships bash 5, so the GATE's requirement
      # is settled by the line that chooses the runner. What is NOT settled
      # is the DRIVE below, which runs on whatever `bash` a contributor has:
      # on a bash 3.2 (Apple's system shell) the drive would go RED with a
      # shell diagnostic rather than the gate going quiet. That is the safe
      # direction — a false red, not a false green — and it is written down
      # so the next reader meets it here instead of in a confusing failure.
      # Measured on this box, which is where the drive was taken: GNU bash
      # 5.2.21(1)-release.
      #
      # THE HEADING SCAN BELOW ADDS NO THIRD ONE, and this is a reading of the
      # constructs rather than a run: `$'\r'`, `${var//pattern/}`,
      # `${var#pattern}`, `case` with a POSIX class, and `[[ =~ ]]` with
      # `BASH_REMATCH` are bash 3.2 or older, and the step already used the
      # last of those for `heading_re`. No bash 3.2 exists on this box to
      # drive that on, which is why it is stated as a reading and not as a
      # measurement.
      #
      # DRIVEN IN BOTH DIRECTIONS, INSIDE THE SUITE, on the body this file
      # ships:
      # `tests/test_release_gates.py::test_the_changelog_gate_refuses_a_heading_the_tag_does_not_carry`
      # extracts this step and runs it under `bash -e` against planted trees
      # carrying real annotated tags with chosen tagger dates. Two more drives
      # run this same body over the RENDERER'S corpus:
      # `::test_BOTH_readers_of_the_newest_heading_agree` over the named
      # documents, and `::test_the_two_readers_agree_over_the_whole_corpus`
      # over all 2954 of them, holding this step's rc=0 to coincide exactly
      # with the Python twin's reading and holding that reading to what
      # `markdown_it.MarkdownIt("commonmark")` says the newest `<h2>` is.
      #
      # GREEN on the
      # two shapes this repository has actually released — `v0.2.0` over
      # `## 0.2.0 — 2026-08-25` and `v0.1.0` over `## 0.1.0 — 2026-08-12` —
      # and on the same tags spelled without the leading `v`; RED on a
      # heading naming another version, on `unreleased`, on a date one day
      # off, on a `CHANGELOG.md` that is absent, on one with no heading at
      # all, on one whose newest heading does not parse, on a lightweight
      # tag, on a tag ref that is not in the checkout, and on a
      # `GITHUB_REF_NAME` that is empty and on one that is unset (two
      # different shell conditions, and only the second is `set -u`'s). The
      # green rows are not decoration: a gate driven only red is not known to
      # let a real release through, and this workflow's mistakes are
      # immutable.
      #
      # AND A CRLF `CHANGELOG.md` IS GREEN, MEASURED AND THEN DRIVEN. Every
      # `^`-anchored reader this repository has written over a workflow or a
      # markdown page has met a carriage return eventually — see
      # `_one_line_break` in `tests/test_release_gates.py`, and the three
      # times `tests/test_tripwire_record.py` met it — so it is not left to
      # chance here: `read -r` keeps the `\r` on the line and the trailing
      # `[[:space:]]*` of the heading pattern absorbs it, so a checkout with
      # `core.autocrlf` on reads the same date as one without. rc=0 on a
      # `## 0.2.0 — 2026-08-25\r\n` changelog, and that row is in the drive
      # named above rather than only in this sentence.
      - name: the tag and the changelog heading must agree
        run: |
          set -euo pipefail
          export LC_ALL=C
          # ONE LIST, ONE REFUSAL. Nothing below exits; everything appends.
          problems=()

          # THE TAG. `${VAR:-}` and not `${VAR}`: `set -u` on an unset one is
          # rc=1 with NO annotation, which is the state the `tar` refusal in
          # `- name: every sdist member is a committed file of the tagged
          # tree` was repaired out of. NAMED and not numbered: an ordinal or
          # a "two steps below" is a property of how many steps happen to be
          # written in between, and this file's header has a section on what
          # that costs.
          tag="${GITHUB_REF_NAME:-}"
          tag_version=""
          tag_date=""
          if [ -z "${tag}" ]; then
            problems+=("GITHUB_REF_NAME is empty or unset, so this step has no tag to compare anything to. On a 'release: published' event the runner sets it to the tag's own short name.")
          else
            tag_version="${tag#v}"
            ref="refs/tags/${tag}"
            # STDOUT ONLY — git's stderr goes to this step's log and never
            # into the value, for the reason the manifest step below gives
            # about tar's warnings — and the EXIT CODE is captured rather
            # than left to `set -e`, so a git that fails says so here
            # instead of killing the step with nothing said.
            ref_status=0
            ref_rows="$(git for-each-ref --format='%(refname) %(objecttype) %(taggerdate:short)' "${ref}")" || ref_status=$?
            if [ "${ref_status}" -ne 0 ]; then
              problems+=("git for-each-ref exited ${ref_status} looking for ${ref}, and what it said is in this step's log above. Without it this step cannot read the tag's date at all.")
            else
              rows=()
              if [ -n "${ref_rows}" ]; then
                mapfile -t rows <<<"${ref_rows}"
              fi
              if [ "${#rows[@]}" -eq 0 ]; then
                problems+=("there is no ${ref} in this checkout, so the tag carries no date this step can read. actions/checkout fetches the tag ref for a release event; a workspace without it is not the tagged tree.")
              elif [ "${#rows[@]}" -ne 1 ]; then
                problems+=("${ref} matched ${#rows[@]} refs, so this step cannot tell which tag it is being asked about.")
              else
                got_ref=""
                got_type=""
                got_date=""
                # A here-string ends in a newline, so `read` returns 0 on
                # any non-empty row; `|| true` is there so that a shape which
                # somehow makes it return non-zero cannot kill the step under
                # `set -e` with nothing said. The three variables are
                # pre-initialised empty, so a `read` that assigned nothing
                # falls into the refname mismatch below and is refused.
