          listing="$(tar tzf "${sdist}" 2>"${work}/tar.err")" || tar_status=$?
          cat "${work}/tar.err" >&2
          # REFUSAL POINT, driven in both directions on this body: all five
          # corrupt shapes rc=1 with this annotation, and the real
          # `stelling-0.2.0.tar.gz` rc=0 unchanged.
