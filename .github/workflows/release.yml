# Publishes to PyPI via Trusted Publishing (OIDC). No API tokens exist.
# The publish action generates PEP 740 attestations by default; do not
# disable them. Requires a (pending) Trusted Publisher configured on PyPI
# for this repository + workflow + environment.
#
# TWELVE REFUSAL POINTS STAND BETWEEN A TAG AND PyPI — ten `exit 1` sites
# written below, plus two steps that refuse by their own exit code — because
# this is the one workflow whose mistakes are immutable: a release on PyPI
# cannot be unpublished, only yanked, and a yanked file still resolves for
# anyone who pins it. This header used to say TWO, which was the count of
# REASONS below and never the count of refusals; the sdist checks arrived after
# it was written and it did not move. It said EIGHT until the tag step stopped
# PICKING among the wheels in `dist/` and started refusing a `dist/` it cannot
# reason about; that refusal is the seventh `exit 1` site, and the sentence it
# replaced is corrected beside the step rather than deleted. It said NINE until
# the same argument was carried to the OTHER artefact — see "THREE MORE" below,
# and the sentence THAT replaced, which this file used to end with.
#
# AND UNTIL `tests/test_release_gates.py` LANDED, NOTHING IN THIS REPOSITORY
# READ THIS FILE. One test opened a workflow at all — `tests/test_reuse_pins.py`,
# and only `ci.yml`. Six line-neutral mutations were applied here at once (the
# `rm` deleted, `-ra` -> `-rs`, the `verdict=made` condition made always-true,
# `publish: needs` losing `test`, this header's refusal count (`EIGHT` as it
# then read) -> `TWELVE`, and `comm -23`
# -> `comm -12`, which makes the committed-members gate incapable of firing) and
# the FULL SUITE STAYED GREEN on every one of them. That file is a text pin,
# one test per mutation, driven RED against each of the six individually and
# against all six at once. What it cannot do is check that any gate WORKS —
# only that the literal the record describes is still the literal here. Each
# gate's behaviour is recorded beside it, with the run that established it.
#
#   1. THE SUITE, on the tagged tree. `ci` runs on pushes to main and on pull
#      requests — neither of which is this event. A GitHub Release can be cut
#      from any commit, tag or branch, so "ci was green" is a statement about
#      some other tree unless it is re-established here.
#   2. THE TAG AND THE ARTEFACTS MUST AGREE — BOTH OF THEM. The version is
#      read from `src/stelling/__init__.py` by hatchling; the tag is typed by a
#      human in a web form. Nothing connects them. Tagging `v0.2.0` on a tree
#      that still says `0.1.0` publishes `stelling-0.1.0` under a release
#      called v0.2.0 — silently, and permanently. This reason was written about
#      "the artifact" singular and the step read only the WHEEL's filename; the
#      sdist is the artefact `pip install stelling` falls back to and the one
#      whose contents this file spends three steps on, and its filename was
#      never compared to anything. Both filenames are compared now.
#
# SEVEN OF THE TWELVE WERE DRIVEN IN BOTH DIRECTIONS at a61c01f, step body by
# step body under `bash -e` with the runner environment faked, in a venv built
# by this job's own install step (CPython 3.11.15, jax/jaxlib 0.10.2, numpy
# 2.4.6, cvc5 1.3.4, z3-solver 5.0.0.0, pytest 9.1.1). A refusal never observed
# to refuse is not known to be a refusal, so each one carries the input that
# made it fire, beside its own step. The `publish` job was NOT driven and must
# not be: no tag was cut, nothing was uploaded to any index.
#
# THE EIGHTH DID NOT EXIST THEN. `dist/` must hold exactly one wheel is the
# refusal that replaced the tag step's silent pick among several, and it was
# driven in both directions when it landed — one wheel green, two wheels and
# zero wheels red, under `C`, `en_GB.UTF-8` and `en_US.UTF-8`, on the body this
# file ships. The table is beside that step, and `tests/test_release_gates.py`
# drives it inside the suite so it stays driven.
#
# THREE MORE DID NOT EXIST UNTIL THE SAME ARGUMENT REACHED THE OTHER ARTEFACT,
# and the sentence they replaced is the one this file used to END with: *"The
# sdist's own filename version is still never compared to the tag; same build,
# so it agrees by construction."* "Same build" is precisely the premise the
# eighth refusal stopped accepting for the wheel, and one `dist/` shows what it
# cost. DRIVEN on the bodies this file then shipped, `dist/` holding
# `stelling-0.2.0-py3-none-any.whl` beside a `stelling-0.0.9.tar.gz` whose
# every member is committed, `TAG=v0.2.0`:
#
#   the tag step     rc=0   `tag=v0.2.0 artifact version=0.2.0`
#   the sdist step   rc=0   `every one of 5 sdist members is committed to
#                            this tree`
#
# Two green gates, and `stelling-0.0.9.tar.gz` on PyPI under a release called
# v0.2.0 — permanently, on the artefact this header opens by calling
# un-unpublishable. `upload-artifact` takes the whole `dist/` directory and the
# publish step uploads every file in it, so the tag agreeing with ONE file in
# it was never the question. The ninth is `dist/` holding exactly one SDIST,
# the tenth is that sdist's filename version carrying the tag, and the eleventh
# is the sdist step establishing the count for ITSELF — see beside each step.
# ALL THREE ARE DRIVEN IN BOTH DIRECTIONS, and inside the suite rather than by
# hand, by `tests/test_release_gates.py`, which extracts these step bodies and
# runs them against planted `dist/` directories:
# `test_the_tag_gate_refuses_an_sdist_the_tag_does_not_name` (the shape above,
# plus its mirror image and a `.dev0` segment, and the matching pair that must
# still PASS), `test_the_tag_gate_refuses_a_dist_it_cannot_reason_about` (two
# tarballs and none, under every locale this box has) and
# `test_the_sdist_gate_refuses_a_dist_it_cannot_read`.
#
# THE TWELFTH CANNOT FIRE, and that is stated here rather than left as an
# untested branch. The "examined nothing" loop guards three files; the
# `explained.txt` arm is dead. `printf '%s\n' "${GENERATED}"` emits a newline
# even for an empty `GENERATED`, so `generated.txt` is never empty, so
# `explained.txt = sort -u tracked.txt generated.txt` is never empty either —
# measured at 1 byte in the degenerate case, with an empty index AND an empty
# `GENERATED`. The `members.txt` and `tracked.txt` arms both fire and are
# driven; nothing is lost by the dead arm, and it is not a third check.
#
# NO STEP IN THIS FILE CHECKS THE WHEEL'S MEMBER LIST, AND THE ARGUMENT THAT
# ONE WAS NOT NEEDED WAS HALF AN ARGUMENT. Step 2 reads FILENAMES and nothing
# else. What was said to protect the wheel is a COUPLING rather than a
# check — both artefacts come out of one `uv build` over one tree, and the
# sdist allowlist covers `/src` — and the coupling was driven in ONE
# DIRECTION: an untracked `src/stelling/_relgate_probe.py` shipped in the wheel
# (29 members against a baseline of 28) AND in the sdist, where the
# committed-members comparison caught it by name. That is a file ADDED.
#
# THE SUBTRACTIVE DIRECTION WAS UNCOVERED, AND IT IS THE ONE THAT SHIPS AN
# UNIMPORTABLE PACKAGE. Re-driven at 650e678 in a clone of this tree, with
# `exclude = ["**/solvers.py", "**/contracts.py"]` added under
# `[tool.hatch.build.targets.wheel]`: the sdist stayed at 279 members, the
# wheel went 28 -> 26, and EVERY GATE HERE STAYED GREEN — the sdist step rc=0
# on "every one of 279 sdist members is committed to this tree", the tag step
# rc=0 on `v0.1.0`, and `test_sdist_contents.py` + `test_import_hygiene.py` +
# `test_release_doc_claims.py` 39 passed. The installed wheel: `import
# stelling` fine, `import stelling.solvers` ModuleNotFoundError. The sdist
# allowlist cannot see it, because an allowlist says which paths MAY ship and
# never which MUST, and the wheel target reads a different table.
#
# WHAT CATCHES IT NOW is not a step here, and that is deliberate: it is three
# tests in `tests/test_sdist_contents.py`, which run inside the suite above and
# therefore refuse through refusal point 1 rather than adding a THIRTEENTH —
# this sentence said "a tenth" when the count was nine, and the count is what
# moves. The
# wheel's package members are compared to the tree's as an EQUALITY (so it
# fires in both directions), the drop is driven as an intervention, and the
# built wheel is UNPACKED INTO A BARE INTERPRETER and every module of it
# resolved — the "nothing installs or imports a built artefact" gap, closed
# where it can be measured on this box instead of guessed at on a runner.
# Driven RED against exactly the mutation above: "in the tree and NOT in the
# wheel: ['stelling/contracts.py', 'stelling/solvers.py']" and "these modules
# of it do not resolve: ['contracts', 'solvers']".
#
# WHAT IS STILL NOT CHECKED ABOUT `dist/`, said plainly rather than left to be
# inferred from the two counts above: a file in `dist/` that is NEITHER a
# `.whl` NOR a `.tar.gz`. Both counts are globs, and neither is an inventory of
# the directory, so a stray `dist/notes.txt` is invisible to every step here
# and is uploaded with the rest. `pypa/gh-action-pypi-publish` rejects what it
# cannot recognise as a distribution, which is a refusal in somebody else's
# code rather than one written down here; it is named because "exactly one
# wheel and exactly one sdist" reads like a statement about the whole directory
# and is not one.

name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: the suite, on the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e ".[solvers,jax]" pytest
      # Unnarrowed, and with the skip-inventory verdict asserted off a channel
      # the exit code cannot reach — same reasoning as the `ci` workflow. A
      # publish must not ride on a session that silently dropped its checks.
      #
      # REFUSAL POINT (implicit — pytest's own exit code). GREEN, driven at
      # a61c01f in this job's own venv: `2519 passed, 16 skipped` (junitxml:
      # 2535 tests, 0 failures, 0 errors), 157.9 s. RED, with one failure
      # injected by a plugin: the step exits 1 HERE and the two verdict checks
      # below are never reached — which is the order they want.
      #
      # THE PRECISION IS WHATEVER EACH MODULE CHOOSES. Neither workflow sets
      # `JAX_ENABLE_X64`, and 52 of 97 test modules name `jax_enable_x64`
      # themselves, so this green is a mixture by construction. That is a fact
      # about the figure, not a defect: the modules that care pin it.
      - name: pytest, with the skip-inventory verdict asserted separately
        env:
          STELLING_SKIP_INVENTORY_VERDICT: ${{ runner.temp }}/verdict.txt
        run: |
          set -euo pipefail
          # ABSENCE is the signal this step buys, and it is only a signal if
          # nothing else could have left a file here. RE-DRIVEN IN BOTH
          # DIRECTIONS at a61c01f, same inputs to each: a `verdict=made` file
          # planted at the path, and a pytest that writes none (a plugin drops
          # the environment variable, the route tests/conftest.py names in its
          # own docstring). WITH this line the step exits 1 on "no verdict was
          # written"; with this line DELETED the step exits 0 and `cat`s the
          # planted file into the publish log. The line earns its place, and
          # that is the measurement rather than the argument for it.
          rm -f "${RUNNER_TEMP}/verdict.txt"
          # `-ra`, not `-rs`. Re-driven at a61c01f on the SAME red session, one
          # injected failure: `-ra` prints `FAILED
          # tests/test_verdict.py::test_every_contract_field_is_required`,
          # `-rs` prints zero `FAILED` lines, and both exit 1. So the exit code
          # is the same and the publish log of a red suite names what failed
          # only under `-ra`.
          .venv/bin/python -m pytest -q -ra
          verdict="${RUNNER_TEMP}/verdict.txt"
          # REFUSAL POINT. Driven red at a61c01f: with the recorder's
          # environment variable removed the session exits 0 (`12 passed`)
          # and leaves no file, and this exits 1.
          if [ ! -f "${verdict}" ]; then
            echo "::error title=no skip-inventory verdict was written::tests/conftest.py writes one on every way out of a session. There is no file, so the recorder was ignored, filtered out or never loaded — and pytest's own exit code cannot report that."
            exit 1
          fi
          cat "${verdict}"
          # REFUSAL POINT, and the one that catches a NARROWED session, which
          # nothing else here can see. Driven red at a61c01f with
          # `pytest tests/test_verdict.py` appended: pytest exits 0 on
          # `12 passed`, the recorder writes `verdict=withdrawn`, and this
          # exits 1. (A narrowing that collects nothing does not reach here at
          # all — pytest exits 5 and `set -e` stops above. Red either way.)
          if ! head -1 "${verdict}" | grep -qx 'verdict=made'; then
            echo "::error title=the completeness claim was not made::Refusing to publish on a session that could not claim the suite."
            exit 1
          fi
      # REFUSAL POINT (implicit — this command's own exit code), and it is a
      # real one rather than an informational print.
      # Driven at a61c01f: 0 with z3 5.0.0.0 and cvc5 1.3.4 both reporting
      # `[selfcheck: ok]`, and 1 with `STELLING_CVC5` pointed at a stub that
      # answers `sat` to `(distinct x x)` — `[selfcheck FAILED: expected
      # `unsat` for `x != x`, got 'sat']`. Missing optional dependencies stay
      # informational; a BROKEN installed one is what turns this red.
      - run: .venv/bin/python -m stelling

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # Driven for real at a61c01f (no tag, nothing uploaded): 279-member
      # `stelling-0.1.0.tar.gz` and 28-member `stelling-0.1.0-py3-none-any.whl`.
      - run: uv build
      # `tag_name` is attacker-influenced in the general case, so it goes
      # through the environment rather than being interpolated into the shell.
      # The comparison is against the BUILT ARTEFACTS' names, not against
      # `__version__` read from the source: the filename is what gets uploaded,
      # so it is the thing that has to agree with the tag.
      #
      # REFUSAL POINT, driven at a61c01f over seven tags against the real
      # `stelling-0.1.0-py3-none-any.whl`. PASSES on `v0.1.0` and `0.1.0`.
      # REFUSES `v0.2.0`, `0.2.0`, the empty string, `v0.1.0 ` (trailing space)
      # and `V0.1.0` — the last three are worth knowing, because a gate that
      # normalised them would be a gate that could be talked past.
      #
      # AND THE SAME REFUSAL FOR THE SDIST, which is new and which this file's
      # own last sentence used to argue was unnecessary: "same build, so it
      # agrees by construction". That is a COUPLING and not a check — the same
      # word this file already uses for what was said to protect the wheel's
      # member list — and it is the same shape of premise the wheel COUNT
      # refusal below was written to stop accepting. It was driven false: a
      # `dist/` holding `stelling-0.2.0-py3-none-any.whl` beside a
      # `stelling-0.0.9.tar.gz`
      # whose every member is committed took `TAG=v0.2.0` through this step at
      # rc=0 (`tag=v0.2.0 artifact version=0.2.0`) and through the sdist step
      # at rc=0 ("every one of 5 sdist members is committed to this tree").
      # `0.0.9` would have gone to PyPI under a release called v0.2.0. Refusal
      # reason 2 at the top of this file — the version is read by hatchling,
      # the tag is typed by a human, nothing connects them — is not one word
      # weaker for the tarball than for the wheel, and the tarball is the
      # artefact that gets built from source on every machine without a
      # matching wheel.
      #
      # DRIVEN IN BOTH DIRECTIONS on the body below, `dist/` of empty files:
      #
      #   dist/                                TAG           verdict
      #   0.2.0.whl + 0.2.0.tar.gz             v0.2.0        rc=0
      #   0.2.0.whl + 0.0.9.tar.gz             v0.2.0        rc=1 tag and sdist
      #   0.0.9.whl + 0.2.0.tar.gz             v0.2.0        rc=1 tag and wheel
      #   0.2.0.whl + 0.2.0.dev0.tar.gz        v0.2.0        rc=1 tag and sdist
      #   0.2.0.dev0.whl + 0.2.0.dev0.tar.gz   v0.2.0.dev0   rc=0
      #   0.2.0.whl + 0.2.0 and 0.0.9 .tar.gz  v0.2.0        rc=1 not one sdist
      #   0.2.0.whl + no tarball               v0.2.0        rc=1 not one sdist
      #
      # The last row is why `basename … .tar.gz` strips the suffix before
      # `cut`: without it the version reads `0.2.0.dev0.tar.gz`, which matches
      # no tag at all and would refuse the RIGHT tarball as loudly as a wrong
      # one. `tests/test_release_gates.py` drives every row inside the suite.
      #
      # A SECOND REFUSAL POINT IN THIS STEP, RUNNING BEFORE THE ONE ABOVE, and
      # it replaced a silent PICK. `ls dist/*.whl` returns EVERY match and
      # `basename` on a multi-line string returns
      # whatever follows the LAST `/`, so with two wheels present this step
      # examined ONE of them and said nothing whatever about the other — while
      # `upload-artifact` takes the whole `dist/` directory, `download-artifact`
      # restores it, and the publish step uploads every file in it. A gate that
      # reads "the wheel" where there is more than one is not answering its own
      # question, so it now establishes that there is EXACTLY ONE and refuses a
      # `dist/` it cannot reason about.
      #
      # THE JUSTIFICATION THAT STOOD HERE IS FALSE, AND IS CORRECTED RATHER
      # THAN DELETED. It read: *"`ls` SORTS, so the LAST match is the HIGHEST
      # version, and that is the one compared"*, and concluded that what goes
      # green is a stray that sorts BEFORE the real wheel. The conclusion
      # survives; the reason does not. It was a coincidence of the two examples
      # it was drawn from — `0.0.9`, `0.1.0`, `0.2.0` differ in a DIGIT, and
      # every collation agrees about digits. Put a PEP 440 dev segment beside
      # its own release and the LAST match is the LOWER version under `C` and
      # the HIGHER one under a UTF-8 locale: `-` sorts before `.` in ASCII,
      # while a UTF-8 collation ignores punctuation at the primary level. So
      # "sorts before" is a property of the RUNNER'S LOCALE and of the two
      # filenames, and never of the version. Re-driven on a `dist/` of two
      # empty files with the old step body verbatim:
      #
      #   wheels in dist/       TAG      LC_ALL=C          en_GB / en_US.UTF-8
      #   0.1.0 + 0.2.0       v0.1.0   0.2.0      rc=1     0.2.0      rc=1
      #   0.0.9 + 0.1.0       v0.1.0   0.1.0      rc=0 !   0.1.0      rc=0 !
      #   0.2.0 + 0.2.0.dev0  v0.2.0   0.2.0.dev0 rc=1     0.2.0      rc=0 !
      #
      # The third row is the one the old sentence could not describe: one tree,
      # two files, one tag, and a different verdict per runner locale. Every
      # `rc=0` there is a wheel nobody tagged going to PyPI permanently.
      #
      # `export LC_ALL=C` IS SET AND IS NOT WHAT FIXES THIS, which is why it is
      # not offered as the repair. Driven with ONLY the export added to the old
      # body: row three becomes rc=1 under all three locales — deterministic —
      # and row two is still rc=0, so a `0.0.9` nobody tagged still ships
      # beside the `0.1.0`. Determinism is worth having and is kept; the answer
      # it was making deterministic was the wrong answer.
      #
      # EXACTLY ONE WHEEL AND EXACTLY ONE SDIST, RATHER THAN CHECKING EVERY
      # FILE FOUND — the choice, and the reason. What this step exists to
      # answer is not "is there a file here whose version matches the tag" but
      # "will this release publish anything the tag does not name", and the
      # unit of THAT answer is the DIRECTORY, because the directory is what
      # gets uploaded. Checking every match still passes a `dist/` holding two
      # wheels that both spell the tagged version — one built here, one left by
      # some other build of some other tree — and agreeing about a version is
      # not provenance. `uv build` on this project produces exactly one wheel
      # and exactly one sdist: the wheel is `py3-none-any`, there is no build
      # matrix, no compiled extension and no `cibuildwheel`, and there is one
      # sdist target, so a second of either is not a shape this release path
      # can produce and is precisely the evidence that `dist/` holds something
      # this job did not build. The cost is named rather than hidden: if this
      # project ever ships more than one wheel, this step has to be edited, and
      # re-deciding it deliberately is the right price in the one file whose
      # mistakes cannot be undone.
      #
      # THE TWO-TARBALL SHAPE DID NOT SILENTLY PICK — IT DIED WITHOUT SAYING SO,
      # which is a different defect with the same repair, and the difference is
      # recorded because the wheel paragraph above is about a PICK and it would
      # be easy to copy that reading across. `sdist="$(ls dist/*.tar.gz)"` is
      # QUOTED, so two matches become one string with a newline in it and `tar`
      # is handed a filename that does not exist. Driven on the shipped bodies,
      # `dist/` holding `stelling-0.0.9.tar.gz` and `stelling-0.2.0.tar.gz`:
      # the sdist step exited 2 with `tar (child): dist/stelling-0.0.9.tar.gz`
      # + a newline + `dist/stelling-0.2.0.tar.gz: Cannot open`, and NO
      # annotation — "red, but not by this gate", the exact state the no-wheel
      # case was repaired out of. Zero tarballs is the same: `ls` fails on the
      # unexpanded glob. Both are this step's own refusal now, with a message.
      #
      # AND IT CLOSES THE NO-WHEEL CASE, which this comment used to record as a
      # shortcoming: with no wheel at all the old body died on `ls`'s own rc=2
      # with no annotation — "red, but not by this gate". Driven: rc=2 and
      # `ls: cannot access` before, rc=1 and this step's own annotation after.
      #
      # NONE OF IT IS REACHABLE FROM THIS WORKFLOW TODAY — `actions/checkout@v4`
      # gives this job a fresh clone, `dist/` is gitignored and has no tracked
      # member, and one `uv build` fills it. It is repaired because it is
      # wrong, not because it is urgent.
      #
      # DRIVEN HERE, NOT ONLY ON A RUNNER. The table above, the `LC_ALL=C`-only
      # variant, the no-wheel case, the one-wheel green and the seven tags
      # above were all driven on the body below under `C`, `en_GB.UTF-8` and
      # `en_US.UTF-8`; the one-wheel green and the seven tags are unchanged in
      # every cell. `tests/test_release_gates.py` extracts this body and drives
      # both refusals inside the suite, so they stay driven.
      - name: the tag and the artifacts must agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Determinism for everything below, and the sdist step has it too.
          # It is NOT what makes the count right — see the comment above.
          export LC_ALL=C
          # `nullglob` so an empty `dist/` reaches the refusals below as zero
          # matches instead of arriving here as the literal glob string.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'dist/*.whl matched %s file(s)\n' "${#wheels[@]}"
            [ "${#wheels[@]}" -eq 0 ] || printf '  %s\n' "${wheels[@]}"
            echo "::error title=dist/ does not hold exactly one wheel::${#wheels[@]} files match dist/*.whl, and this step can only speak for the one this job built. upload-artifact takes the whole directory and the publish step uploads every file in it, so a wheel this comparison never examined would go to PyPI permanently. One 'uv build' of this project produces exactly one py3-none-any wheel; anything else in dist/ came from somewhere this job cannot account for. Empty dist/ and re-run the build."
            exit 1
          fi
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            printf 'dist/*.tar.gz matched %s file(s)\n' "${#sdists[@]}"
            [ "${#sdists[@]}" -eq 0 ] || printf '  %s\n' "${sdists[@]}"
            echo "::error title=dist/ does not hold exactly one sdist::${#sdists[@]} files match dist/*.tar.gz, and this step can only speak for the one this job built. upload-artifact takes the whole directory and the publish step uploads every file in it, so a tarball this comparison never examined would go to PyPI permanently — and an sdist cannot be unpublished, only yanked. One 'uv build' of this project produces exactly one sdist; anything else in dist/ came from somewhere this job cannot account for. Empty dist/ and re-run the build."
            exit 1
          fi
          # `cut -d- -f2` off the basename for both, and `.tar.gz` stripped
          # first because an sdist name is `<name>-<version>.tar.gz` with no
          # separator after the version — `cut` alone yields `0.0.9.tar.gz`.
          version="$(basename "${wheels[0]}" | cut -d- -f2)"
          sdist_version="$(basename "${sdists[0]}" .tar.gz | cut -d- -f2)"
          echo "tag=${TAG} wheel version=${version} sdist version=${sdist_version}"
          if [ "${TAG}" != "v${version}" ] && [ "${TAG}" != "${version}" ]; then
            echo "::error title=tag and wheel disagree::The release is tagged '${TAG}' but the built wheel is version '${version}'. Publishing would put '${version}' on PyPI permanently, under a release that says otherwise. Fix __version__ or the tag; do not re-run this job until they match."
            exit 1
          fi
          if [ "${TAG}" != "v${sdist_version}" ] && [ "${TAG}" != "${sdist_version}" ]; then
            echo "::error title=tag and sdist disagree::The release is tagged '${TAG}' but the built sdist is version '${sdist_version}'. This step used to compare only the wheel, on the argument that one 'uv build' produces both so they agree by construction — which is a coupling and not a check, and a dist/ holding a matching wheel beside a stale tarball passed every gate in this file. Publishing would put '${sdist_version}' on PyPI permanently, under a release that says otherwise. Fix __version__ or the tag; do not re-run this job until they match."
            exit 1
          fi
      # THE ASSERTION `tests/test_sdist_contents.py` CANNOT MAKE ON A
      # CONTRIBUTOR'S MACHINE, and the step below used to print the manifest
      # and assert nothing about it.
      #
      # EIGHT tests in that module are gated on `uv` and skip without it —
      # including `test_an_arbitrary_new_file_does_not_ship`, the module's own
      # headline property and the only one established by intervention. This
      # comment said THREE, which was the count when it was written and has not
      # been the count for a long time: five `shutil.which("uv")` gates plus
      # the three wheel-member checks behind `_needs_a_build_and_an_oracle`.
      # RE-MEASURED on the module this commit ships: `17 passed, 8 skipped` on
      # a PATH with no `uv` against `25 passed` with it, and one smuggling
      # shape (a committed dangling symlink) goes from red to green with it.
      # Making that skip a hard failure would be flaky in the environment
      # where it matters least — a contributor's first `pytest`.
      # It matters HERE, one step from immutable, so the failure belongs here.
      # Every pytest job in this repository already uses
      # `astral-sh/setup-uv@v6`, so no CI run takes that skip either.
      #
      # It is deliberately NOT a copy of the test module's model of hatchling.
      # It reads the built tarball and the index and asks the one question a
      # release can answer completely: was every member committed to the
      # TAGGED tree? That covers every force-include route at once — an
      # ancestor `.gitignore`/`.hgignore` arriving keyed by basename, a
      # `force-include` table, a `hatch_build.py` hook — and every untracked
      # file, without modelling any of them.
      #
      # AND IT RESOLVES ITS OWN TARBALL RATHER THAN INHERITING ONE. The count
      # this step makes is the same count the tag step above already made, and
      # it is made TWICE deliberately: nothing is carried between steps, each
      # `run:` block is a script that has to be correct on the input it is
      # given, and `tests/test_release_gates.py` extracts and drives each body
      # ALONE. A body whose correctness depends on a step that ran before it is
      # a body no drive can establish — and "an earlier step would have caught
      # it" is the same shape of argument as "same build, so it agrees by
      # construction", which is the sentence this file had to retract.
      #
      # REFUSAL POINTS (four `exit 1` sites, three of which can fire). The
      # tarball COUNT is the new one and is driven in both directions by
      # `test_the_sdist_gate_refuses_a_dist_it_cannot_read` rather than at
      # a61c01f, where it did not exist. The other three were driven in both
      # directions at a61c01f. GREEN on the real
      # artefact: "every one of 279 sdist members is committed to this tree".
      # RED, twice, by two different routes and each with a real plant:
      #
      #   * an `.hgignore` in the checkout's PARENT directory — the
      #     force-include route `pyproject.toml` describes, re-verified here:
      #     280 members against the 279 baseline, and this step printed
      #     `.hgignore` and exited 1;
      #   * an untracked `src/stelling/_relgate_probe.py` — a stray UNDER an
      #     allowlisted directory, which the allowlist by design does not stop:
      #     it shipped in both artefacts and this step named it and exited 1.
      #
      # AND A CONTROL, so the 279/279 green is not a green from having looked
      # at nothing: the same probe named `_relgate_probe.so` — matched by
      # `.gitignore`'s `*.so`, which hatchling reads — reached NEITHER the
      # wheel (28 members, unchanged) nor the sdist, and this step stayed
      # green. The route is closed, driven rather than assumed.
      - name: every sdist member is a committed file of the tagged tree
        env:
          # Written by the build backend from the project metadata; no tree
          # path can supply it. Kept in step with `GENERATED_IN_DISTRIBUTION`
          # in tests/test_sdist_contents.py.
          GENERATED: PKG-INFO
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            printf 'dist/*.tar.gz matched %s file(s)\n' "${#sdists[@]}"
            [ "${#sdists[@]}" -eq 0 ] || printf '  %s\n' "${sdists[@]}"
            echo "::error title=the sdist check cannot tell which tarball to read::${#sdists[@]} files match dist/*.tar.gz. This step reads ONE tarball and speaks only for that one, while upload-artifact takes the whole directory and the publish step uploads every file in it. With two matches it used to hand tar a filename with a newline in it and die on tar's own exit code with no annotation; with none it died on the unexpanded glob. Empty dist/ and re-run the build."
            exit 1
          fi
          sdist="${sdists[0]}"
          tar tzf "${sdist}" | sed -e 's|^[^/]*/||' -e '/\/$/d' -e '/^$/d' | sort -u > members.txt
          git ls-files | sort -u > tracked.txt
          printf '%s\n' "${GENERATED}" | sort -u > generated.txt
          sort -u tracked.txt generated.txt > explained.txt
          # ZERO EXAMINED MUST NOT READ AS ZERO PROBLEMS. Each of these is a
          # way for the comparison below to come back empty because it looked
          # at nothing: an unreadable tarball, an index this job cannot see, a
          # `sed` that ate every line.
          #
          # Driven red at a61c01f on two of the three: a VALID but EMPTY
          # tarball ("members.txt is empty", exit 1), and a checkout whose
          # index is empty ("tracked.txt is empty", exit 1). Note what does
          # NOT get here: a CORRUPT tarball dies in the pipeline above at
          # tar's own rc 2, with no annotation. Still red, so still safe, but
          # `pipefail` is what catches that one and not this loop — which is
          # the sort of thing a comment naming "an unreadable tarball" would
          # otherwise take credit for.
          for f in members.txt tracked.txt explained.txt; do
            if [ ! -s "${f}" ]; then
              echo "::error title=the sdist check examined nothing::${f} is empty, so the comparison below could not have found anything. Refusing to publish."
              exit 1
            fi
          done
          # Driven red at a61c01f by asking for a member that is not there
          # (`GENERATED=NOT-A-REAL-MEMBER`): "is not in
          # dist/stelling-0.1.0.tar.gz. Refusing to publish.", exit 1.
          for required in "${GENERATED}" pyproject.toml README.md LICENSE; do
            if ! grep -qxF "${required}" members.txt; then
              echo "::error title=the sdist check is not looking at a real artefact::'${required}' is not in ${sdist}. Refusing to publish."
              exit 1
            fi
          done
          unexplained="$(comm -23 members.txt explained.txt)"
          if [ -n "${unexplained}" ]; then
            echo "${unexplained}"
            echo "::error title=the sdist ships files that are not committed to this tree::The members listed above are in ${sdist} and not in \`git ls-files\` for the tagged commit. An sdist on PyPI cannot be unpublished, only yanked, and a yanked file still resolves for anyone who pins it. Either commit them and re-tag, or find the force-include route putting them there (see tests/test_sdist_contents.py). Refusing to publish."
            exit 1
          fi
          echo "every one of $(wc -l < members.txt) sdist members is committed to this tree"
          rm -f members.txt tracked.txt generated.txt explained.txt
      # A last look at what would ship, in the log, before it becomes immutable.
      # tests/test_sdist_contents.py already holds the allowlist shut; this is
      # here so the record of a release includes the file list it published.
      #
      # NOT a refusal, and driven to establish that rather than to assume it:
      # at a61c01f it wrote 282 lines of manifest and exited 0. The only way it
      # goes red is `set -u` on an unset `GITHUB_STEP_SUMMARY` (driven:
      # "GITHUB_STEP_SUMMARY: unbound variable", exit 1), which a runner always
      # sets. It asserts nothing about what it prints — the step before it is
      # what does that.
      #
      # EVERY TARBALL, NOT "THE" TARBALL, and that is what keeps it a
      # non-refusal. It carried the LAST `ls dist/` in this file — the second
      # of the two `ls dist/*.tar.gz` sites, the wheel's having been retired in
      # the step above — so
      # with two tarballs it died on tar's own exit code and with none it died
      # on the unexpanded glob — a step whose whole job is to PRINT, failing the
      # release, with nothing said about why. Adding a count refusal here would
      # have made it a refusal point, which it is deliberately not; a loop over
      # the glob makes the record cover everything `dist/` would publish and
      # still asserts nothing. `nullglob` is what makes the empty case print
      # nothing instead of trying to read a file called `dist/*.tar.gz`.
      - name: the sdist manifest, for the record
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob
          for sdist in dist/*.tar.gz; do
            echo "### sdist contents (${sdist})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tar tzf "${sdist}" | sed 's|^[^/]*/||' | sort >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # THE REFS IN THIS JOB ARE A DECISION, NOT AN OVERSIGHT.
  #
  # `pypa/gh-action-pypi-publish@release/v1` is a BRANCH ref, on the only job
  # in this repository that holds `id-token: write` and the only one that can
  # write to PyPI permanently. Everything else here — `actions/checkout@v4`,
  # `astral-sh/setup-uv@v6`, `actions/{upload,download}-artifact@v4` — is a
  # floating MAJOR TAG. Both are mutable; the difference is who moves them and
  # when. A major tag is moved by its owner at each release; a branch moves
  # with every commit that lands on it.
  #
  # NOT PINNED TO A SHA, for three reasons, in order of weight:
  #
  #   1. PINNING ONLY THIS STEP WOULD BE THEATRE. The bytes uploaded to PyPI
  #      arrive through `actions/download-artifact@v4`, one line above. An
  #      action that can substitute the artifact needs no `id-token` of its
  #      own. Hardening the chain means pinning the whole chain — checkout,
  #      setup-uv, both artifact actions, and this one — or pinning none of it.
  #   2. A PIN WITHOUT AUTOMATION BECOMES A STALE PIN, and stale is a live
  #      hazard for this action specifically: PEP 740 attestations are
  #      generated by DEFAULT and must not be disabled, and that default
  #      arrived in a release. A SHA frozen below it publishes without
  #      attestations and says nothing about it. So the correct form is a SHA
  #      plus a Dependabot/Renovate entry that bumps it, and the pin should not
  #      land before the automation does.
  #   3. THE SHA WOULD BE UNVERIFIABLE WHERE THIS WAS WRITTEN — no network. A
  #      40-character ref typed from memory onto the publish step is worse than
  #      a branch ref maintained by PyPA: at best the job fails on release day,
  #      at worst it resolves to a commit nobody chose.
  #
  # Pinning does NOT break Trusted Publishing — the OIDC token is minted by
  # GitHub for this job and exchanged by whatever code runs, so the ref is
  # irrelevant to it — and that is not the reason for leaving it alone.
  #
  # WHAT A HUMAN SHOULD DO, on a machine with network, as one change: add
  # `.github/dependabot.yml` with `package-ecosystem: github-actions`, then pin
  # all five actions in this file to `@<sha>  # vX.Y.Z`, then confirm on a test
  # release to TestPyPI that attestations are still generated.
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
