[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stelling"
dynamic = ["version"]
description = "Harness-driven verification for JAX scientific computing, with jaxpr as the verification IR."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Nicholas Ehsan Roy", email = "nicholas.ehsan.roy@gmail.com" },
]
keywords = ["jax", "verification", "formal-methods", "smt", "scientific-computing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]

# The core must stay importable in a bare environment: jax and the solver
# wheels are heavyweight and often already managed by the user's environment,
# so they are extras, imported lazily via stelling._optional.
dependencies = []

[project.optional-dependencies]
# [jax] is bootstrap-only, for environments with no jax at all. If you already
# have jax, do not install this extra — stelling must stay out of your resolver.
#
# THE FLOOR IS THE VERIFIED FLOOR. It was `>=0.5`, which was wrong twice over
# and measurably so.
#
#   * On 0.5.x stelling produces no useful verdicts at all. `pjit` was renamed
#     to `jit` at 0.7.0, and `jit` is what `coverage.DEFAULT_TRANSPARENT`
#     descends into; on 0.5.1 the checker abstains and every contract comes
#     back UNKNOWN.
#   * 0.6–0.9 were never run. `dynamic_slice` became `slice` at 0.9.2, and
#     stelling has a `slice` transfer and no `dynamic_slice`.
#
# `TESTED_JAX_SERIES` in `stelling/_optional.py` is the claim this floor must
# match, and it is a claim about a lane that RUNS, not about a range someone
# hopes works: `ci.yml` carries `test-jax-0-10` pinning the series and
# asserting the series it actually resolved. Widen this only after adding the
# lane, never before — and note the direction of the risk, which is not
# obvious: an untested series does not produce wrong answers, it produces
# quiet UNKNOWNs whose stated reason blames the caller's program.
jax = ["jax>=0.10"]
z3 = ["z3-solver>=4.13"]
cvc5 = ["cvc5>=1.2"]
solvers = ["stelling[z3,cvc5]"]
# `all` deliberately equals `solvers`: the extra people type reflexively must
# never pull jax into an environment that already manages it (a resolver bump
# can desync CUDA plugin wheels).
all = ["stelling[z3,cvc5]"]

[project.urls]
Homepage = "https://github.com/NicholasEhsanRoy/stelling"
Repository = "https://github.com/NicholasEhsanRoy/stelling"
Issues = "https://github.com/NicholasEhsanRoy/stelling/issues"

[dependency-groups]
# `hypothesis` is DEV ONLY, and deliberately so. It drives `tests/property/`,
# where the metamorphic and oracle properties live. It is not a runtime
# dependency and not an extra: nothing under `src/stelling/` imports it, and a
# consumer installing `stelling` must not acquire it.
#
# RESOLVED VERSION, recorded because "pinned" without a measurement is a hope:
#
#     hypothesis 6.165.2   (python 3.12.3, numpy 2.5.1, sortedcontainers 2.4.0)
#     resolved 2026-08-08, against jax 0.11.0 and jax 0.10.2 alike
#
# The upper bound is the real pin. A Hypothesis major bump is entitled to change
# strategy semantics and shrinker behaviour, and this suite's value rests on
# shrink quality over a recursive harness grammar — measured at a median of 3
# AST nodes over 25 seeds, which is the one mechanism that justified taking the
# dependency at all. A silent major upgrade would move that number with nothing
# watching it.
#
# `tests/property/` SKIPS when hypothesis is absent, which is what the two
# shared jax venvs and the zero-dep CI job see. That skip is registered in
# `tests/test_skip_inventory.py`, and `tests/property/test_suite_disclosure.py`
# runs WITHOUT hypothesis, so "the property suite examined nothing" can never
# read as "the property suite found nothing". See `tests/property/README.md`
# and `tools/property_venv.sh` for the one-command local environment.
dev = [
  "hypothesis>=6.165.2,<7",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "reuse>=5.0",
]

[tool.hatch.version]
path = "src/stelling/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stelling"]

# The sdist ships an ALLOWLIST, not a filtered copy of the working tree.
#
# Hatchling's default sdist takes everything that is not gitignored — tracked or
# not. That is fail-OPEN: a file protected only by being untracked still ships,
# and `.git/info/exclude` does not protect it either, because hatchling does not
# read it. `git status` reads four exclusion sources; hatchling reads a
# different set, and that difference is why the subdirectory guard in
# `tests/test_sdist_contents.py` does not ask `git status` any more: a probe in
# `docs/` hidden by `.git/info/exclude`, by a developer's `core.excludesFile` or
# by a nested `.gitignore` passed that guard and shipped, 261 members against a
# baseline of 260. Measured: an internal release checklist, untracked and
# deliberately uncommitted, shipped byte-identical inside
# `stelling-0.1.0.tar.gz`, and a probe file dropped in the tree shipped with it.
#
# WHAT HATCHLING ACTUALLY READS — this comment used to say "ONE `.gitignore` …
# and no other exclusion source", and that was FALSE. It locates TWO files, each
# by walking UP from the build root: `.gitignore` (stopping at a `.git`) and
# `.hgignore` (stopping at a `.hg`, which a git checkout does not have, so that
# search runs to `/`). BOTH are also force-included into the sdist, which
# bypasses this allowlist entirely — an `.hgignore` in a parent directory of the
# checkout is distributed as `stelling-0.1.0/.hgignore`, measured at 261 members
# against the same baseline of 260. And hatchling DISCARDS the whole exclusion
# set when the checkout's own absolute path matches it, so this file's `.cache`,
# `lib/`, `var/`, `dist/` and `venv/` lines make a checkout at, say,
# `~/.cache/x/stelling` ship every gitignored file inside an allowlisted
# directory: 262 members from one path and 260 from another, same tree, same
# plants. `tests/test_sdist_contents.py` is where all three are held.
#
# An sdist on PyPI cannot be unpublished, so this is one of the few places where
# a defect is immutable once released. Hence an allowlist: a path that is not
# named below does not ship — except for the force-included handful, which no
# allowlist can reach — and a new stray file at the root fails closed instead of
# being distributed. `tests/test_sdist_contents.py` holds this shut with the
# same intervention that found the leak.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/corpus",
  "/design",
  "/assets",
  "/LICENSES",
  "/.github",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/REUSE.toml",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/DCO",
  "/SECURITY.md",
  "/SOUNDNESS.md",
  "/ARCHITECTURE.md",
  "/DOCUMENTATION_ARCHITECTURE.md",
  "/.pre-commit-config.yaml",
  "/.license-header.txt",
  "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
