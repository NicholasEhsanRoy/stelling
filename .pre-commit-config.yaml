# One-time setup per clone: `pre-commit install`
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      # `scratchpad/**` IS EXCLUDED, and a narrowing has to show its
      # replacement rather than assume one.
      #
      # REUSE.toml annotates the whole subtree — deliberately, because the
      # scratchpad holds evidence in whatever form the measurement produced,
      # including formats (.json, .csv) that cannot carry a comment at all.
      # This fixer rewrites the WORKING TREE, so with `scratchpad/**` still in
      # its `files:` regex it added twelve headers REUSE.toml exists to make
      # unnecessary, and `staged-spdx-header` below then correctly reported the
      # divergence the fixer had just created. Driven, `pre-commit run
      # --all-files` twice in a clean checkout:
      #
      #   33fd1f8   pass 1 Failed (12 files rewritten)   pass 2 rc=0
      #   6918afb   pass 1 Failed (12 files rewritten)   pass 2 rc=1, and every
      #                                                  pass after it
      #
      # The advice printed with that red is `git add` on twelve headers that
      # should not exist. A permanently red control, telling you to undo the
      # annotation, is one people learn to ignore.
      #
      # WHAT STILL ENFORCES THE PROPERTY HERE. `reuse lint` — the `reuse` hook
      # below, and `fsfe/reuse-action` in ci.yml, which is where `--no-verify`
      # cannot reach. Measured with reuse 6.2.0 on this tree, one header-less
      # file at a time:
      #
      #   scratchpad/zz.py   reuse lint  rc=0    (the REUSE.toml annotation)
      #   src/zz.py          reuse lint  rc=1    (nothing annotates src/)
      #
      # So the exclusion drops exactly the paths another control already
      # covers, and drops nothing anywhere else: a header-less file under
      # `src/` or `tests/` still reddens this fixer, driven both ways. The CI
      # half of that sentence carries a version-skew hazard: CI lints with
      # reuse 5.1.1 (`fsfe/reuse-action@v5`), this config pins 6.2.0. It is
      # written up at the `reuse` job in ci.yml — where this comment used to
      # say it already was, and it was not.
      #
      # "ONLY 6.2.0 IS INSTALLABLE HERE" AND "5.1.1 CANNOT BE INSTALLED
      # OFFLINE" ARE WITHDRAWN. Both were written here as fact and both were
      # false: reuse 5.1.1 was already on this box, in pip's own wheel cache,
      # before this branch's first commit. THE SKEW IS MEASURED CLOSED on this
      # tree. 5.1.1 was assembled offline from that cache (plus `binaryornot`
      # from pip's http cache; every other requirement came from the pinned
      # 6.2.0 env) and run against this tree beside 6.2.0: both rc=0 at
      # 331/331, both rc=1 at 302/331 with the `scratchpad/**` annotation
      # deleted — the positive control, and it is the same 29 files either way.
      # `lint --json` gives the same 331 PATHS, not just the same total. The
      # commands, the cache paths, the control that proves 5.1.1's own code
      # ran, and the limits of the measurement are all at the `reuse` job in
      # ci.yml. The changelog bound is still recorded there and is no longer
      # the only evidence. WHAT IS STILL SUSPECTED is one link and only one:
      # that `fsfe/reuse-action@v5` carries exactly 5.1.1.
      #
      # THE PINS THEMSELVES ARE STILL GUARDED, because the measurement above is
      # about these two versions and stops being evidence the moment either
      # moves. `tests/test_reuse_pins.py` records the pair
      # (`fsfe/reuse-action@v5` in ci.yml, `rev: v6.2.0` below) and reddens if
      # either moves alone, if either file stops naming both versions in PROSE
      # rather than only in the pin, or if the `scratchpad/**` annotation this
      # exclusion depends on is removed — with a non-vacuity floor on the
      # header-less file count, so it cannot pass by guarding nothing.
      - id: insert-license
        name: insert SPDX headers
        files: \.(py|pyi|sh|toml|ya?ml)$
        exclude: ^scratchpad/
        args:
          - --license-filepath
          - .license-header.txt
          - --comment-style
          - "#"
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: local
    hooks:
      # THE STAGED BLOB IS WHAT GETS COMMITTED, and `insert SPDX headers`
      # above does not look at it. That hook is a FIXER: it reads and rewrites
      # the WORKING TREE. Measured, on a header-less file that had been added:
      #
      #   pre-commit run insert-license --files f   Failed  (worktree rewritten)
      #   git status --short f                      AM
      #   git show :f                               X = 1     <- no header
      #   pre-commit run insert-license --files f   Passed
      #   git show :f                               X = 1     <- still no header
      #
      # So "Passed" was compatible with a header-less blob being the thing
      # committed. The `git commit` path itself is safe — pre-commit stashes
      # unstaged changes there, so the fixer sees the INDEX content and fails
      # again (driven: `pre-commit run` with no `--files` reports Failed with
      # the worktree already fixed) — but `--files` and `--all-files` do not
      # stash, and those are the invocations a developer uses to CHECK.
      #
      # This reads the one channel the fixer never touches: `git show :<path>`.
      # It fires on the DIVERGENCE — worktree has the header, index does not —
      # and not on "the index has no header", because the latter would redden
      # the twelve deliberately header-less `scratchpad/**` files that
      # REUSE.toml now annotates instead of headering.
      #
      # NOT a replacement for `reuse lint`, which is the control that runs
      # where `--no-verify` cannot reach. A pre-commit hook is a client-side
      # courtesy: 14e34a2 landed 12 header-less `.py` files squarely inside
      # the fixer's `files:` regex, with the config byte-identical and the
      # hook installed, and re-running the pinned fixer over those exact blobs
      # rewrites all 12 — so the hook did not run, and no hook can promise it
      # will.
      - id: staged-spdx-header
        name: the SPDX header must be in the blob you are COMMITTING, not just the worktree
        language: system
        entry: >-
          bash -c 'git rev-parse --git-dir >/dev/null 2>&1 ||
          { echo "staged-spdx-header: no git index to read; this hook checked NOTHING." >&2; exit 1; };
          rc=0;
          for f in "$@"; do
          git ls-files --error-unmatch -- "$f" >/dev/null 2>&1 || continue;
          head -5 -- "$f" 2>/dev/null | grep -q "SPDX-License-Identifier" || continue;
          git show ":$f" 2>/dev/null | head -5 | grep -q "SPDX-License-Identifier" && continue;
          echo "$f: the WORKING TREE carries the SPDX header and the STAGED blob does not." >&2;
          echo "    the fixer above corrected the file on disk; you are committing the old blob." >&2;
          echo "    git add -- $f" >&2;
          rc=1;
          done; exit $rc' --
        files: \.(py|pyi|sh|toml|ya?ml)$
      - id: jax-import-hygiene
        name: jax only in _jax_compat; private jax modules banned
        # TWO checks, combined through `rc` rather than through `set -e`.
        # They were `! grep …; ! grep …` under `set -e`, and bash documents
        # that errexit is IGNORED when a command's return value is inverted
        # with `!` — so the FIRST check could not fail this hook, and the
        # hook's status was the second check's alone. Measured, with a bare
        # `import jax` planted under `src/` outside `_jax_compat.py`:
        #
        #   pre-commit run jax-import-hygiene --all-files   Passed   (exit 0)
        #
        # …with the offending line printed in the output. It went Failed only
        # once `jax._src` was ALSO present. The first half of this hook's own
        # name had never been enforceable.
        #
        # THE EXEMPTION IS BY PATH, and it used to be by LINE CONTENT: the
        # first check was `grep -rnE … | grep -v _jax_compat.py`. A grep output
        # line carries the source TEXT as well as the path, so an import that
        # merely MENTIONED the filename filtered itself out. Measured, two
        # planted files under `src/`, one at a time:
        #
        #   src/zz_probe.py   import jax  # mirrors _jax_compat.py   Passed
        #   src/zz_plain.py   import jax                             Failed
        #
        # `--exclude` is grep's own per-FILE name filter and is the same rule
        # the independent test applies (`if path.name == "_jax_compat.py"`), so
        # hook and test now exempt exactly the same set. Driven after the
        # change: the first line Failed, the second still Failed, and the real
        # `src/stelling/_jax_compat.py` — which does import jax, five times —
        # still Passed.
        #
        # THE PROPERTY WAS NEVER UNCOVERED. `tests/test_import_hygiene.py::
        # test_jax_imported_only_in_compat_module` filters by path and reddens
        # on the evading file, so this was a defective control over a covered
        # property rather than an exposure. What the change buys is that the
        # local hook bites on the same set as that test, and that BOTH
        # violations are reported instead of the second only.
        #
        # AND IT PASSED WHEN THERE WAS NOTHING TO SCAN. `grep -r` exits **2**
        # on "no such directory" and **1** on "no match"; `if grep …; then
        # rc=1; fi` reads both as "no violation", and pre-commit prints the
        # green tick over grep's stderr. Measured, in a standalone repository
        # built from this tree:
        #
        #   mv src /elsewhere            pre-commit run … --all-files   Passed
        #   mv src/stelling /elsewhere   (src exists, no .py under it)  Passed
        #
        # That is the shape `staged-spdx-header` above closes for itself with
        # an explicit "this hook checked NOTHING" exit, left unclosed in the
        # two hooks beside it. Both halves are needed and neither implies the
        # other: the CENSUS catches "nothing was there", and the EXIT CODE
        # catches an error partway through a scan that did examine files (an
        # unreadable subdirectory, say) — grep exits 2 having already printed
        # real matches, and 2 is not 1.
        #
        # The census is `grep -c ""` over the same directory with the same
        # `--include`/`--exclude`, so it counts what THIS check would examine
        # and not what some other enumeration would: one output line per file
        # examined, including empty files, which `grep -l` would drop. The two
        # checks scan different sets (only the first exempts `_jax_compat.py`),
        # so they are counted separately.
        language: system
        entry: >-
          bash -c 'census() { grep -rc "" "$@" 2>/dev/null | wc -l; };
          rc=0;
          n1=$(census src --include="*.py" --exclude=_jax_compat.py);
          n2=$(census src --include="*.py");
          if [ "$n1" -eq 0 ] || [ "$n2" -eq 0 ]; then
          echo "jax-import-hygiene: examined $n1 and $n2 files under src/; this hook checked NOTHING and must not report a pass." >&2;
          exit 1; fi;
          grep -rnE "^[[:space:]]*(import jax\b|from jax\b)" src --include="*.py" --exclude=_jax_compat.py; s=$?;
          if [ $s -eq 0 ]; then rc=1;
          elif [ $s -ne 1 ]; then echo "jax-import-hygiene: grep exited $s scanning src/ for jax imports — an ERROR, not \"no match\"." >&2; rc=1; fi;
          grep -rn "jax\._src" src --include="*.py"; s=$?;
          if [ $s -eq 0 ]; then rc=1;
          elif [ $s -ne 1 ]; then echo "jax-import-hygiene: grep exited $s scanning src/ for jax._src — an ERROR, not \"no match\"." >&2; rc=1; fi;
          exit $rc'
        pass_filenames: false
        always_run: true
      - id: library-identifier-hygiene
        name: core prose is library-neutral; provenance lines carry census/design markers
        # ARCHITECTURE.md Rule 2. Logically identical to
        # tests/test_prose_hygiene.py (banned list + marker rule kept in
        # sync there); a divergence between hook and test is a bug. The
        # second grep anchors past "path:lineno:" so a marker in a file
        # PATH (census.py) cannot mask an unmarked line.
        #
        # THE SAME "PASSED WITH NOTHING TO SCAN" AS THE HOOK ABOVE, by a
        # different route: `! grep …` inverts a non-zero, and 2 (no such
        # directory) inverts to success exactly as 1 (no match) does. It was
        # also under `set -e`, which bash documents as IGNORED for a
        # `!`-inverted command, so errexit was never going to catch it either.
        # Measured, in a standalone repository built from this tree:
        #
        #   mv src /elsewhere            pre-commit run … --all-files   Passed
        #   mv src/stelling /elsewhere   (src exists, no .py under it)  Passed
        #
        # Rewritten to say what it counted. The census is `grep -c ""` over
        # `src/stelling` with the same `--include`, so it is a count of what
        # THIS check examines. The pipeline is unrolled because a pipe hides
        # the first grep's exit status, and the first grep's exit status is
        # the whole finding: `grep -rniE … | grep -v …` reports 1 for "the
        # banned words are absent" and for "the directory is absent" alike.
        language: system
        entry: >-
          bash -c 'n=$(grep -rc "" src/stelling --include="*.py" 2>/dev/null | wc -l);
          if [ "$n" -eq 0 ]; then
          echo "library-identifier-hygiene: examined 0 files under src/stelling/; this hook checked NOTHING and must not report a pass." >&2;
          exit 1; fi;
          hits=$(grep -rniE "\b(mime|maddening|lineax|equinox|diffrax|blackjax|optimistix|optax)\b" src/stelling --include="*.py"); s=$?;
          if [ $s -gt 1 ]; then echo "library-identifier-hygiene: grep exited $s scanning src/stelling/ — an ERROR, not \"no match\"." >&2; exit 1; fi;
          if [ $s -eq 1 ]; then exit 0; fi;
          unmarked=$(printf "%s\n" "$hits" | grep -viE "^[^:]*:[0-9]+:.*(census|design/)"); s=$?;
          if [ $s -gt 1 ]; then echo "library-identifier-hygiene: the marker filter exited $s — an ERROR, not \"every line is marked\"." >&2; exit 1; fi;
          if [ $s -eq 1 ]; then exit 0; fi;
          printf "%s\n" "$unmarked" >&2;
          echo "library-identifier-hygiene: the lines above name a library in core prose with no census/design marker (ARCHITECTURE.md Rule 2)." >&2;
          exit 1'
        pass_filenames: false
        always_run: true
