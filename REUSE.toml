version = 1
SPDX-PackageName = "stelling"
SPDX-PackageSupplier = "Nicholas Ehsan Roy <nicholas.ehsan.roy@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/NicholasEhsanRoy/stelling"

# Files that cannot (or should not) carry inline SPDX headers.

[[annotations]]
path = [
  "*.md",
  "design/**",
  "docs/**",
  ".gitignore",
  ".license-header.txt",
  "CITATION.cff",
  "src/stelling/py.typed",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicholas Ehsan Roy"
SPDX-License-Identifier = "Apache-2.0"

# The scratchpad is tracked evidence, not shipped code: `/scratchpad` is absent
# from the sdist allowlist in pyproject.toml and carries a WITHHELD entry in
# tests/test_sdist_contents.py, so nothing under it reaches a consumer. It holds
# pre-registrations, probes and raw evidence in whatever form the measurement
# produced — .py, .gitignore, and formats such as .json or .csv that cannot
# carry a comment at all. The `insert SPDX headers` pre-commit hook is not
# sufficient cover here on two counts, both of which have actually been hit:
# it matches only \.(py|pyi|sh|toml|ya?ml)$, so e8f4838 landed a .gitignore it
# could never have reached; and it only helps when it is run, so 14e34a2 landed
# 12 header-less .py files that are squarely inside its scope. This entry makes
# a new evidence file compliant on arrival whatever its extension. `aggregate`
# (not `override`) means the many scratchpad files that do carry inline headers
# keep them.
[[annotations]]
path = ["scratchpad/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicholas Ehsan Roy"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["DCO"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"

# The marks (name, logo, favicons) are reserved — code open, marks not
# (the Ferrocene split). See LICENSES/LicenseRef-stelling-marks.txt.
[[annotations]]
path = ["assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicholas Ehsan Roy"
SPDX-License-Identifier = "LicenseRef-stelling-marks"
